interface:
  display_name: "Valmera Marketing Films"
  short_description: "Before-and-after films for editors, from real output"
  default_prompt: "Use $valmera-marketing to make one film that markets Valmera to video editors: record what the product does with a clip and a typed sentence (studio.py) if no recording fits, let the workflow find its own idea in those recordings, write the script, stop at the director's look, then render on Valmera's engine, check, deliver once and delete the work folder. Never publish and never pick music."

policy:
  allow_implicit_invocation: false
