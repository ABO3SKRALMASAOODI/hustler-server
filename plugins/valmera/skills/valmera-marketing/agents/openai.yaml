interface:
  display_name: "Valmera Marketing Films"
  short_description: "One command: a marketing film for editors from real Valmera output"
  default_prompt: "Use $valmera-marketing: run market.py (with the user's few words, if any) in the background, wait for it to exit, and report the delivered folder and title from its last JSON line. If it stopped, run the same command again. Never publish and never rate the film."

policy:
  allow_implicit_invocation: false
