interface:
  display_name: "Valmera Podcast Shorts"
  short_description: "A podcast link in, finished shorts out"
  default_prompt: "Use $valmera-podcast-shorts on this link. Run scripts/podcast.py with the link as its only argument, in the background, wait for it to exit without polling, then tell me the delivered folder, the number of shorts and anything that was not made. Ask me nothing else."

policy:
  allow_implicit_invocation: false
