# Track 1A (Matte Stack v2). Words set BEHIND the speaker; the person matte
# is measured once in source space (matte.person) and carried through the
# picture's own framing — a follow crop, cuts, ramps and cards included.
id: type_behind_text
family: type_depth
verb: add_text_behind
stage: texts
params:
  template: [title]
  size_scale: [2.4, 2.0, 3.0]
needs:
  sidecars: [matte.person]
  lane_features: ["ffmpeg:alphamerge", "ffmpeg:overlay"]
  footage: "a person in the shot; any framing (follow crop, cuts, speed ramps and source cards are re-solved)"
binds_to: [word.payoff, phrase_end, section, time]
budget:
  calm: {per_short: 1, min_gap_s: 8}
  designed: {per_short: 2, min_gap_s: 6}
  charged: {per_short: 4, min_gap_s: 4}
never:
  - "small type the whole head hides: bigger type, never smaller"
  - "over footage with no person in it"
  - "inside the payoff hold of another depth device"
owner_flags: {adds_sound: false, adds_zoom: false, flash: false}
rungs: [full, {substitute: type_in_front}, omit]
# cost: CPU-ms per frame of the item's window, measured by
# tools/at1a_matte.py --perf (AT-1A-perf, behind vs the same graphic in
# front): a 9:16 preview adds 8.5 (local), AT-1A-1's 1080x1920 final 37.8
# (the matte's blocks under the window are resampled whole); the
# Cloudflare lanes at the cost model's ms_scale 2.0 (uncalibrated there).
# fixed_ms is an estimate (chunk fetch + graph), not measured apart.
cost:
  ms_per_frame: {interactive: 17.0, batch: 75.6, local: 8.5}
  fixed_ms: 900
exemplars: ["05@0.23–12.23", "09@1.27–21.6", "12@12.875"]
verify: ["glyph_visible>=0.65", "matte_flicker<=0.035", "edge_chatter<=0.002"]
status: live
description: "words set behind the speaker, the subject cut out of every frame through the picture's own framing"
skill: text-graphics
