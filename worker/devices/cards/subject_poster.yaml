# Track 1B device card (subject_poster). Authoring source; compile with
#   cd worker && python -m devices.compiler
id: subject_poster
family: matte_fx
verb: add_subject_effect
fx_type: subject
stage: world
params:
  kind: poster
  field:
  - accent
  - '#f1ede4'
  - black
  keep_footage:
  - true
  - false
  colour:
  - black
  - white
needs:
  sidecars:
  - matte.person
  lane_features:
  - ffmpeg:alphamerge
  - ffmpeg:overlay
  footage: a person in shot (matte coverage >= 0.4% of the frame)
binds_to:
- section
- stress
- word.payoff
- cut
budget:
  calm:
    per_short: 1
    min_gap_s: 6
  designed:
    per_short: 2
    min_gap_s: 4
  charged:
    per_short: 3
    min_gap_s: 2
never:
- over a face-dependent beat (the subject's expression IS the payoff) with keep_footage false
- for longer than the thought it frames
owner_flags:
  adds_sound: false
  adds_zoom: false
  flash: false
rungs:
- full
- substitute: colour_field_card
- omit
cost:
  ms_per_frame:
    interactive: 6.0
    batch: 74.0
    local: 3.0
  fixed_ms: 60
exemplars:
- 23@≈1.3–4.7
- 38@≈0.3–1.0
- 16@4.71–7.08
- 27@≈14.0
verify:
- edge_chatter<=0.002
- matte_flicker<=0.035
- region_locality
status: live
description: the subject cut out on a flat colour field (the Look's accent by default), as
  footage or a silhouette
skill: subject-fx
