# Track 3B. An object segmented through its window (EDL.fx ``object``): the
# laptop, the bottle, the boom mic. Type hides behind it
# (anchor.occluders = object:<id>) or rides it (anchor.to = object:<id>).
id: object_occluder
family: world
verb: select_object
fx_type: object
stage: world
params:
  depth: [auto, front, behind]
needs:
  # measured by the definition itself (world_defs: its seed / prompt /
  # quad key the chunks); a card-level need would ask with default params
  sidecars: []
  lane_features: []
  footage: "a foreground object with a clear outline in front of the type's place"
binds_to: [word, word.payoff, time]
budget:
  calm: {per_short: 1, min_gap_s: 8}
  designed: {per_short: 2, min_gap_s: 5}
  charged: {per_short: 3, min_gap_s: 3}
never:
  - "longer than 6 s (prompt again for the next window)"
  - "an object that covers the speaker's face"
owner_flags: {adds_sound: false, adds_zoom: false, flash: false}
rungs: [full, {substitute: type_in_front}, omit]
cost:
  ms_per_frame: {interactive: 4.0, batch: 4.0, local: 2.0}
  fixed_ms: 300
exemplars: ["08@1.03", "13@5.04", "21@18.6", "21@≈19"]
verify: ["matte_iou>=0.85", "matte_flicker<=0.035"]
status: live
description: "an object the type hides behind or rides"
skill: occlusion
