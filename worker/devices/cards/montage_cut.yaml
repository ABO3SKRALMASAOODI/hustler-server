# Track 2D (montage planner, worker/montage.py). Shots cut to the user's
# track: one cut per beat slot, one frame before the kick, a mode per
# section, no cluster within 6 cuts, scale alternating. One batch.
id: montage_cut
family: rhythm
verb: plan_to_music
stage: pre_captions
params:
  style: [broll, call_response, arc]
  on: [auto, kick, beat, downbeat, snare, stress]
  lead_f: [0, 1, 2]
needs:
  lane_features: ["ffmpeg:overlay"]
  footage: "a pool of clips or stills in the project (b-roll); a user track, else the speech stresses"
binds_to: [beat.kick, beat, downbeat, section, stress]
budget:
  calm: {per_short: 0, min_gap_s: 20}
  designed: {per_short: 1, min_gap_s: 12}
  charged: {per_short: 2, min_gap_s: 6}
never:
  - "on a track the agent picked (the user supplies, names or picks the music)"
  - "strobe sections without the user's ask for flashing"
  - "over a sentence the viewer must watch the speaker say"
owner_flags: {adds_sound: false, adds_zoom: false, flash: false}
rungs: [full, reduced, omit]
cost:
  ms_per_frame: {interactive: 9.0, batch: 7.0, local: 5.0}
  fixed_ms: 400
exemplars: ["22@0-14", "01@0.04-3.79", "15@0-16", "11@0-6", "14@0-8"]
verify: ["land_err_f<=1", "flash_risk"]
status: live
description: "b-roll cut on the kick one frame early, a mode per section, never the same cluster within six cuts"
skill: montage
