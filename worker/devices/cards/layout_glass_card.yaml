# written by add_motion_graphic; video slots filled by slots.py.
id: layout_glass_card
family: layout
verb: add_motion_graphic
stage: motion
params:
  template: [glass_card]
  width: [0.3, 0.24, 0.4]
needs:
  sidecars: []
  lane_features: ["chromium"]
  footage: "any; attach it to a fingertip or beside a face"
binds_to: [word, word.payoff, time]
