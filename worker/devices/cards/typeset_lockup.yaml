# Track 2A (Typesetter v2). A spoken phrase set as poster-scale type,
# solved for the frame: a type voice chosen for the story beat, a layout
# family in the free space around the face, every word on its spoken onset.
# It replaces the captions for the words it shows.
id: typeset_lockup
family: layout
verb: add_typeset
stage: motion
params:
  voice: [auto, magazine, whisper_shout, staircase_red, slot_blackletter, neon_script, editorial_serif, quote_window, condensed_poster, lamp_karaoke, hairline_wide, marker_note, swiss_grid, techno_crt]
  layout: [auto, stack, magazine, staircase, stack_up, justified, side_column, slots, flank, constellation, spread, tilt, quote_window, arc]
  depth: [front, behind, auto]
needs:
  lane_features: [chromium]
  footage: "any program; a face is kept clear (eyes-to-mouth never covered, even behind the subject)"
binds_to: [word.payoff, phrase_end, section, stress, time]
budget:
  calm: {per_short: 1, min_gap_s: 10}
  designed: {per_short: 3, min_gap_s: 6}
  charged: {per_short: 5, min_gap_s: 3}
never:
  - "over a dense explanation: poster type is for a hook, a turn or a payoff"
  - "the same voice as the previous typeset, unless it is a callback"
  - "words the captions also show (it replaces them; it never duplicates them)"
owner_flags: {adds_sound: false, adds_zoom: false, flash: false}
rungs: [full, {substitute: phrase_build}, omit]
# cost: Chromium capture of an SVG page with per-word filters, measured on
# the dev box (try_typeset.py: 5.4 s at 25 fps 1080x1920 = 135 frames in
# ~4.5 s with static-frame reuse); the lanes at ms_scale 2.0.
cost:
  ms_per_frame: {interactive: 60.0, batch: 45.0, local: 33.0}
  fixed_ms: 700
exemplars: ["04@0.5", "09@1.27", "10@0.47", "13@0.2", "15@2.67", "20@3.0"]
verify: ["land_err_f<=1", "legibility>=60"]
status: live
description: "a spoken phrase set as poster-scale type in a voice fitted to the beat, each word on its onset"
skill: typesetting
