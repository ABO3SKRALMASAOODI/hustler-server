# the device_metrics (boards: .valmera/refbench/boards/wave3/).
id: AT-3A-5
track: 3A
title: a doodle tip on a tracked point for 3 s
local_only: true
interim: true
reference:
- ref: '07'
  t:
  - 0.58
  - 6.04
footage:
- vfl: V12
  window: walkon
music: null
aspect: source
mode: engine
harness: at3
edl:
  base: vfl_default
