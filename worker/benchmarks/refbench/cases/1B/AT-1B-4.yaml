# AT-1B-4 (track 1B). Devices are apply_edit_batch operations (the stale-client path).
# Until track 1A's program matte is live, refbench renders these on their substitute rungs;
# tests/test_w1b_acceptance.py runs them with the 1A stand-in and measures every bar.
id: AT-1B-4
track: 1B
title: red ghost clones 4 and 8 frames back (V12 crowd; HC-H/h1 for geometry)
local_only: true
interim: true
reference:
- ref: '40'
  t:
  - 18.3
  - 19.3
  approx: true
  board_t: 18.5
- ref: '22'
  t:
  - 6.0
  - 7.3
  approx: true
footage:
- vfl: V12
  window: walkon
music: null
aspect: '9:16'
mode: engine
edl:
  base: vfl_default
  keep:
  - - 0.3
    - 6.3
  focus:
  - 0.5
  - 0.5
