  op: <=
  value: 2
beyond: every copy is the subject's own earlier frame at its own earlier place (time offset and 0 px shift
  found by search), opacity measured, on every moving person the matte holds
board:
  stills:
  - 2.0
  clip:
  - 1.0
  - 3.0
judges:
  lenses:
  - motion
  - craft
  - owner_rules
  pass: 2of3_no_major
