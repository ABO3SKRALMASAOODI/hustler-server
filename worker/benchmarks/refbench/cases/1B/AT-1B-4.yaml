    layer: fx
    id: sx1
    value:
      id: sx1
      type: subject
      stage: world
      start: 1.0
      end: 3.0
      kind: echo
      device: subject_echo
      echo:
        mode: clone
        offsets_f:
        - 4
        - 8
        opacity: 0.75
        tint: '#ff2a2a'
chat: null
render:
