# AT-1A-3: a push the user asked for, the type SCREEN-LOCKED behind the
# head (composite.stage 'screen': track 1C's slot; the 1A seam composites it
# after the camera through the screen-space matte). Runner:
# worker/tools/at1a_matte.py (registers 1C's slot with VALMERA_FX_PREVIEW=1c).
id: AT-1A-3
track: 1A
title: push 1.00 to 1.26 with the word screen-locked behind the head
local_only: true
interim: false
reference:
  - {ref: "05", t: [1.0, 9.3], approx: false, board_t: 5.0}
footage:
  - {vfl: V01, window: thiel_ai_bigger}
music: null
aspect: "9:16"
mode: engine
edl:
  base: vfl_default
  keep: [[150.4, 162.4]]
  focus: [0.38, 0.4]
  ops:
    - {action: set, layer: effects,
       value: {zooms: [{id: z1, start: 1.0, end: 9.3, mode: push_in, strength: 0.26}]}}
    - {action: upsert, layer: motion, id: h1,
       value: {id: h1, template: word_slam, start: 1.0, end: 9.3,
               layer: behind_subject, composite: {stage: screen},
               params: {text: BIGGER, tier: hero, y: 0.24, entrance: pop}}}
chat: null
render: {variant: final}
allow: [zoom]
metrics:
  - {name: matte_iou, item: h1, op: ">=", value: 0.90}
  - {name: reproj_rms_px, item: h1, op: "<=", value: 1.0}  # glyph bbox drift under the push
beyond: "impossible in Wave 0 (behind graphics rode the zoom): the subject is cut out after the camera from the same matte, so the push and the type are independent"
board: {stills: [1.5, 5.0, 9.0], clip: [1.0, 9.3]}
judges: {lenses: [motion, craft, owner_rules], pass: 2of3_no_major}
