  base: vfl_default
  keep: [[466.0, 470.0], [475.0, 479.0], [484.0, 488.0], [492.0, 496.0]]
  ops:
    - {action: upsert, layer: fx, id: gw_bw_cut, value: {id: gw_bw_cut,
       type: grade_window, stage: world, start: 4.0, end: 8.0,
       saturation: 0.0, contrast: 1.15, device: grade_section,
       bind: {"on": cut, ref: 475.0}}}
    - {action: upsert, layer: fx, id: fi_kal_cut, value: {id: fi_kal_cut,
       type: finish, stage: world, start: 8.0, end: 9.5, kind: kaleidoscope,
       device: finish_kaleidoscope, bind: {"on": cut, ref: 484.0}}}
    - {action: upsert, layer: fx, id: fi_ps_cut, value: {id: fi_ps_cut,
       type: finish, stage: pre_captions, start: 12.0, end: 12.4,
       kind: pixel_stretch, origin: 0.62, direction: left,
       device: finish_pixel_stretch, bind: {"on": cut, ref: 492.0}}}
chat: null
render: {variant: final}
allow: []
metrics:
  - {name: region_locality, op: "<=", value: 0}
  - {name: determinism, op: "<=", value: 0}
device_metrics:
  - {name: section_edges_on_cuts, op: "<=", value: 0}
beyond: "each section is bound to its cut (the cut's source second) and measured to start, and where planned to end, on the exact cut frame; three finish families, each from one sentence, on footage the references never had"
board: {stills: [], clip: null}
judges: {lenses: [motion, craft, owner_rules], pass: owner}
