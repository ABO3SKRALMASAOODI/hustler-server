# Track 1E. Run: cd worker && python -m benchmarks.refbench.at1e AT-1E-7
id: AT-1E-7
track: 1E
title: sections on cut frames (B&W section, kaleidoscope, pixel stretch)
local_only: true
interim: false
reference:
  - {ref: "24", t: [10.7, 12.0], approx: true, board_t: 11.0}
  - {ref: "39", t: [6.0, 8.0], approx: true, board_t: 6.8}
  - {ref: "36", t: [0.0, 0.3], approx: true, board_t: 0.1}
footage:
  - {vfl: V13, window: dragon_stage_walk}
music: null
aspect: "9:16"
mode: engine
