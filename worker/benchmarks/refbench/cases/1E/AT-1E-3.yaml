# Track 1E. Run: cd worker && python -m benchmarks.refbench.at1e AT-1E-3
id: AT-1E-3
track: 1E
title: thermal flip on the Starship launch (the plume runs hot)
local_only: true
interim: false
reference:
  - {ref: "17", t: [1.83, 2.4], approx: false, board_t: 1.83}
  - {ref: "33", t: [5.8, 6.4], approx: true, board_t: 6.0}
footage:
  - {vfl: V13, window: starship_launch_4k60}
music: null
aspect: "9:16"
mode: engine
edl:
  base: vfl_default
  keep: [[21.0, 27.0]]
  focus: [0.47, 0.5]
  ops:
    - {action: upsert, layer: fx, id: fi_heat, value: {id: fi_heat,
       type: finish, stage: world, start: 1.0, end: 2.5, kind: thermal,
       device: finish_thermal}}
chat: null
render: {variant: final}
allow: []
metrics:
  - {name: region_locality, op: "<=", value: 0}
  - {name: determinism, op: "<=", value: 0}
device_metrics:
  # the launch footage itself flickers (control flash_risk 9 in its first
  # second); the device must add none
  - {name: flash_added, op: "<=", value: 0}
  - {name: hot_palette_share, op: ">=", value: 0.8}
  - {name: edge_shift_px, op: "<=", value: 1}
beyond: "the thermal frame is derived from the user's own shot, registered to the pixel (measured), on any shot from one sentence; the references used hand-made or generated thermal plates"
board: {stills: [1.6], clip: [0.0, 4.0]}
judges: {lenses: [motion, craft, owner_rules], pass: 2of3_no_major}
