  neutral: {class: neutral}
  skin: {class: skin}
  set: {class: hue, hue: "#361113", tolerance: 0.08}
chat: null
render: {variant: final}
allow: []
metrics:
  - {name: determinism, op: "<=", value: 0}
device_metrics:
  - {name: neutral_delta_e, op: "<=", value: 3}
  - {name: skin_delta_e, op: "<=", value: 3}
  - {name: set_delta_e, op: "<=", value: 3}
beyond: "two days of the same set brought to one look from one sentence, with the neutral, skin and set colours measured in CIEDE2000 before and after; the reference was matched by eye"
board: {stills: [], clip: null}
judges: {lenses: [motion, craft, owner_rules], pass: 2of3_no_major}
