# Track 1E. Run: cd worker && python -m benchmarks.refbench.at1e AT-1E-6
id: AT-1E-6
track: 1E
title: shot match across two days on the same JRE set
local_only: true
interim: false
reference:
  - {ref: "11", t: [0.8, 1.2], approx: false, board_t: 0.867}
footage:
  - {vfl: V14, window: thiel_jre}
music: null
aspect: "source"
mode: engine
edl:
  base: vfl_default
  keep: [[2195.0, 2203.0]]
