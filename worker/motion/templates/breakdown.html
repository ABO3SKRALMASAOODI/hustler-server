<!--MG-SPEC {"title": "Breakdown", "category": "layout",
 "description": "The edit explaining itself: the program's REAL timeline under the picture — cut, graphics, effects, world devices, music and sound lanes, each with its true device name, and a live playhead that crosses them as the piece plays (ref 19). Data comes from the edit itself at render (truthful by construction): nothing to fill in. A meta, 'how this was made' beat; use for the whole piece or its last seconds.",
 "duration": 10.0, "layer": "above_captions", "mutes_captions": false,
 "params": {
  "position": {"type": "enum", "values": ["bottom", "top"], "default": "bottom"},
  "height": {"type": "float", "min": 0.15, "max": 0.5, "default": 0.26},
  "accent": {"type": "color", "default": "#FF3B30"},
  "title": {"type": "str", "default": "THE EDIT", "max": 30},
  "follow": {"type": "bool", "default": true, "hint": "the timeline window scrolls with the playhead (else the whole program)"}
 },
 "example": {"title": "THE EDIT"},
 "sfx": []} -->
<style>#bk{position:absolute;left:0;top:0;width:100%;height:100%}</style>
<div class="mg-root"><canvas id="bk"></canvas></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, D = MG.duration;
  MG.always();
  const cv = MG.$('#bk'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const doc = P._edl || { duration: D, start: 0, lanes: [], cuts: [] };
  const ph = (P.height ?? 0.26) * H, top = P.position === 'top' ? 0 : H - ph;
  MG.box = [0, top, W, top + ph];
  const k = W / 1080, acc = P.accent || '#FF3B30';
  const lanes = doc.lanes || [];
  const rowH = Math.min(46 * k, (ph - 80 * k) / Math.max(1, lanes.length));
  const span = P.follow === false ? doc.duration : Math.min(doc.duration, 8);
  MG.frame(t => {
    const now = (doc.start || 0) + t;
    const v0 = P.follow === false ? 0 : Math.max(0, Math.min(doc.duration - span, now - span * 0.35));
    const X = s => 150 * k + (s - v0) / span * (W - 175 * k);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(8,8,10,.86)'; ctx.fillRect(0, top, W, ph);
    ctx.fillStyle = '#fff'; ctx.font = `800 ${22 * k}px Inter, sans-serif`; ctx.fillText(String(P.title || '').toUpperCase(), 24 * k, top + 34 * k);
    ctx.font = `600 ${18 * k}px 'JetBrains Mono', monospace`; ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillText(`${now.toFixed(2)}s / ${doc.duration.toFixed(2)}s`, W - 250 * k, top + 34 * k);
    const y0 = top + 56 * k;
    lanes.forEach((ln, i) => {
      const y = y0 + i * rowH;
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = `700 ${15 * k}px 'JetBrains Mono', monospace`;
      ctx.fillText(String(ln.name).toUpperCase(), 18 * k, y + rowH * 0.62);
      for (const it of ln.items || []) {
        const a = X(it.a), b = X(it.b);
        if (b < 150 * k || a > W) continue;
        const live = now >= it.a && now < it.b;
        ctx.fillStyle = live ? acc : (ln.colour || 'rgba(255,255,255,.18)');
        const xa = Math.max(150 * k, a), w = Math.max(3 * k, Math.min(W, b) - xa);
        ctx.beginPath(); ctx.roundRect(xa, y + 4 * k, w, rowH - 8 * k, 6 * k); ctx.fill();
        if (w > 60 * k) { ctx.fillStyle = live ? '#fff' : 'rgba(255,255,255,.8)'; ctx.font = `700 ${13 * k}px Inter, sans-serif`; ctx.fillText(String(it.label || '').slice(0, Math.floor(w / (8 * k))), xa + 8 * k, y + rowH * 0.62); }
      }
    });
    for (const c of doc.cuts || []) { const x = X(c); if (x < 150 * k || x > W) continue; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y0, 2 * k, lanes.length * rowH); }
    const px = X(now);
    ctx.fillStyle = acc; ctx.fillRect(px - 1.5 * k, y0 - 10 * k, 3 * k, lanes.length * rowH + 14 * k);
    ctx.beginPath(); ctx.moveTo(px - 9 * k, y0 - 16 * k); ctx.lineTo(px + 9 * k, y0 - 16 * k); ctx.lineTo(px, y0 - 4 * k); ctx.fill();
  });
})();
</script>
