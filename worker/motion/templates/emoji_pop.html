<!--MG-SPEC {"title": "Emoji pop", "category": "callout",
 "description": "1-3 emoji (or a short symbol like '$' or '?!') pop in with a spring overshoot and a small ray burst, then bob gently. Use sparingly on an emotional beat or punchline, placed in empty space beside the face (x/y); never as decoration on every line.",
 "duration": 2.0, "layer": "above_captions", "mutes_captions": false,
 "params": {
  "emoji": {"type": "list", "required": true, "max_items": 3, "max": 8, "hint": "1-3 emoji, e.g. ['🤯'] or ['💸','📉']"},
  "x": {"type": "float", "min": 0.08, "max": 0.92, "default": 0.72, "hint": "centre x of the group, frame fraction"},
  "y": {"type": "float", "min": 0.08, "max": 0.82, "default": 0.32, "hint": "centre y of the group, frame fraction"},
  "size": {"type": "float", "min": 0.6, "max": 1.6, "default": 1.0},
  "burst": {"type": "bool", "default": true},
  "burst_color": {"type": "color", "default": "#FFFFFF"}
 },
 "example": {"emoji": ["🤯"], "x": 0.7, "y": 0.3},
 "sfx": [{"at": 0.04, "kind": "pop_bright", "repeat": {"param": "emoji", "from": 0.04, "every": 0.12}}]} -->
<style>
  .em{position:absolute;left:0;top:0;line-height:1;white-space:nowrap;text-align:center;
      font-family:'Apple Color Emoji','Noto Color Emoji','Segoe UI Emoji','Inter Display',sans-serif;
      text-shadow:0 14px 20px rgba(0,0,0,.34),0 3px 6px rgba(0,0,0,.22);will-change:transform,opacity}
  .em.sym{font-family:'Inter Display','Inter',sans-serif;font-weight:900;letter-spacing:-.04em;color:#fff;
      text-shadow:0 10px 22px rgba(0,0,0,.42),0 2px 4px rgba(0,0,0,.3)}
  svg.fx{position:absolute;left:0;top:0;overflow:visible}
</style>
<div class="mg-root"><svg class="fx" id="fx"></svg></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, D = MG.duration, S = P.size;
  const root = MG.$('.mg-root'), fx = MG.$('#fx'), NS = 'http://www.w3.org/2000/svg';
  const list = (P.emoji || []).map(s => String(s).trim()).filter(Boolean).slice(0, 3);
  if (!list.length) list.push('✨');
  const n = list.length, EACH = 0.12;
  // emoji or a short typographic symbol ('$', '?!', '+1')
  const isEmoji = s => /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(s);
  const base = (n === 1 ? 190 : n === 2 ? 168 : 148) * S;
  // hand-placed group layouts (offsets in units of base, rest angles in deg)
  const LAY = {
    1: [[0, 0, -6]],
    2: [[-0.56, 0.06, -12], [0.56, -0.08, 9]],
    3: [[-1.02, 0.16, -14], [0, -0.14, 3], [1.02, 0.12, 13]],
  }[n];
  const items = list.map((s, i) => {
    const el = MG.el('div', 'em' + (isEmoji(s) ? '' : ' sym'), s, root);
    const g = document.createElementNS(NS, 'g');
    fx.appendChild(g);
    return { el, g, s, i, rays: [], dots: [] };
  });
  let G = null;

  function layout() {
    const cx0 = P.x * W, cy0 = P.y * H;
    // keep the whole group inside the safe area
    const half = (Math.max(...LAY.map(l => Math.abs(l[0]))) + 0.62) * base;
    const safe = H / W > 1.5 ? [60, 0.08 * H, W - 60, 0.80 * H] : [40, 0.05 * H, W - 40, 0.95 * H];
    const cx = MG.clamp(cx0, safe[0] + half, safe[2] - half), cy = MG.clamp(cy0, safe[1] + base * 0.7, safe[3] - base * 0.7);
    const out = items.map((it, i) => {
      const [ox, oy, rot] = LAY[i];
      const fs = it.el.classList.contains('sym') ? base * 0.86 : base;
      it.el.style.fontSize = fs + 'px';
      const r = it.el.getBoundingClientRect();
      const x = cx + ox * base, y = cy + oy * base;
      it.el.style.left = (x - r.width / 2) + 'px';
      it.el.style.top = (y - r.height / 2) + 'px';
      it.el.style.transformOrigin = '50% 62%';
      const rnd = MG.rand(17 + i * 31 + it.s.codePointAt(0) % 97);
      const R = Math.max(r.width, r.height) * 0.5;
      const nr = 9;
      for (let k = 0; k < nr; k++) {
        const a = (k / nr) * Math.PI * 2 + (rnd() - 0.5) * 0.5 - Math.PI / 2;
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('stroke', P.burst_color); ln.setAttribute('stroke-linecap', 'round');
        it.g.appendChild(ln);
        it.rays.push({ el: ln, a, r0: R * (0.78 + rnd() * 0.12), r1: R * (1.42 + rnd() * 0.32), w: (5.5 + rnd() * 2.5) * S, d: rnd() * 0.04 });
      }
      for (let k = 0; k < 5; k++) {
        const a = rnd() * Math.PI * 2;
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('fill', P.burst_color);
        it.g.appendChild(c);
        it.dots.push({ el: c, a, r0: R * 0.9, r1: R * (1.65 + rnd() * 0.45), s: (4 + rnd() * 3.5) * S, d: 0.03 + rnd() * 0.05 });
      }
      return { x, y, rot, R, phase: rnd() * Math.PI * 2 };
    });
    const pad = base * 1.2;
    const xs = out.map(o => o.x), ys = out.map(o => o.y);
    MG.box = [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) + pad, Math.max(...ys) + pad + 30];
    return out;
  }

  const fontsReady = Promise.all(["900 160px 'Inter Display'"].map(f => document.fonts.load(f).catch(() => null)));
  MG.ready = fontsReady.then(() => { G = layout(); });

  const exitDur = Math.min(0.22, D * 0.15), exitAt = D - exitDur;
  MG.always();   // the hold bobs, so every frame is live (the box is small)
  MG.frame(t => {
    if (!G) G = layout();
    items.forEach((it, i) => {
      const o = G[i], t0 = 0.04 + i * EACH;
      // spring: 0 -> ~1.15 -> settle (zeta ~0.5)
      const k = MG.spring(t, t0 - 0.04, { stiffness: 430, damping: 21 });
      const q = MG.ease.inBack(MG.range(t, exitAt + (n - 1 - i) * 0.03, exitDur - (n - 1) * 0.03));
      const bob = Math.sin((t - t0) * 2 * Math.PI / 1.7 + o.phase) * 7 * S * MG.range(t, t0 + 0.25, 0.4);
      const sway = Math.sin((t - t0) * 2 * Math.PI / 2.3 + o.phase) * 2.2 * MG.range(t, t0 + 0.25, 0.4);
      const rot = o.rot + (1 - k) * (i % 2 ? 28 : -28) + sway;
      MG.set(it.el, { y: bob + (1 - Math.min(1, k)) * 24 * S, rotate: rot, scale: Math.max(0, k * (1 - q)), opacity: MG.range(t, t0 - 0.04, 0.05) });
      // burst
      if (!P.burst) { it.g.style.display = 'none'; return; }
      it.rays.forEach(r => {
        const p = MG.range(t, t0 + r.d, 0.34);
        if (p <= 0 || p >= 1) { r.el.setAttribute('stroke-width', 0); return; }
        const head = MG.ease.outCubic(p), tail = MG.ease.inQuad(p);
        const a = MG.lerp(r.r0, r.r1, tail), b = MG.lerp(r.r0, r.r1, head);
        const cs = Math.cos(r.a), sn = Math.sin(r.a);
        r.el.setAttribute('x1', (o.x + cs * a).toFixed(1)); r.el.setAttribute('y1', (o.y + sn * a).toFixed(1));
        r.el.setAttribute('x2', (o.x + cs * b).toFixed(1)); r.el.setAttribute('y2', (o.y + sn * b).toFixed(1));
        r.el.setAttribute('stroke-width', (r.w * (1 - p * 0.55)).toFixed(2));
      });
      it.dots.forEach(d => {
        const p = MG.range(t, t0 + d.d, 0.42);
        if (p <= 0 || p >= 1) { d.el.setAttribute('r', 0); return; }
        const rr = MG.lerp(d.r0, d.r1, MG.ease.outCubic(p));
        d.el.setAttribute('cx', (o.x + Math.cos(d.a) * rr).toFixed(1));
        d.el.setAttribute('cy', (o.y + Math.sin(d.a) * rr).toFixed(1));
        d.el.setAttribute('r', (d.s * (1 - MG.ease.inQuad(p))).toFixed(2));
      });
    });
  });
})();
</script>
