<!--MG-SPEC {"title": "Notification banner", "category": "social",
 "description": "A phone notification banner (app icon, app name, title, message, time) that springs down in a frosted light or dark material; 'more' (0-2 follow-up messages) stack on top like a real lock screen. Use when the speaker mentions a message, alert, payout, sale or DM arriving, or to stage a quote as a text.",
 "duration": 3.0, "layer": "above_captions", "mutes_captions": false,
 "params": {
  "title": {"type": "str", "required": true, "max": 60, "hint": "bold first line, e.g. a sender or headline"},
  "body": {"type": "text", "default": "", "max": 150, "hint": "message text (wraps up to 4 lines)"},
  "app": {"type": "str", "default": "Messages", "max": 28, "hint": "app name shown small above the title; its first letter is the icon when no icon image is given"},
  "time": {"type": "str", "default": "now", "max": 14},
  "icon": {"type": "asset", "default": null, "hint": "optional square app icon / avatar image"},
  "color": {"type": "color", "default": "#2F7CF6", "hint": "icon tile colour when no icon image"},
  "theme": {"type": "enum", "values": ["light", "dark"], "default": "light"},
  "more": {"type": "list", "default": [], "max_items": 2, "max": 120, "hint": "0-2 follow-up messages from the same sender; each drops in on top (at 1.0 s, then every 0.85 s) and stacks the older ones behind"},
  "y": {"type": "float", "min": 0.08, "max": 0.85, "default": 0.15, "hint": "vertical centre as frame fraction"},
  "scale": {"type": "float", "min": 0.7, "max": 1.1, "default": 1.0}
 },
 "example": {"app": "Bank", "title": "Payment received", "body": "You received $4,250.00 from Studio North for invoice #1042.", "more": ["You received $1,900.00 from Lumen Labs."]},
 "sfx": [{"at": 0.04, "kind": "notification"},
         {"at": 1.0, "kind": "notification", "repeat": {"param": "more", "from": 1.0, "every": 0.85}}]} -->
<style>
  .mg-root{font-family:'Inter','Inter Display',system-ui,sans-serif}
  #stage{position:absolute;left:0;top:0}
  .nt{position:absolute;left:0;top:0;width:100%;transform-origin:50% 0;will-change:transform,opacity}
  .plate{position:absolute;left:0;top:0;width:100%;border-radius:calc(25 * var(--u));overflow:hidden;
    background:var(--fill);box-shadow:var(--shadow)}
  .plate::before{content:"";position:absolute;inset:0;background-image:var(--noise);background-size:220px 220px;opacity:var(--grain)}
  .plate::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--rim)}
  .dim{position:absolute;inset:0;background:var(--dimc);opacity:0}
  .ct{position:relative;display:flex;align-items:flex-start;gap:calc(11 * var(--u));
    padding:calc(13 * var(--u)) calc(15 * var(--u)) calc(14 * var(--u)) calc(13 * var(--u))}
  .ic{flex:0 0 auto;width:calc(40 * var(--u));height:calc(40 * var(--u));border-radius:calc(9.4 * var(--u));
    overflow:hidden;position:relative;margin-top:calc(1 * var(--u));
    box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.12)}
  .ic img{width:100%;height:100%;object-fit:cover;display:block}
  .ic .lt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Inter Display','Inter',sans-serif;font-weight:800;color:#fff;font-size:calc(21 * var(--u));
    letter-spacing:-0.02em;text-shadow:0 1px 1px rgba(0,0,0,.18)}
  .tx{flex:1 1 auto;min-width:0}
  .hd{display:flex;align-items:baseline;gap:calc(8 * var(--u));font-size:calc(13 * var(--u));line-height:1.25;
    color:var(--sec);font-weight:500;letter-spacing:-0.005em;margin-bottom:calc(1.5 * var(--u))}
  .app{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm{flex:0 0 auto;font-weight:400;font-variant-numeric:tabular-nums}
  .ti{font-size:calc(15.5 * var(--u));line-height:1.28;font-weight:600;color:var(--fg);letter-spacing:-0.017em;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .bd{font-size:calc(15.5 * var(--u));line-height:1.3;font-weight:400;color:var(--fg);letter-spacing:-0.012em;
    margin-top:calc(1 * var(--u));display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;opacity:.92}
  .bd:empty{display:none}
</style>
<div class="mg-root"><div id="stage"></div></div>
<script>
(() => {
  const P = MG.params, root = document.documentElement, D = MG.duration;
  const dark = P.theme === 'dark';
  // Frosted material: true backdrop blur of the video is not available, so
  // the plates are a tinted fill + fine grain + inner rim light, and the
  // WHOLE stack is made translucent as one group (the footage reads through
  // faintly, stacked plates never show through each other).
  const noise = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'>" +
    "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/>" +
    "<feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.1 -.3'/></filter>" +
    "<rect width='100%' height='100%' filter='url(%23n)'/></svg>\")";
  const T = dark ? {
    fill: 'linear-gradient(180deg, rgb(54,54,58), rgb(37,37,41))', fg: '#F5F5F7',
    sec: 'rgba(235,235,245,.58)', rim: 'inset 0 0 0 1px rgba(255,255,255,.09), inset 0 1px 0 rgba(255,255,255,.10)',
    shadow: '0 2px 6px rgba(0,0,0,.25), 0 16px 44px rgba(0,0,0,.42)', grain: .22, dimc: 'rgba(0,0,0,.35)'
  } : {
    fill: 'linear-gradient(180deg, rgb(252,252,253), rgb(239,239,243))', fg: '#0B0B0D',
    sec: 'rgba(60,60,67,.62)', rim: 'inset 0 0 0 1px rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.04)',
    shadow: '0 2px 6px rgba(0,0,0,.10), 0 16px 44px rgba(0,0,0,.30)', grain: .16, dimc: 'rgba(120,120,128,.28)'
  };
  root.style.setProperty('--fill', T.fill); root.style.setProperty('--fg', T.fg);
  root.style.setProperty('--sec', T.sec); root.style.setProperty('--rim', T.rim);
  root.style.setProperty('--shadow', T.shadow); root.style.setProperty('--grain', T.grain);
  root.style.setProperty('--noise', noise); root.style.setProperty('--dimc', T.dimc);

  const W = Math.min(1010, 960 * P.scale, MG.H * 0.9), u = W / 360;   // H cap keeps 16:9 phone-sized
  root.style.setProperty('--u', u + 'px');
  const stage = MG.$('#stage');
  stage.style.width = W + 'px';
  stage.style.left = ((MG.W - W) / 2) + 'px';
  stage.style.opacity = dark ? 0.94 : 0.92;

  const hex = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
  const tint = (c, k) => { const v = hex(c).map(x => Math.round(k > 0 ? x + (255 - x) * k : x * (1 + k))); return `rgb(${v.join(',')})`; };
  const letter = (Array.from(String(P.app || P.title || '•').replace(/^[^\p{L}\p{N}\p{Extended_Pictographic}]+/u, ''))[0] || '•').toUpperCase();

  const msgs = [String(P.body || '')].concat((P.more || []).filter(Boolean));
  const cards = msgs.map((body, k) => {
    const el = MG.el('div', 'nt', null, stage);
    el.style.zIndex = String(10 + k);
    const plate = MG.el('div', 'plate', null, el);
    const dim = MG.el('div', 'dim', null, plate);
    const ct = MG.el('div', 'ct', null, el);
    const ic = MG.el('div', 'ic', null, ct);
    if (P.icon) { const im = MG.el('img', null, null, ic); im.src = P.icon; }
    else {
      ic.style.background = `linear-gradient(180deg, ${tint(P.color, .18)}, ${tint(P.color, -.12)})`;
      MG.el('div', 'lt', letter, ic);
    }
    const tx = MG.el('div', 'tx', null, ct);
    const hd = MG.el('div', 'hd', null, tx);
    MG.el('span', 'app', P.app || '', hd);
    MG.el('span', 'tm', P.time || '', hd);
    MG.el('div', 'ti', P.title, tx);
    MG.el('div', 'bd', body, tx);
    return { el, plate, dim, ct, t0: k === 0 ? 0 : 1.0 + (k - 1) * 0.85 };
  });
  // Measure only once the bundled fonts are loaded (script time still uses
  // fallback metrics); the renderer awaits MG.ready before capturing.
  let L = null, travel = 0, peek = 0, exitDur = 0, exitAt = 0;
  const layout = () => {
    cards.forEach(c => { c.h = c.ct.getBoundingClientRect().height; c.plate.style.height = c.h + 'px'; });
    // Place: the tallest card is centred on y; clamp into the frame.
    const maxH = Math.max(...cards.map(c => c.h));
    peek = 9 * u;
    const blockH = maxH + (cards.length > 1 ? peek * Math.min(2, cards.length - 1) : 0);
    let top = MG.H * P.y - blockH / 2;
    top = MG.clamp(top, MG.H * 0.035, Math.max(MG.H * 0.035, MG.H * 0.93 - blockH));
    stage.style.top = top + 'px';
    travel = Math.min(top + maxH + 30, 240 * W / 960);
    const sideX = (MG.W - W) / 2;
    MG.box = [sideX - 70, top - travel - 70, sideX + W + 70, top + blockH + 90];
    exitDur = Math.min(0.26, D * 0.12); exitAt = D - exitDur;
    const wins = [[0, 0.8], [exitAt - 0.02, D]];
    cards.slice(1).forEach(c => wins.push([c.t0 - 0.06, c.t0 + 0.85]));   // older content fades from t0 - 0.04
    MG.active(wins);
    return true;
  };
  document.body.offsetHeight;   // start the font loads
  MG.ready = document.fonts.ready.then(() => { if (!L) L = layout(); });

  MG.frame(t => {
    if (!L) L = layout();
    // Which cards have arrived, newest on top.
    cards.forEach((c, k) => {
      if (t < c.t0) { c.el.style.opacity = 0; return; }
      const p = MG.spring(t, c.t0, { stiffness: 280, damping: 23 });
      const s = {
        y: -(1 - p) * travel,
        scale: 0.93 + 0.07 * Math.min(p, 1.02),
        opacity: k === 0 ? 0.3 + 0.7 * MG.range(t, 0, 0.08) : MG.range(t, c.t0, 0.08),
        blur: (1 - MG.range(t, c.t0, 0.17)) * 7
      };
      // Recede behind every newer card that has arrived (iOS stack): the
      // content fades just before the new banner lands, the plate shrinks
      // to the new banner's height and peeks out below it.
      let depth = 0, rec = 0, fade = 0, topH = c.h;
      for (let j = k + 1; j < cards.length; j++) {
        if (t >= cards[j].t0 - 0.04) {
          const q = MG.spring(t, cards[j].t0 + 0.02, { stiffness: 260, damping: 28 });
          depth += Math.min(q, 1); rec = Math.max(rec, Math.min(q, 1)); topH = cards[j].h;
          fade = Math.max(fade, MG.range(t, cards[j].t0 - 0.04, 0.09));
        }
      }
      if (depth > 0 || fade > 0) {
        const hNow = MG.lerp(c.h, topH, rec);
        c.plate.style.height = hNow + 'px';
        c.ct.style.opacity = 1 - fade;
        c.dim.style.opacity = MG.clamp(depth * 0.55);
        const sc = 1 - 0.055 * depth;
        // keep the plate's bottom peeking `peek` below the card above it
        s.y += rec * (topH - hNow * sc) + peek * depth;
        s.scale *= sc;
        if (depth > 2.01) s.opacity *= Math.max(0, 1 - (depth - 2) * 2);
      } else {
        c.plate.style.height = c.h + 'px'; c.ct.style.opacity = 1; c.dim.style.opacity = 0;
      }
      if (t > exitAt) {
        const q = MG.ease.inCubic(MG.range(t, exitAt, exitDur));
        s.y -= q * Math.min(travel, 160);
        s.opacity *= 1 - q;
        s.blur = (s.blur || 0) + q * 5;
      }
      MG.set(c.el, s);
    });
  });
})();
</script>
