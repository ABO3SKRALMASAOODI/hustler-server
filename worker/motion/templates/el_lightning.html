 "description": "A seeded lightning bolt that strikes on its times (item seconds in 'at': a transient of the user's track, a hard consonant) from one point to another, branching, white-hot core with a coloured glow, 2-3 frames per strike then an afterglow. Composite as light (blend screen). One strike lands a word; a storm is for a drop the user's track earns. Never a full-frame flash.",
 "duration": 1.5, "layer": "above_captions", "mutes_captions": false,
 "params": {

 },

<style>#lt{position:absolute;left:0;top:0;width:100%;height:100%}</style>
<div class="mg-root"><canvas id="lt"></canvas></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, fps = MG.fps;
  const cv = MG.$('#lt'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const hex = String(P.colour || '#9FC8FF').slice(1), v = parseInt(hex, 16);
  const col = `${v >> 16 & 255},${v >> 8 & 255},${v & 255}`;
  const strikes = (P.at && P.at.length ? P.at : ['0']).map(Number).filter(isFinite).sort((a, b) => a - b);
  const hold = Math.max(1, P.hold_f || 2) / fps, tail = 6 / fps;
  const seed = Math.max(1, Math.round(P.seed || 11));
  const scale = Math.min(W, H) / 1080;
  const X0 = (P.x0 ?? 0.5) * W, Y0 = (P.y0 ?? 0) * H, X1 = (P.x1 ?? 0.5) * W, Y1 = (P.y1 ?? 0.55) * H;
  const bolts = strikes.map((s, k) => MG.lightning.bolt(seed + k * 31, X0, Y0, X1, Y1, { gen: 7, jag: 0.34, branch: P.branch ?? 0.3 }));
  MG.frame(t => {
    ctx.clearRect(0, 0, W, H);
    strikes.forEach((s, k) => {
      const a = t - s;
      if (a < 0 || a > hold + tail) return;
      // full for hold_f frames, a one-frame re-strike flicker, then decay
      let alpha = a <= hold ? 1 : Math.max(0, 1 - (a - hold) / tail);
      if (a > hold && a < hold + 1.5 / fps) alpha = 0.35;
      MG.lightning.draw(ctx, bolts[k], { colour: col, width: 5.0 * scale * (P.width ?? 1), glow: 9, alpha });
    });
  });
})();
</script>
