<!--MG-SPEC {"title": "Chat bubbles", "category": "social",
 "description": "A text-message thread: bubbles spring in one by one (me = right/blue, them = left/grey), 'them' messages are preceded by a typing indicator, and the thread scrolls up like a real chat. Use to dramatise a conversation, DM, pitch or exchange the speaker describes (keep each message short).",
 "duration": 4.0, "layer": "above_captions", "mutes_captions": false,
 "params": {
  "messages": {"type": "rows", "required": true, "fields": ["text", "side", "at"], "max_items": 8, "max": 120,
    "hint": "[{text, side: me|them, at}] in order; 'at' (optional) = item seconds the bubble lands, otherwise one every 0.75 s from 0.25 s (sounds follow that cadence); allow ~0.75 s per message + 1 s"},
  "name": {"type": "str", "default": "", "max": 28, "hint": "optional contact name shown above the thread"},
  "time": {"type": "str", "default": "", "max": 28, "hint": "optional timestamp label above the first message, e.g. Today 9:41 AM"},
  "theme": {"type": "enum", "values": ["dark", "light"], "default": "dark"},
  "y": {"type": "float", "min": 0.3, "max": 0.85, "default": 0.62, "hint": "where the newest message sits (bottom of the thread) as frame fraction"},
  "scale": {"type": "float", "min": 0.7, "max": 1.3, "default": 1.0}
 },
 "example": {"messages": [{"text": "did you see the numbers?", "side": "them"}, {"text": "47k views in 2 hours", "side": "me"}, {"text": "wait WHAT", "side": "them"}, {"text": "told you the hook mattered", "side": "me"}]},
 "sfx": [{"at": 0.25, "kind": "pop_soft", "repeat": {"param": "messages", "from": 0.25, "every": 0.75}}]} -->
<style>
  .mg-root{font-family:'Inter','Inter Display',system-ui,sans-serif}
  #vp{position:absolute;left:0;top:0;overflow:visible}
  #th{position:absolute;left:0;top:0;width:100%;will-change:transform}
  .it{position:absolute;left:0;width:100%}
  .bw{position:absolute;max-width:74%;will-change:transform,opacity}
  .bw.me{right:calc(8 * var(--u));transform-origin:100% 100%}
  .bw.them{left:calc(8 * var(--u));transform-origin:0 100%}
  .bb{position:relative;padding:calc(9 * var(--u)) calc(14 * var(--u)) calc(10 * var(--u));border-radius:calc(20 * var(--u));
    font-size:calc(17 * var(--u));line-height:1.3;letter-spacing:-0.012em;white-space:pre-wrap;word-wrap:break-word;filter:var(--bshadow)}
  .bb.me{background:linear-gradient(180deg,#3B8BFF,#2470F2);color:#fff}
  .bb.them{background:var(--them);color:var(--themfg);box-shadow:inset 0 0 0 1px var(--themrim)}
  .bb.jumbo{background:none;box-shadow:none;padding:0 calc(4 * var(--u));font-size:calc(46 * var(--u));line-height:1.1;letter-spacing:0}
  .bb svg.tail{position:absolute;bottom:0;width:calc(20 * var(--u));height:calc(20 * var(--u));overflow:visible}
  .bb.me svg.tail{right:0}
  .bb.them svg.tail{left:0;transform:scaleX(-1)}
  .bb .txt{position:relative}
  .ty{position:absolute;left:calc(8 * var(--u));width:calc(66 * var(--u));height:calc(40 * var(--u));border-radius:calc(20 * var(--u));
    background:var(--them);transform-origin:0 100%;will-change:transform,opacity}
  .ty i{position:absolute;top:50%;width:calc(8.5 * var(--u));height:calc(8.5 * var(--u));margin-top:calc(-4.25 * var(--u));border-radius:50%;background:var(--dot)}
  .ty .t1{position:absolute;left:calc(-3 * var(--u));bottom:calc(-1 * var(--u));width:calc(13 * var(--u));height:calc(13 * var(--u));border-radius:50%;background:var(--them)}
  .ty .t2{position:absolute;left:calc(-8 * var(--u));bottom:calc(-7 * var(--u));width:calc(6.5 * var(--u));height:calc(6.5 * var(--u));border-radius:50%;background:var(--them)}
  .lbl{position:absolute;left:0;width:100%;text-align:center;font-size:calc(12.5 * var(--u));color:var(--sec);letter-spacing:-0.005em;font-weight:500}
  .lbl b{font-weight:600}
  .rc{position:absolute;right:calc(12 * var(--u));font-size:calc(12 * var(--u));color:var(--sec);font-weight:500}
  .hdr{position:absolute;left:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(5 * var(--u))}
  .hdr .av{width:calc(48 * var(--u));height:calc(48 * var(--u));border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:calc(20 * var(--u));background:linear-gradient(180deg,#A2A7B3,#7C818D)}
  .hdr .nm{font-size:calc(13 * var(--u));color:var(--fg);font-weight:500;letter-spacing:-0.01em}
</style>
<div class="mg-root"><div id="vp"><div id="th"></div></div></div>
<script>
(() => {
  const P = MG.params, root = document.documentElement, D = MG.duration;
  const dark = P.theme !== 'light';
  const T = dark ? { themrim: 'rgba(255,255,255,.07)', them: '#2A2A2E', themfg: '#F5F5F7', sec: 'rgba(235,235,245,.62)', fg: '#F5F5F7', dot: 'rgba(235,235,245,.62)' }
                 : { themrim: 'rgba(0,0,0,0)', them: '#E9E9EC', themfg: '#0B0B0D', sec: 'rgba(60,60,67,.66)', fg: '#0B0B0D', dot: 'rgba(60,60,67,.55)' };
  const W = Math.min(1000, 900 * P.scale, MG.H * 0.9), u = W / 310;   // H cap for 16:9
  Object.entries({ '--themrim': T.themrim, '--them': T.them, '--themfg': T.themfg, '--sec': T.sec, '--fg': T.fg, '--dot': T.dot, '--u': u + 'px' })
    .forEach(([k, v]) => root.style.setProperty(k, v));
  const vp = MG.$('#vp'), th = MG.$('#th');
  vp.style.width = W + 'px'; vp.style.left = ((MG.W - W) / 2) + 'px';
  // soft legibility shadow on every bubble (static inside each bubble's layer)
  root.style.setProperty('--bshadow', dark ? 'drop-shadow(0 3px 9px rgba(0,0,0,.35))' : 'drop-shadow(0 3px 10px rgba(0,0,0,.2))');

  // ── messages + timing ────────────────────────────────────────────────
  const rows = (P.messages || []).map(r => ({ text: String(r.text || '').trim(), side: /^(me|right|you|sent)$/i.test(String(r.side || '').trim()) ? 'me' : 'them', at: parseFloat(r.at) }))
    .filter(r => r.text);
  const n = rows.length;
  const every = n > 1 && 0.25 + (n - 1) * 0.75 > D - 0.55 ? Math.max(0.3, (D - 0.8 - 0.25) / (n - 1)) : 0.75;
  let prev = -1;
  rows.forEach((r, i) => {
    let t = isFinite(r.at) && r.at >= 0 ? r.at : 0.25 + i * every;
    if (i > 0 && t < prev + 0.25) t = prev + 0.25;
    r.t = Math.min(t, Math.max(0, D - 0.6)); prev = r.t;
  });

  const tailPath = 'M -13 -18 C -13 -8 -9 -2.2 5.5 0 C -1 1.4 -9.5 .6 -18.5 -3.6 Z';
  const tail = (fill) => `<svg class="tail" viewBox="-20 -20 20 20"><path d="${tailPath}" fill="${fill}"/></svg>`;
  const items = [];   // {el, top, h, kind, row}
  let hdr = null, lbl = null;
  if (String(P.name || '').trim()) {
    hdr = MG.el('div', 'it hdr', null, th);
    const nm = String(P.name).trim();
    MG.el('div', 'av', (Array.from(nm)[0] || '•').toUpperCase(), hdr);
    MG.el('div', 'nm', nm, hdr);
  }
  if (String(P.time || '').trim()) {
    lbl = MG.el('div', 'it lbl', null, th);
    const tm = String(P.time).trim(), sp = tm.indexOf(' ');
    if (sp > 0 && /^[A-Za-z]+$/.test(tm.slice(0, sp))) { MG.el('b', null, tm.slice(0, sp), lbl); lbl.appendChild(document.createTextNode(tm.slice(sp))); }
    else lbl.textContent = tm;
  }
  rows.forEach((r, i) => {
    const it = MG.el('div', 'it', null, th);
    const w = MG.el('div', 'bw ' + r.side, null, it);
    const b = MG.el('div', 'bb ' + r.side, null, w);
    const last = i === n - 1 || rows[i + 1].side !== r.side;
    // emoji-only messages render big without a bubble (like real chat apps)
    const jumbo = /^[\p{Extended_Pictographic}\p{Emoji_Component}\u200d\ufe0f\s]+$/u.test(r.text) && !/[0-9#*]/.test(r.text)
      && Array.from(r.text.replace(/\s/g, '').replace(/[\u200d\ufe0f]|\p{Emoji_Modifier}/gu, '')).length <= 3;
    if (jumbo) b.classList.add('jumbo');
    else if (last) b.insertAdjacentHTML('beforeend', tail(r.side === 'me' ? '#2470F2' : T.them));
    else b.style[r.side === 'me' ? 'borderBottomRightRadius' : 'borderBottomLeftRadius'] = (7 * u) + 'px';
    if (i > 0 && rows[i - 1].side === r.side) b.style[r.side === 'me' ? 'borderTopRightRadius' : 'borderTopLeftRadius'] = (7 * u) + 'px';
    MG.el('span', 'txt', r.text, b);
    let ty = null;
    if (r.side === 'them') {
      ty = MG.el('div', 'ty', null, it);
      MG.el('div', 't2', null, ty); MG.el('div', 't1', null, ty);
      [0, 1, 2].forEach(k => { const d = MG.el('i', null, null, ty); d.style.left = ((15 + k * 13) * u) + 'px'; });
    }
    items.push({ it, w, b, ty, r, i, last });
  });
  let rc = null;
  if (n && rows[n - 1].side === 'me') { rc = MG.el('div', 'it', null, th); MG.el('div', 'rc', 'Delivered', rc); }

  let L = null;
  const layout = () => {
    let y = 0;
    if (hdr) { hdr.style.top = y + 'px'; y += hdr.getBoundingClientRect().height + 16 * u; }
    if (lbl) { lbl.style.top = y + 'px'; y += lbl.getBoundingClientRect().height + 10 * u; }
    items.forEach((m, i) => {
      if (i > 0) y += rows[i - 1].side === m.r.side ? 2.5 * u : 10 * u;
      m.top = y; m.it.style.top = y + 'px';
      m.h = m.w.getBoundingClientRect().height;
      m.it.style.height = m.h + 'px';
      if (m.ty) m.ty.style.top = '0px';
      m.tyH = 40 * u;
      y += m.h;
    });
    let rcH = 0;
    if (rc) { rc.style.top = (y + 4 * u) + 'px'; rcH = 4 * u + rc.getBoundingClientRect().height + 2; }
    // scroll targets: the bottom of whatever is newest at each moment
    const ev = [];
    const firstBottom = items.length ? items[0].top + (items[0].ty ? items[0].tyH : items[0].h) : y;
    items.forEach((m, i) => {
      if (m.ty) {
        m.tyIn = Math.max(i ? items[i - 1].r.t + 0.12 : 0, m.r.t - 0.62);
        if (i === 0) m.tyIn = Math.min(m.tyIn, Math.max(0, m.r.t - 0.25));
        ev.push({ t: m.tyIn, b: m.top + m.tyH });
      }
      ev.push({ t: m.r.t, b: m.top + m.h + (i === items.length - 1 ? rcH : 0) });
    });
    ev.sort((a, b) => a.t - b.t);
    const anchor = MG.H * P.y;
    const topLimit = MG.H * 0.06;
    L = { ev, anchor, base: firstBottom, topLimit };
    vp.style.top = '0px';
    const maxUp = Math.max(...ev.map(e => e.b), firstBottom);
    // capture region: from where the oldest visible line can be to below the anchor
    MG.box = [Math.max(0, (MG.W - W) / 2 - 60), Math.max(0, topLimit - 30, Math.min(anchor - maxUp, anchor - firstBottom) - 40),
              Math.min(MG.W, (MG.W + W) / 2 + 60), Math.min(MG.H, anchor + 120)];
    const exitDur = Math.min(0.26, D * 0.1);
    L.exitAt = D - exitDur; L.exitDur = exitDur;
    const wins = [[L.exitAt - 0.02, D]];
    items.forEach(m => wins.push([(m.ty ? m.tyIn : m.r.t) - 0.02, m.r.t + 0.7]));
    if (rc) wins.push([rows[n - 1].t + 0.3, rows[n - 1].t + 0.65]);
    MG.active(wins);
  };
  document.body.offsetHeight;
  MG.ready = document.fonts.ready.then(() => { if (!L) layout(); });

  MG.frame(t => {
    if (!L) layout();
    // scroll: chained springs between successive "newest bottom" targets
    let bottom = L.base, prevB = L.base;
    L.ev.forEach(e => { if (t >= e.t) bottom += (e.b - prevB) * Math.min(1, MG.spring(t, e.t, { stiffness: 260, damping: 30 })); prevB = e.b; });
    let ty0 = L.anchor - bottom;
    // header/time fade in with the first item
    const intro = MG.range(t, Math.max(0, (L.ev[0] ? L.ev[0].t : 0) - 0.12), 0.25);
    if (hdr) MG.set(hdr, { opacity: intro, y: (1 - MG.ease.outCubic(intro)) * 12 });
    if (lbl) MG.set(lbl, { opacity: intro, y: (1 - MG.ease.outCubic(intro)) * 12 });
    items.forEach(m => {
      const tl = m.r.t;
      // typing indicator
      if (m.ty) {
        if (t < m.tyIn || t >= tl + 0.1) m.ty.style.opacity = 0;
        else {
          const k = MG.spring(t, m.tyIn, { stiffness: 420, damping: 24 });
          const out = MG.range(t, tl - 0.02, 0.09);
          MG.set(m.ty, { scale: (0.4 + 0.6 * k) * (1 - 0.3 * out), opacity: MG.range(t, m.tyIn, 0.06) * (1 - out) });
          MG.$$('i', m.ty).forEach((d, k2) => {
            const ph = ((t - m.tyIn) / 0.9 - k2 * 0.16) % 1;
            const pulse = Math.max(0, Math.sin(Math.max(0, ph) * Math.PI * 2 - Math.PI / 2) * 0.5 + 0.5);
            d.style.opacity = (0.35 + 0.65 * pulse).toFixed(3);
            d.style.transform = `translateY(${(-2.2 * u * pulse).toFixed(2)}px)`;
          });
        }
      }
      // bubble
      if (t < tl) { m.w.style.opacity = 0; return; }
      const k = MG.spring(t, tl, { stiffness: 360, damping: 21 });
      const fromS = m.r.side === 'me' ? 0.55 : 0.7;
      MG.set(m.w, { scale: fromS + (1 - fromS) * k, y: (1 - Math.min(k, 1)) * 14 * u, opacity: MG.range(t, tl, 0.06) });
    });
    if (rc) rc.style.opacity = MG.range(t, rows[n - 1].t + 0.32, 0.25);
    // items that scroll past the top of the safe area fade out
    const fadeZone = 90 * u / 2.6;
    const topFade = el => { const y0 = ty0 + parseFloat(el.style.top || 0); return MG.clamp((y0 - L.topLimit) / fadeZone); };
    items.forEach(m => { m.it.style.opacity = topFade(m.it).toFixed(3); });
    if (hdr) hdr.style.opacity = (intro * topFade(hdr)).toFixed(3);
    if (lbl) lbl.style.opacity = (intro * topFade(lbl)).toFixed(3);
    let s = { y: ty0 };
    if (t > L.exitAt) {
      const q = MG.ease.inCubic(MG.range(t, L.exitAt, L.exitDur));
      s.y -= q * 40; s.opacity = 1 - q;
    } else s.opacity = 1;
    MG.set(th, s);
  });
})();
</script>
