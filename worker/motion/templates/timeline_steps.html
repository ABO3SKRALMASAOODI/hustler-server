<!--MG-SPEC {"title": "Timeline steps", "category": "data",
 "description": "A timeline of 2-5 moments: the line draws, an accent marker travels point to point, each point pops in on its beat and the highlighted point lands in the accent colour. Use for chronology and jumps ('1983 -> 2010'), founder journeys, process steps or a before -> after story told as milestones.",
 "duration": 3.5, "layer": "above_captions", "mutes_captions": false,
 "params": {
  "rows": {"type": "rows", "required": true, "fields": ["label", "sub"], "max_items": 5, "max": 60,
           "hint": "2-5 points: label = the big marker text (a year, 'Day 1', '$0'), sub = short caption under it"},
  "orientation": {"type": "enum", "values": ["horizontal", "vertical"], "default": "horizontal", "hint": "vertical fits longer captions; on 9:16 a horizontal timeline whose 4-5 points would get too small is laid out vertically"},
  "active": {"type": "int", "min": 0, "max": 5, "default": 0, "hint": "1-based point the marker travels to and highlights; 0 = the last point"},
  "title": {"type": "str", "default": "", "max": 56, "hint": "optional heading; wrap a word in *stars* for the serif accent"},
  "accent": {"type": "color", "default": "#FFD400"},
  "backdrop": {"type": "enum", "values": ["none", "scrim"], "default": "none", "hint": "scrim = soft dark falloff behind the timeline; use it on bright or busy footage"},
  "y": {"type": "float", "min": 0.1, "max": 0.9, "default": 0.45, "hint": "vertical centre as frame fraction"}
 },
 "example": {"rows": [{"label": "1983", "sub": "First Mac ships"}, {"label": "1997", "sub": "Jobs returns"}, {"label": "2007", "sub": "iPhone"}], "title": "From garage to *giant*"},
 "sfx": [{"at": 0.0, "kind": "swish_short"}, {"at": 0.2, "kind": "pop_soft", "gain_db": -12, "repeat": {"param": "rows", "from": 0.2, "every": 0.26}}]} -->
<style>
  .scrim{position:absolute;left:0;top:0;width:64px;height:64px;pointer-events:none;will-change:transform,opacity;transform-origin:0 0;
         background:radial-gradient(closest-side,rgba(0,0,0,.68),rgba(0,0,0,.55) 40%,rgba(0,0,0,.3) 70%,rgba(0,0,0,0))}
  .stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity}
  .title{position:absolute;left:0;top:0;font-family:'Inter Display',sans-serif;font-weight:800;letter-spacing:-0.035em;line-height:1.02;
         color:#F7F5F2;text-wrap:balance;text-shadow:0 2px 4px rgba(0,0,0,.3),0 6px 28px rgba(0,0,0,.5)}
  .acc{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.01em;color:var(--accent);font-size:1.14em;line-height:.8}
  .lab{position:absolute;left:0;top:0;font-family:'Inter Display',sans-serif;font-weight:800;letter-spacing:-0.04em;color:#F7F5F2;
       white-space:nowrap;line-height:1;text-shadow:0 2px 4px rgba(0,0,0,.3),0 6px 28px rgba(0,0,0,.5)}
  .sub{position:absolute;left:0;top:0;font-family:'Inter','Inter Display',sans-serif;font-weight:600;color:rgba(247,245,242,.8);
       letter-spacing:-0.01em;line-height:1.14;text-wrap:balance;text-shadow:0 2px 4px rgba(0,0,0,.35),0 6px 28px rgba(0,0,0,.5)}
  .h .lab,.h .sub,.h .title{text-align:center}
  .rail,.fill{position:absolute;left:0;top:0;border-radius:99px}
  .rail{background:rgba(255,255,255,.34);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 10px rgba(0,0,0,.3)}
  .fill{background:var(--accent);box-shadow:0 0 18px var(--accent-glow)}
  .dot{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
       background:rgba(20,20,24,.55);border:4px solid #F7F5F2;box-shadow:0 2px 12px rgba(0,0,0,.45)}
  .dot.on{background:#F7F5F2}
  .marker{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--accent);
          box-shadow:0 0 0 7px var(--accent-soft),0 0 30px var(--accent-glow)}
  .marker::after{content:"";position:absolute;inset:13px;border-radius:50%;background:#111}
  .ring{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid var(--accent);opacity:0}
</style>
<div class="mg-root"><div class="scrim" id="scrim"></div><div class="stage" id="stage"></div></div>
<script>
(() => {
  const P = MG.params, D = MG.duration, W = MG.W, H = MG.H;
  const tall = H / W > 1.45;
  const SAFE = { x0: 60, x1: W - 60, y0: H * (tall ? 0.08 : 0.06), y1: H * (tall ? 0.80 : 0.94) };
  const css = document.documentElement.style;
  const rgb = h => { const n = parseInt(String(h).slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const rgba = (h, a) => `rgba(${rgb(h).join(',')},${a})`;
  css.setProperty('--accent', P.accent);
  css.setProperty('--accent-soft', rgba(P.accent, 0.25));
  css.setProperty('--accent-glow', rgba(P.accent, 0.6));
  const rows = (P.rows || []).filter(r => (r.label || r.sub)).slice(0, 5);
  if (!rows.length) rows.push({ label: '', sub: '' });
  const n = rows.length;
  const act = Math.max(0, Math.min(n - 1, (P.active > 0 ? P.active : n) - 1));
  let vert = P.orientation === 'vertical';
  const rich = s => MG.esc(s).replace(/\*([^*]+)\*/g, '<span class="acc">$1</span>');
  const fontsReady = Promise.all([`800 60px 'Inter Display'`, `600 30px 'Inter'`, `italic 400 60px 'Instrument Serif'`]
    .map(f => document.fonts.load(f).catch(() => 0)));
  const stage = MG.$('#stage');
  // rhythm: the head reaches point i at T0 + i*STEP (sfx 'pop_soft' repeats on it);
  // a short item tightens the beat so the marker always arrives before the exit
  const T0 = 0.2, STEP = Math.min(0.26, Math.max(0.12, (D * 0.6 - T0) / Math.max(1, n - 1))), MOVE = STEP * 0.77;
  let L = null;

  function layout() {
    stage.innerHTML = '';
    stage.classList.toggle('h', !vert);
    const cw = SAFE.x1 - SAFE.x0;
    let y = 0, title = null;
    if (P.title.trim()) {
      title = MG.el('div', 'title', null, stage);
      title.innerHTML = rich(P.title.trim());
      title.style.width = cw + 'px';
      MG.fit(title, { width: cw, height: 72 * 1.02 * 2 + 8, min: 46, max: 72 });
      y = title.offsetHeight + (vert ? 56 : 70);
    }
    const rail = MG.el('div', 'rail', null, stage);
    const fill = MG.el('div', 'fill', null, stage);
    const els = rows.map((r, i) => {
      const lab = MG.el('div', 'lab', r.label || '', stage);
      const sub = r.sub ? MG.el('div', 'sub', r.sub, stage) : null;
      const dot = MG.el('div', 'dot', null, stage);
      return { lab, sub, dot };
    });
    const ring = MG.el('div', 'ring', null, stage);
    const marker = MG.el('div', 'marker', null, stage);
    const pts = [];
    let h;
    if (!vert) {
      const colW = cw / n;
      const lfs = Math.min(136, colW * 0.27);
      const sfs = n <= 2 ? 44 : n === 3 ? 40 : n === 4 ? 36 : 32;
      let labH = 0, minLab = 1e9, subOver = false;
      // labels and notes never drop below the phone-readable floor: at the
      // floor they wrap (and a crowded portrait row goes vertical below)
      els.forEach(e => { minLab = Math.min(minLab, MG.fitSecondary(e.lab, { width: colW * 0.84, max: lfs })); labH = Math.max(labH, e.lab.offsetHeight); });
      const lineY = y + labH + Math.max(34, lfs * 0.36);
      let subH = 0;
      els.forEach((e, i) => {
        const cx = colW * (i + 0.5);
        pts.push([cx, lineY]);
        e.lab.style.left = (cx - e.lab.offsetWidth / 2) + 'px';
        e.lab.style.top = (lineY - Math.max(34, lfs * 0.36) - e.lab.offsetHeight) + 'px';
        if (e.sub) {
          e.sub.style.width = (colW - 12) + 'px';
          e.sub.style.fontSize = sfs + 'px';
          const sfl = Math.max(28, MG.minType(e.sub));
          MG.fit(e.sub, { width: colW - 12, height: sfl * 1.14 * 3 + 4, min: sfl, max: Math.max(sfs, sfl) });
          if (e.sub.offsetHeight > sfl * 1.14 * 3 + 6 || e.sub.scrollWidth > colW - 11) subOver = true;
          e.sub.style.left = (cx - (colW - 12) / 2) + 'px';
          e.sub.style.top = (lineY + 36) + 'px';
          subH = Math.max(subH, e.sub.offsetHeight);
        }
      });
      const x0 = pts[0][0], x1 = pts[n - 1][0];
      const ext = n === 1 ? 120 : Math.min(colW * 0.42, 110);      // rail runs a little past the end points
      Object.assign(rail.style, { left: (x0 - ext) + 'px', top: (lineY - 2.5) + 'px', width: (x1 - x0 + 2 * ext) + 'px', height: '5px' });
      Object.assign(fill.style, { left: x0 + 'px', top: (lineY - 3.5) + 'px', height: '7px', width: '0px' });
      rail.dataset.ext = ext;
      h = lineY + 36 + subH;
      // a portrait frame cannot hold 4-5 columns at a readable size: go vertical
      if (tall && n >= 4 && (minLab < 56 || subOver || labH > lfs * 1.6)) { vert = true; return layout(); }
    } else {
      const lx = 26;                                   // rail x
      const tx = lx + 62;                              // text column
      const tw = cw - tx;
      const lfs = n <= 3 ? 92 : n === 4 ? 80 : 68, sfs = n <= 3 ? 44 : n === 4 ? 40 : 36;
      let cy = y;
      els.forEach((e, i) => {
        MG.fitSecondary(e.lab, { width: tw, max: lfs });
        e.lab.style.left = tx + 'px';
        e.lab.style.top = cy + 'px';
        let blockH = e.lab.offsetHeight;
        if (e.sub) {
          e.sub.style.width = tw + 'px';
          e.sub.style.fontSize = sfs + 'px';
          const sfl = Math.max(28, MG.minType(e.sub));
          MG.fit(e.sub, { width: tw, height: sfl * 1.14 * 2 + 4, min: sfl, max: Math.max(sfs, sfl) });
          e.sub.style.left = tx + 'px';
          e.sub.style.top = (cy + blockH + 10) + 'px';
          blockH += 10 + e.sub.offsetHeight;
        }
        pts.push([lx, cy + e.lab.offsetHeight * 0.52]);
        cy += Math.max(blockH, 120) + (n <= 3 ? 64 : 46);
      });
      const y0 = pts[0][1], y1 = pts[n - 1][1];
      const ext = 34;
      Object.assign(rail.style, { left: (lx - 2.5) + 'px', top: (y0 - ext) + 'px', width: '5px', height: (y1 - y0 + 2 * ext) + 'px' });
      Object.assign(fill.style, { left: (lx - 3.5) + 'px', top: y0 + 'px', width: '7px', height: '0px' });
      rail.dataset.ext = ext;
      h = cy - (n <= 3 ? 64 : 46);
    }
    els.forEach((e, i) => { e.dot.style.left = pts[i][0] + 'px'; e.dot.style.top = pts[i][1] + 'px'; });
    stage.style.width = cw + 'px'; stage.style.height = h + 'px';
    const k = Math.min(1, (SAFE.y1 - SAFE.y0) / h);
    const x = SAFE.x0 + cw * (1 - k) / 2;
    const top = Math.min(SAFE.y1 - h * k, Math.max(SAFE.y0, H * P.y - h * k / 2));
    const m = 70;
    let bx = [x - m, top - m, x + cw * k + m, top + h * k + m];
    const scrim = MG.$('#scrim');
    if (P.backdrop === 'scrim') {
      const sw = cw * k + 320, sh = h * k * 1.25 + 300;
      scrim.style.transform = `translate(${W / 2 - sw / 2}px,${top + h * k / 2 - sh / 2}px) scale(${sw / 64},${sh / 64})`;
      bx = [Math.min(bx[0], W / 2 - sw / 2), Math.min(bx[1], top + h * k / 2 - sh / 2), Math.max(bx[2], W / 2 + sw / 2), Math.max(bx[3], top + h * k / 2 + sh / 2)];
    } else scrim.remove();
    MG.box = [Math.max(0, bx[0]), Math.max(0, bx[1]), Math.min(W, bx[2]), Math.min(H, bx[3])];
    return { title, rail, fill, els, ring, marker, pts, x, top, k, scrim: P.backdrop === 'scrim' ? scrim : null, ext: +rail.dataset.ext };
  }
  MG.ready = fontsReady.then(() => { L = L || layout(); });

  const XD = Math.min(0.26, D * 0.1);
  const lastPop = T0 + (n - 1) * STEP;
  MG.active([[0, Math.min(D, Math.max(lastPop, T0 + act * STEP) + 0.45)], [D - XD - 0.02, D]]);
  MG.frame(t => {
    if (!L) L = layout();
    const qx = MG.ease.inCubic(MG.range(t, D - XD, XD));
    MG.set(L.stage || stage, { x: L.x, y: L.top - qx * 24, scale: L.k, opacity: 1 - qx, blur: qx * 12 });
    if (L.scrim) L.scrim.style.opacity = (MG.ease.outCubic(MG.range(t, 0, 0.3)) * (1 - qx)).toFixed(3);
    if (L.title) { const p = MG.ease.outExpo(MG.range(t, 0, 0.55)); MG.set(L.title, { y: (1 - p) * 30, opacity: 0.25 + 0.75 * MG.range(t, 0, 0.12), blur: (1 - MG.range(t, 0, 0.2)) * 8 }); }
    // rail sweeps open first (fast), from the first point outwards
    const pr = MG.ease.outExpo(MG.range(t, 0, 0.5 + 0.06 * n));
    if (!vert) { L.rail.style.transformOrigin = `${L.ext}px 50%`; L.rail.style.transform = `scaleX(${Math.max(0.001, pr)})`; }
    else { L.rail.style.transformOrigin = `50% ${L.ext}px`; L.rail.style.transform = `scaleY(${Math.max(0.001, pr)})`; }
    L.rail.style.opacity = (0.3 + 0.7 * MG.range(t, 0, 0.1)).toFixed(3);
    // head position along the points: dwell on each, ease between
    const seg = Math.max(0, Math.min(n - 1, (t - T0) / STEP));
    let headIdx = Math.floor(seg), fr = MG.ease.inOutCubic(MG.clamp((seg - headIdx) / (MOVE / STEP)));
    if (headIdx >= n - 1) { headIdx = n - 1; fr = 0; }
    // the marker rides the head until the active point, then stays
    const mIdx = Math.min(act, headIdx), mFr = headIdx >= act ? 0 : fr;
    const a = L.pts[mIdx], b = L.pts[Math.min(n - 1, mIdx + 1)];
    const mx = a[0] + (b[0] - a[0]) * mFr, my = a[1] + (b[1] - a[1]) * mFr;
    const mOn = MG.ease.outBack(MG.range(t, T0 - 0.08, 0.28));
    L.marker.style.transform = `translate(${mx.toFixed(2)}px,${my.toFixed(2)}px) scale(${mOn.toFixed(4)})`;
    L.marker.style.opacity = MG.range(t, T0 - 0.08, 0.06).toFixed(3);
    if (!vert) L.fill.style.width = Math.max(0, mx - L.pts[0][0]) + 'px';
    else L.fill.style.height = Math.max(0, my - L.pts[0][1]) + 'px';
    // points pop on their beat; the active one lands in the accent
    L.els.forEach((e, i) => {
      const ti = T0 + i * STEP;
      const s = MG.spring(t, ti - 0.04, { stiffness: 380, damping: 18 });
      e.dot.style.transform = `scale(${Math.max(0, s).toFixed(4)})`;
      e.dot.classList.toggle('on', t >= ti && i <= act);
      const pl = MG.ease.outExpo(MG.range(t, ti - 0.05, 0.5));
      const isAct = i === act;
      const land = MG.range(t, ti, 0.32), bump = isAct && land > 0 && land < 1 ? Math.sin(Math.PI * land) : 0;
      e.lab.style.transformOrigin = vert ? '0% 60%' : '50% 80%';
      MG.set(e.lab, { y: (1 - pl) * (vert ? 0 : 22), x: (1 - pl) * (vert ? 26 : 0), opacity: MG.range(t, ti - 0.05, 0.1), blur: (1 - MG.range(t, ti - 0.05, 0.16)) * 8, scale: 1 + 0.07 * bump });
      e.lab.style.color = isAct && t >= ti ? P.accent : '#F7F5F2';
      if (e.sub) MG.set(e.sub, { y: (1 - MG.ease.outExpo(MG.range(t, ti + 0.03, 0.5))) * (vert ? 0 : 14), x: (1 - MG.ease.outExpo(MG.range(t, ti + 0.03, 0.5))) * (vert ? 18 : 0), opacity: MG.range(t, ti + 0.03, 0.14) });
    });
    // landing pulse on the active point
    const rp = MG.range(t, T0 + act * STEP, 0.42);
    const ap = L.pts[act];
    L.ring.style.transform = `translate(${ap[0]}px,${ap[1]}px) scale(${(1 + 1.6 * MG.ease.outCubic(rp)).toFixed(4)})`;
    L.ring.style.opacity = rp > 0 && rp < 1 ? ((1 - rp) * 0.9).toFixed(3) : 0;
  });
})();
</script>
