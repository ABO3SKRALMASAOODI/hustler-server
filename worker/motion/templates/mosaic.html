<!--MG-SPEC {"title": "Mosaic", "category": "layout", "also": ["media"],
 "description": "A living mosaic of real photos and video (tiles: asset keys or source:<seconds>): tiles pop in one per beat ('at', item seconds; else evenly), the wall breathes on the beat, then collapses tile by tile into ONE tile that fills the frame, and the title (or the user's logo text) lands on it. The event-recap / launch-sizzle opener and closer (ref 28). Up to 64 tiles; video tiles play.",
 "duration": 8.0, "layer": "above_captions", "mutes_captions": true,
 "params": {
  "tiles": {"type": "list", "required": true, "max_items": 64, "max": 300, "hint": "each 'asset:<key>' (image or video), 'source:<seconds>' or a bare storage key"},
  "layout": {"type": "enum", "values": ["grid", "justified", "treemap", "overload"], "default": "justified"},
  "at": {"type": "list", "max_items": 64, "hint": "pop times (item seconds), one per tile: the user's beats"},
  "collapse_at": {"type": "float", "min": 0.0, "max": 60.0, "default": 0.0, "hint": "item second the collapse starts (0 = at 65% of the item)"},
  "hero": {"type": "int", "min": 0, "max": 63, "default": 0, "hint": "the tile that survives the collapse"},
  "title": {"type": "str", "default": "", "max": 40, "hint": "lands on the hero tile after the collapse"},
  "kicker": {"type": "str", "default": "", "max": 40},
  "backdrop": {"type": "color", "default": "#0B0B0D"},
  "accent": {"type": "color", "default": "#FF3B30"},
  "gap": {"type": "float", "min": 0, "max": 0.05, "default": 0.008, "hint": "gap between tiles, share of the width"},
  "radius": {"type": "float", "min": 0, "max": 0.06, "default": 0.012},
  "seed": {"type": "int", "min": 1, "max": 9999, "default": 4}
 },
 "example": {"tiles": ["source:12.0", "source:15.5", "source:19.2", "source:23.0"], "title": "DEV DAY"},
 "sfx": []} -->
<style>
  .ti{position:absolute;left:0;top:0;border-radius:var(--r);box-shadow:0 0 0 2px rgba(255,255,255,.08);will-change:transform,opacity}
  .tt{position:absolute;left:0;top:0;width:100%;text-align:center;color:#fff;line-height:.9;
      font-family:'Anton','Bebas Neue','Inter',sans-serif;letter-spacing:.01em;text-shadow:0 10px 40px rgba(0,0,0,.55)}
  .tk{position:absolute;left:0;top:0;width:100%;text-align:center;color:#fff;font:700 28px/1 'Inter',sans-serif;letter-spacing:.24em;opacity:.85}
</style>
<div class="mg-root" id="mz"></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, D = MG.duration;
  MG.always();
  MG.box = [0, 0, W, H];
  const root = MG.$('#mz'), r = MG.rand(P.seed || 4);
  const n = Math.max(1, Math.min(64, (P.tiles || []).length || 1));
  const gap = (P.gap ?? 0.008) * W, rad = (P.radius ?? 0.012) * W;
  root.style.setProperty('--r', rad + 'px');
  const ats = (P.at || []).map(Number).filter(isFinite);
  const collapse = (P.collapse_at && P.collapse_at > 0) ? P.collapse_at : D * 0.65;
  const popAt = k => ats.length ? ats[k % ats.length] + Math.floor(k / ats.length) * 0.0 : (k / n) * Math.min(collapse * 0.8, D * 0.5);
  const hero = Math.min(n - 1, Math.max(0, P.hero || 0));
  // layout: rects in design px
  function layout() {
    const R = [];
    const m = gap * 2, Wm = W - m * 2, Hm = H - m * 2;
    if (P.layout === 'grid') {
      const cols = Math.max(1, Math.round(Math.sqrt(n * Wm / Hm))), rows = Math.ceil(n / cols);
      const cw = (Wm - gap * (cols - 1)) / cols, ch = (Hm - gap * (rows - 1)) / rows;
      for (let k = 0; k < n; k++) R.push([m + (k % cols) * (cw + gap), m + Math.floor(k / cols) * (ch + gap), cw, ch]);
    } else if (P.layout === 'treemap') {
      const split = (x, y, w, h, ids) => {
        if (ids.length === 1) { R[ids[0]] = [x, y, w, h]; return; }
        const a = Math.ceil(ids.length / 2), f = a / ids.length * (0.85 + 0.3 * r());
        if (w > h) { const w1 = w * f; split(x, y, w1 - gap / 2, h, ids.slice(0, a)); split(x + w1 + gap / 2, y, w - w1 - gap / 2, h, ids.slice(a)); }
        else { const h1 = h * f; split(x, y, w, h1 - gap / 2, ids.slice(0, a)); split(x, y + h1 + gap / 2, w, h - h1 - gap / 2, ids.slice(a)); }
      };
      split(m, m, Wm, Hm, [...Array(n).keys()]);
    } else if (P.layout === 'overload') {
      for (let k = 0; k < n; k++) { const s = W * (0.22 + r() * 0.2); R.push([r() * (W - s), r() * (H - s * 0.75), s, s * (0.62 + r() * 0.5)]); }
    } else {
      // justified rows: aspect-varied tiles filling each row exactly
      const asp = [...Array(n)].map(() => 0.7 + r() * 1.1);
      const rowsN = Math.max(1, Math.round(Math.sqrt(n * Hm / Wm * 1.2)));
      const per = Math.ceil(n / rowsN), rh = (Hm - gap * (rowsN - 1)) / rowsN;
      let k = 0;
      for (let row = 0; row < rowsN && k < n; row++) {
        const ids = []; for (let j = 0; j < per && k < n; j++, k++) ids.push(k);
        const tot = ids.reduce((s, i) => s + asp[i], 0), avail = Wm - gap * (ids.length - 1);
        let x = m;
        ids.forEach(i => { const w = avail * asp[i] / tot; R[i] = [x, m + row * (rh + gap), w, rh]; x += w + gap; });
      }
    }
    return R;
  }
  const rects = layout();
  const rot = rects.map(() => P.layout === 'overload' ? (r() - 0.5) * 0.22 : 0);
  const order = [...Array(n).keys()].filter(k => k !== hero).sort(() => r() - 0.5);
  const title = MG.el('div', 'tt', String(P.title || '').toUpperCase(), root);
  const kick = MG.el('div', 'tk', String(P.kicker || '').toUpperCase(), root);
  title.style.fontSize = (W * 0.16) + 'px';
  const beatPulse = t => { let p = 0; for (const b of ats) { const a = t - b; if (a >= 0 && a < 0.3) p = Math.max(p, 1 - a / 0.3); } return p; };
  const outDur = Math.max(0.3, (D - collapse) * 0.45);
  MG.frame(t => {
    const breathe = 1 + 0.018 * beatPulse(t) + 0.006 * Math.sin(t * 2.2);
    const cx = W / 2, cy = H / 2;
    for (let k = 0; k < n; k++) {
      let [x, y, w, h] = rects[k];
      const pop = MG.spring ? MG.clamp(MG.spring(t, popAt(k), { k: 260, d: 16 }), 0, 1.15) : MG.clamp((t - popAt(k)) / 0.2);
      let s = pop * breathe, op = MG.clamp(pop * 3);
      if (t >= collapse) {
        const q = MG.clamp((t - collapse) / outDur);
        if (k === hero) {
          // the survivor grows into the frame
          const e = MG.ease.inOutCubic ? MG.ease.inOutCubic(MG.clamp((t - collapse - outDur * 0.6) / (outDur * 0.9))) : q;
          x = MG.lerp(x, 0, e); y = MG.lerp(y, 0, e); w = MG.lerp(w, W, e); h = MG.lerp(h, H, e); s = 1;
        } else {
          const idx = order.indexOf(k), at = collapse + idx / Math.max(1, order.length) * outDur * 0.8;
          const qq = MG.clamp((t - at) / 0.18);
          s *= 1 - qq; op *= 1 - qq;
        }
      }
      if (op <= 0.01 || s <= 0.01) continue;
      const sw = w * s, sh = h * s, sx = x + (w - sw) / 2 + (cx - (x + w / 2)) * (1 - breathe), sy = y + (h - sh) / 2 + (cy - (y + h / 2)) * (1 - breathe);
      MG.slot('t' + k, sx, sy, sw, sh, { r: rad * (k === hero && t > collapse + outDur ? 0 : 1), z: k === hero ? 1 : 0, opacity: op });
    }
    const tq = MG.clamp((t - collapse - outDur * 1.3) / 0.35);
    title.style.opacity = tq.toFixed(3);
    title.style.transform = `translateY(${(H * 0.43 + (1 - tq) * 40).toFixed(1)}px)`;
    kick.style.opacity = (tq * 0.9).toFixed(3);
    kick.style.transform = `translateY(${(H * 0.43 - 50).toFixed(1)}px)`;
  });
})();
</script>
