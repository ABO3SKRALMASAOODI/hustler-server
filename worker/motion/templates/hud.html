<!--MG-SPEC {"title": "HUD", "category": "layout", "also": ["type"],
 "description": "Frame furniture that runs through a piece: corner labels (venue, date, chapter, a running count), a blinking REC dot, a running timecode, corner brackets, a centre crosshair, a faint grid — in the brand colour, small, steady across cuts. Never enters the free-tier corner-mark zone (top-left): the top-left furniture sits below it. For event recaps, tool stories, lab-scan essays (refs 24, 17, 06).",
 "duration": 10.0, "layer": "above_captions", "mutes_captions": false, "persistent": false,
 "params": {
  "tl": {"type": "str", "default": "", "max": 40, "hint": "top-left label"},
  "tr": {"type": "str", "default": "", "max": 40},
  "bl": {"type": "str", "default": "", "max": 40},
  "br": {"type": "str", "default": "", "max": 40},
  "rec": {"type": "bool", "default": true},
  "timecode": {"type": "bool", "default": true},
  "tc_start": {"type": "float", "min": 0, "max": 86400, "default": 0},
  "brackets": {"type": "bool", "default": true},
  "crosshair": {"type": "bool", "default": false},
  "grid": {"type": "bool", "default": false},
  "colour": {"type": "color", "default": "#F2F2F2"},
  "accent": {"type": "color", "default": "#FF3B30"},
  "scale": {"type": "float", "min": 0.6, "max": 1.6, "default": 1.0},
  "mark": {"type": "list", "default": [], "max_items": 4, "hint": "the corner-mark zone [x0, y0, x1, y1] (fractions; the verb fills it per aspect)"}
 },
 "example": {"tl": "DEV DAY 2025", "tr": "SAN FRANCISCO", "bl": "KEYNOTE"},
 "sfx": []} -->
<style>
  .hl{position:absolute;left:0;top:0;white-space:nowrap;font:700 var(--fs)/1 'JetBrains Mono','DM Mono',monospace;letter-spacing:.14em;color:var(--c);text-shadow:0 1px 6px rgba(0,0,0,.6)}
  #hc{position:absolute;left:0;top:0;width:100%;height:100%}
</style>
<div class="mg-root"><canvas id="hc"></canvas><div id="hr"></div></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, D = MG.duration;
  MG.always();
  const k = (P.scale ?? 1) * Math.min(W, H) / 1080, m = 46 * k, fs = 24 * k;
  const root = MG.$('#hr'); root.style.setProperty('--fs', fs + 'px'); root.style.setProperty('--c', P.colour || '#F2F2F2');
  const cv = MG.$('#hc'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const mk = (P.mark && P.mark.length === 4) ? P.mark.map(Number) : [0.09, 0.05, 0.5, 0.13];
  // the top-left furniture starts below the corner mark's zone
  const yTopL = Math.max(m * 1.2, mk[3] * H + m * 0.6);
  const yb = H - m - fs * 1.5;
  const lab = (txt, x, y, al) => { if (!txt) return null; const e = MG.el('div', 'hl', String(txt).toUpperCase(), root); const w = e.getBoundingClientRect().width; e.style.transform = `translate(${(al === 'r' ? x - w : x).toFixed(1)}px, ${y.toFixed(1)}px)`; return e; };
  lab(P.tl, m * 1.6, yTopL); lab(P.tr, W - m * 1.6, m * 1.2, 'r'); lab(P.bl, m * 1.6, yb); lab(P.br, W - m * 1.6, yb, 'r');
  const tc = P.timecode !== false ? lab('00:00:00:00', W - m * 1.6, m * 1.2 + fs * 1.7, 'r') : null;
  const rec = P.rec !== false ? lab('● REC', m * 1.6, yTopL + fs * 1.7) : null;
  if (rec) rec.style.color = P.accent || '#FF3B30';
  MG.frame(t => {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = P.colour || '#F2F2F2'; ctx.lineWidth = 3 * k; ctx.globalAlpha = 0.85;
    if (P.brackets !== false) {
      const L = 54 * k, x0 = m * 0.8, y0 = m * 0.8, x1 = W - m * 0.8, y1 = H - m * 0.8;
      const br = (x, y, dx, dy) => { ctx.beginPath(); ctx.moveTo(x, y + dy * L); ctx.lineTo(x, y); ctx.lineTo(x + dx * L, y); ctx.stroke(); };
      br(x0, yTopL - m * 0.4, 1, 1); br(x1, y0, -1, 1); br(x0, y1, 1, -1); br(x1, y1, -1, -1);
    }
    if (P.crosshair) { const c = 22 * k; ctx.beginPath(); ctx.moveTo(W / 2 - c, H / 2); ctx.lineTo(W / 2 + c, H / 2); ctx.moveTo(W / 2, H / 2 - c); ctx.lineTo(W / 2, H / 2 + c); ctx.stroke(); }
    if (P.grid) { ctx.globalAlpha = 0.12; ctx.lineWidth = 1.5 * k; for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(W * i / 3, 0); ctx.lineTo(W * i / 3, H); ctx.moveTo(0, H * i / 3); ctx.lineTo(W, H * i / 3); ctx.stroke(); } }
    ctx.globalAlpha = 1;
    if (rec) rec.style.opacity = (Math.floor(t * 2) % 2 ? 0.25 : 1).toFixed(2);
    if (tc) { const T = (P.tc_start || 0) + t, f = Math.floor((T % 1) * MG.fps); const p2 = v => String(Math.floor(v)).padStart(2, '0'); tc.textContent = `${p2(T / 3600)}:${p2(T / 60 % 60)}:${p2(T % 60)}:${p2(f)}`; }
    root.style.opacity = (MG.clamp(t / 0.3) * MG.clamp((D - t) / 0.3)).toFixed(3);
    cv.style.opacity = root.style.opacity;
  });
})();
</script>
