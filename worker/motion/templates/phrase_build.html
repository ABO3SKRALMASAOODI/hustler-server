<!--MG-SPEC {"title": "Phrase build", "category": "type",
 "description": "A pre-laid-out typographic lockup (up to 4 rows in at most 3 sizes, mixing sans, serif, script, condensed and mono at a 2:1-7:1 size ladder, rows stacked as tight as their measured glyphs allow without touching) whose words appear IN PLACE as they are spoken - the block never reflows. Use it for a key sentence instead of captions: quote the transcript in the rows and place the block in face-free space with x/y/width/align. Words reveal in reading order: a spoken row's words land on their spoken onsets (the engine times them from the transcript; 'at' is the fallback for rows nobody says), and its window starts on its first visible word. It sets only its rows: the phrase's words the rows leave out stay with the captions. More than 3 distinct row sizes merge into 3.",
 "duration": 3.0, "layer": "above_captions", "mutes_captions": true, "reads_phrase": true,
 "params": {
  "rows": {"type": "rows", "required": true, "fields": ["text", "role", "size", "accent", "at"], "field_types": {"role": ["sans", "serif", "script", "condensed", "mono"], "size": "number", "accent": "flag", "at": "number"}, "max_items": 4, "max": 48, "hint": "up to 4 rows in reading order: text (the speaker's exact words); role sans|serif|script|condensed|mono; size a NUMBER relative to the other rows (e.g. 0.5, 1, 1.6, never s/m/l/xl; ladder up to 7:1; at most 3 distinct sizes); accent '1' tints the row (or *star* single words); at = row reveal time in item seconds for a row nobody says (blank = right after the previous row) - spoken rows land on their spoken onsets"},
  "align": {"type": "enum", "values": ["left", "center", "right"], "default": "center"},
  "x": {"type": "float", "min": 0.15, "max": 0.85, "default": 0.5, "hint": "horizontal centre of the block's column (frame fraction)"},
  "y": {"type": "float", "min": 0.12, "max": 0.8, "default": 0.56, "hint": "vertical centre of the block (frame fraction)"},
  "width": {"type": "float", "min": 0.3, "max": 0.88, "default": 0.82, "hint": "column width (frame fraction); the widest row fills it"},
  "color": {"type": "color", "default": "#F8F6F2"},
  "accent": {"type": "color", "default": "#ED080D"},
  "entrance": {"type": "enum", "values": ["pop", "ghost", "rise"], "default": "pop", "hint": "pop = hard cut per word; ghost = 2 frames at 35% then snap; rise = small rise + blur-to-sharp"},
  "word_stagger": {"type": "float", "min": 0.0, "max": 0.6, "default": 0.14, "hint": "seconds between words inside an unspoken row (0 = the whole row at once); squeezed so a row is complete before the next row starts"},
  "exit": {"type": "enum", "values": ["cut", "fade", "blur"], "default": "cut"},
  "leading": {"type": "enum", "values": ["clear", "overlap"], "default": "clear", "hint": "clear = rows sit as tight as their measured glyphs allow and never touch (a descender or swash never hits the row below); overlap = the designed negative leading as-is, rows may cross (a script swash dipping into the row below) - only when that collision is the design"},
  "scrim": {"type": "float", "min": 0, "max": 1, "default": 0.45, "hint": "soft dark backing under the block so thin serif/script rows read over bright shirts and walls; 0 = none"}
 },
 "example": {"rows": [{"text": "Your", "role": "script", "size": "1.1", "at": "0"},
                      {"text": "only focus", "role": "sans", "size": "1", "at": "0.25"},
                      {"text": "should be on", "role": "serif", "size": "0.62", "at": "0.9"},
                      {"text": "GETTING *BETTER*", "role": "condensed", "size": "1.25", "at": "1.35"}],
             "align": "center"},
 "sfx": [{"at": 0.0, "kind": "pop_soft"}]} -->
<style>
  .blk{position:absolute;display:flex;flex-direction:column}
  .row{white-space:nowrap;display:block;position:relative;width:max-content}
  .row .mg-w{margin-right:.22em;will-change:opacity,transform,filter}
  .row .mg-w:last-child{margin-right:0}
  .scrim{position:absolute;pointer-events:none;border-radius:50%;opacity:0;
    background:radial-gradient(closest-side,rgba(0,0,0,var(--sa)) 0%,rgba(0,0,0,calc(var(--sa) * .62)) 52%,rgba(0,0,0,0) 100%)}
</style>
<div class="mg-root"><div class="scrim" id="scrim"></div><div class="blk" id="blk"></div></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, D = MG.duration, FPS = MG.fps || 30;
  const blk = MG.$('#blk'), scrim = MG.$('#scrim');
  scrim.style.setProperty('--sa', (0.8 * (P.scrim || 0)).toFixed(3));
  // ── font roles (first bundled family wins; graceful CSS fallbacks) ──
  const FAM = new Set(Array.from(document.fonts, f => f.family.replace(/["']/g, '')));
  const first = list => list.find(f => FAM.has(f));
  const SCRIPTS = ['Pinyon Script', 'Great Vibes', 'Yellowtail', 'Allura', 'Satisfy'];
  const ROLE = {
    sans: () => ({ css: `'Inter Display','Inter',sans-serif`, weight: 800, style: 'normal', track: '-0.035em', lh: 0.92, gap: 0, opt: 1 }),
    condensed: () => { const f = first(['Anton', 'Bebas Neue']) || 'Anton';
      return { css: `'${f}','Bebas Neue','Inter Display',sans-serif`, weight: 400, style: 'normal', track: '0em', lh: 0.92, gap: 0, opt: 0.86 }; },
    serif: () => { const f = first(['Instrument Serif', 'Playfair Display', 'DM Serif Display']) || 'Instrument Serif';
      return { css: `'${f}','Playfair Display',Georgia,serif`, weight: f === 'Playfair Display' ? 900 : 400, style: 'italic', track: '-0.015em', lh: 0.92, gap: -0.04, thin: true, opt: 1.1 }; },
    script: () => { const f = first(SCRIPTS);
      if (f) return { css: `'${f}','Instrument Serif',cursive`, weight: 400, style: 'normal', track: '0em', lh: 1.0, gap: -0.32, thin: true, opt: 1.3 };
      return { css: `'Instrument Serif','Playfair Display',Georgia,serif`, weight: 400, style: 'italic', track: '-0.015em', lh: 0.92, gap: -0.12, thin: true, opt: 1.18 }; },
    mono: () => ({ css: `'JetBrains Mono','IBM Plex Mono','SFMono-Regular',Menlo,Consolas,ui-monospace,monospace`, weight: FAM.has('JetBrains Mono') ? 700 : 600, style: 'normal', track: '-0.02em', lh: 1.0, gap: 0, opt: 0.92 }),
  };
  const truthy = v => /^(1|true|yes|y|on)$/i.test(String(v || '').trim());
  const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
  const stagger = Math.max(0, P.word_stagger || 0);

  // ── build every row in its final place (hidden words keep their space) ──
  // The engine's reading (MotionItem.reading): per row, per word, the
  // second its spoken word starts (null: not said). The lockup sets only its
  // rows: the phrase's words they leave out stay with the captions (round 4:
  // small bridge lines grew lockups into 6-line piles in 5 sizes).
  const RD = (P._reading && typeof P._reading === 'object') ? P._reading : null;
  const RDrows = (RD && Array.isArray(RD.rows)) ? RD.rows : [];
  // a 'rise' word fades in over 80 ms: it starts that much ahead of its
  // spoken onset so it is readable ON the word (pop and ghost show on it)
  const LAND = P.entrance === 'rise' ? 0.06 : 0;
  const onset = v => { const n = v == null ? null : num(v, null); return n == null ? null : Math.max(0, n - LAND); };
  // at most 3 distinct row sizes: the closest pair (by ratio) merges at its
  // geometric mean until 3 are left (motion_tools.size_levels does the same
  // at write time; this keeps an older EDL's lockup a 3-size ladder)
  const r2 = v => Math.round(v * 100) / 100;
  const sizes = (P.rows || []).slice(0, 4).map(r => r2(Math.min(4, Math.max(0.2, num(r.size, 1)))));
  let LV = [...new Set(sizes)].sort((a, b) => a - b).map(v => ({ v, m: [v] }));
  while (LV.length > 3) {
    let k = 0;
    for (let i = 1; i < LV.length - 1; i++) if (LV[i + 1].v / LV[i].v < LV[k + 1].v / LV[k].v - 1e-9) k = i;
    const a = LV[k], b = LV[k + 1];
    LV.splice(k, 2, { v: r2(Math.sqrt(a.v * b.v)), m: a.m.concat(b.m) });
  }
  const level = v => { const l = LV.find(x => x.m.includes(r2(v))); return l ? l.v : v; };
  const rows = [];
  (P.rows || []).slice(0, 4).forEach((r, i) => {
    const want = String(r.role || 'sans').toLowerCase();
    const name = ROLE[want] ? want : 'sans';
    const R = ROLE[name]();
    const el = MG.el('div', 'row', null, blk);
    Object.assign(el.style, { fontFamily: R.css, fontWeight: R.weight, fontStyle: R.style,
      letterSpacing: R.track, lineHeight: R.lh, color: truthy(r.accent) ? P.accent : P.color });
    const words = MG.starWords(r.text).map(({ t, acc }) => {
      const w = MG.el('span', 'mg-w', t, el);
      if (acc) { w.style.color = P.accent; w.dataset.acc = '1'; }
      return w;
    });
    if (truthy(r.accent)) words.forEach(w => { w.dataset.acc = '1'; });
    // 'size' is optical: a 1.0 script row reads as big as a 1.0 sans row
    if (words.length) {
      const k = Array.isArray(RDrows[i]) ? RDrows[i] : [];
      rows.push({ el, R, words, size: level(Math.min(4, Math.max(0.2, num(r.size, 1)))) * R.opt,
        at: String(r.at ?? '').trim(), known: words.map((_, j) => onset(k[j])) });
    } else el.remove();
  });
  const authored = rows;
  // reveal times, in READING order: a spoken row's words land on their
  // spoken onsets (a word nobody says lands with the one before it); a row
  // nobody says uses its 'at' (blank: right after the previous row) with
  // its stagger squeezed so it is complete before the next row starts. No
  // word ever appears before a word above it.
  const startOf = r => {
    if (!r) return null;
    const k = r.known.filter(v => v != null);
    if (k.length) return Math.min(...k);
    return r.at !== '' ? Math.max(0, num(r.at, 0)) : null;
  };
  let prevLast = 0, prevEnd = -0.25;
  rows.forEach((r, idx) => {
    if (r.known.some(v => v != null)) {
      let cur = r.known.find(v => v != null);
      r.times = r.known.map(v => (cur = v != null ? v : cur));
    } else {
      const t0 = r.at !== '' ? Math.max(0, num(r.at, 0)) : prevEnd + 0.25;
      const next = startOf(rows[idx + 1]);
      let st = (next != null && next > t0) ? Math.min(stagger, (next - t0) / r.words.length) : stagger;
      // squeezed under two frames: a label or kicker lands as one unit
      if (st < stagger && st < 2 / FPS) st = 0;
      r.times = r.words.map((_, j) => t0 + j * st);
    }
    r.times = r.times.map(t => (prevLast = Math.max(t, prevLast)));
    r.t0 = r.times[0];
    prevEnd = r.times[r.times.length - 1];
  });

  // ── layout: one base scale for the whole ladder ──
  let lastFs = 40;
  const layout = () => {
    if (!authored.length) return;
    const colW = Math.min(P.width * W, W - 120);
    const cx = Math.min(Math.max(P.x * W, 60 + colW / 2), W - 60 - colW / 2);
    authored.forEach(r => { r.el.style.fontSize = (100 * r.size) + 'px'; r.el.style.marginTop = '0px'; });
    const wUnit = Math.max(...authored.map(r => r.el.offsetWidth), 1);
    const hUnit = authored.reduce((a, r) => a + 100 * r.size * r.R.lh, 0);
    const maxSize = Math.max(...authored.map(r => r.size));
    // widest row fills the column; the block stays under ~52% of the frame height
    // and the biggest row under ~20% FH
    let k = Math.min(colW / wUnit, 0.52 * H / hUnit, 0.2 * H / (100 * maxSize));
    // the column is placed first: rows only collide where their glyphs share a column
    blk.style.width = colW + 'px';
    blk.style.left = (cx - colW / 2) + 'px';
    blk.style.alignItems = P.align === 'left' ? 'flex-start' : P.align === 'right' ? 'flex-end' : 'center';
    blk.style.textAlign = P.align;
    const sizeRows = (kk) => {
      rows.forEach((r, i) => {
        const fs = r.fs = 100 * r.size * kk;
        r.el.style.fontSize = fs + 'px';
        const a1 = r.R.thin ? 0.42 : 0.28, a2 = r.R.thin ? 0.55 : 0.42;
        r.el.style.textShadow = `0 ${(fs * 0.015).toFixed(1)}px ${(fs * 0.05).toFixed(1)}px rgba(0,0,0,${a1}), 0 ${(fs * 0.03).toFixed(1)}px ${(fs * 0.16).toFixed(1)}px rgba(0,0,0,${a2})`;
        // negative leading / tucks: a script row dips into the row below it
        if (i > 0) {
          const prev = rows[i - 1];
          r.el.style.marginTop = (prev.R.gap * prev.fs - 0.02 * Math.min(prev.fs, fs)) + 'px';
        }
      });
    };
    // glyph-aware leading: keep the designed tightness, but push a row down
    // just enough that no glyph of it comes near a glyph of the row above in
    // the same column (descenders onto caps, a swash onto the next row)
    const clearRows = () => {
      if (P.leading === 'overlap') return;
      rows.forEach((r, i) => {
        if (!i) return;
        const prev = rows[i - 1], m = Math.min(prev.fs, r.fs);
        const need = MG.stackGap(prev.el, r.el, { clear: 0.07 * m, pad: 0.03 * m });
        if (need > 0.25) r.el.style.marginTop = (parseFloat(r.el.style.marginTop) + need) + 'px';
      });
    };
    const fit = kk => { sizeRows(kk); clearRows(); };
    fit(k);
    if (P.leading !== 'overlap') {
      // the pushed ladder still keeps the ~52% height budget
      const h0 = blk.getBoundingClientRect().height;
      if (h0 > 0.52 * H) { k *= 0.52 * H / h0; fit(k); }
    }
    lastFs = Math.max(...rows.map(r => r.fs));
    const h = blk.getBoundingClientRect().height;
    const top = Math.min(Math.max(H * P.y - h / 2, H * 0.06), H * 0.86 - h);
    blk.style.top = top + 'px';
    let x0 = W, y0 = H, x1 = 0, y1 = 0;
    rows.forEach(r => { const b = r.el.getBoundingClientRect();
      x0 = Math.min(x0, b.left - r.fs * 0.35); x1 = Math.max(x1, b.right + r.fs * 0.35);
      y0 = Math.min(y0, b.top - r.fs * 0.45); y1 = Math.max(y1, b.bottom + r.fs * 0.5); });
    if (P.scrim > 0) {
      const px = 0.25 * lastFs + 50, py = 0.3 * lastFs + 50;
      x0 -= px; x1 += px; y0 -= py; y1 += py;
      Object.assign(scrim.style, { left: x0 + 'px', top: y0 + 'px', width: (x1 - x0) + 'px', height: (y1 - y0) + 'px' });
    }
    MG.box = [Math.max(0, x0), Math.max(0, y0), Math.min(W, x1), Math.min(H, y1)];
    // a measured bright plate (MG.legible), each row from its reveal on:
    // thin (serif/script) and small rows need 4.5:1, big heavy rows 3:1,
    // beyond what the soft scrim already gives — dark ink where the plate
    // is bright under every word (the accent deepened in its hue, the
    // scrim standing down), else a glyph scrim; a box only past that,
    // sized to the final block from the first row on (never per row).
    BKS.forEach(b => b.remove()); BKS = []; DARK = false;
    MG.unlegible(rows.map(r => r.el));
    const have = 0.3 * 0.8 * (P.scrim || 0);
    const parts = rows.map(r => {
      const body = r.R.thin || r.fs < 0.06 * H;
      // the accent words as they read on this plate (MG.accentInk): a thin
      // serif or script accent needs APCA Lc 45, a heavy one 35; brightened
      // only over a plate too dark for it
      const acc = r.words.filter(w => w.dataset.acc);
      let accent = P.accent;
      if (acc.length && MG.plate) {
        const ar = MG.rectOf(acc);
        const res = ar ? MG.accentInk(ar, P.accent, { lc: r.R.thin ? 45 : 35, t0: r.t0, t1: D, have }) : null;
        accent = res ? res.color : P.accent;
        acc.forEach(w => { w.style.color = accent; });
      }
      return { el: r.el, ratio: body ? 4.5 : 3, ink: P.color, acc, accent, t0: r.t0, t1: D,
               base: r.R.thin ? 0.35 : 0.25 };
    });
    if (MG.plate && MG.luminance(P.color) >= 0.3) {
      const res = MG.legible(parts, { have, root: MG.$('.mg-root'),
        box: { pad: BK_PAD.map(k => k * lastFs), feather: 0.3 * lastFs, radius: 0.28 * lastFs, join: 0.4 * lastFs } });
      DARK = res.mode === 'dark';
      res.boxes.forEach(b => { BKS.push(b); MG.growBox(b.box); });
    }
  };
  let BKS = [], DARK = false;
  const BK_PAD = [0.16, 0.05];
  layout();
  MG.ready = Promise.all(rows.map(r => document.fonts.load(`${r.R.weight} ${r.R.style} 100px ${r.R.css}`).catch(() => 0)))
    .then(() => document.fonts.ready).then(layout);

  // ── choreography: per-word reveals in place, block exit ──
  const E = P.entrance, IN = E === 'rise' ? 0.14 : E === 'ghost' ? 0.075 : 0;
  const exitDur = P.exit === 'fade' ? 0.18 : P.exit === 'blur' ? 0.22 : 0;
  const wins = [];
  rows.forEach(r => r.times.forEach(t0 => wins.push([Math.max(0, t0 - 0.02), t0 + IN + 0.02])));
  if (exitDur) wins.push([Math.max(0, D - exitDur - 0.04), D]);
  const sc0 = rows.length ? rows[0].t0 : 0;
  wins.push([Math.max(0, sc0 - 0.07), sc0 + 0.32]);                                 // scrim / box fade-in
  MG.active(wins);
  MG.frame(t => {
    rows.forEach(r => r.words.forEach((w, j) => {
      const t0 = r.times[j];
      let s;
      if (t < t0 - 1e-6) s = { opacity: 0 };
      else if (E === 'ghost') s = { opacity: t < t0 + 0.067 - 1e-6 ? 0.35 : 1 };
      else if (E === 'rise') {
        const p = MG.ease.outCubic(MG.range(t, t0, 0.13));
        s = { opacity: MG.range(t, t0, 0.08), y: (1 - p) * Math.max(8, r.fs * 0.06), blur: (1 - p) * 8 };
      } else s = { opacity: 1 };
      MG.set(w, s);
    }));
    let x = { opacity: 1 };
    if (exitDur && t > D - exitDur - 1e-6) {
      const q = MG.range(t, D - exitDur, exitDur);
      x = P.exit === 'fade' ? { opacity: 1 - MG.ease.outQuad(q) }
        : { opacity: 1 - MG.ease.inQuad(q), blur: q * 14, y: -q * lastFs * 0.12 };
    }
    MG.set(blk, x);
    // dark ink never sits in a dark scrim
    if (P.scrim > 0) scrim.style.opacity = DARK ? 0 : (MG.ease.outCubic(MG.range(t, sc0 - 0.05, 0.3)) * (x.opacity ?? 1)).toFixed(4);
    BKS.forEach(bk => { bk.style.opacity = (MG.ease.outCubic(MG.range(t, sc0, 0.12)) * (x.opacity ?? 1)).toFixed(4); });
  });
})();
</script>
