<!--MG-SPEC {"title": "Film burn", "category": "transition",
 "description": "An organic film burn: charred blotches creep in from one edge, a boiling orange-to-white burn floods the frame ~0.35 s in, then cools and dissolves. Use as a bold filmic transition between scenes (put the peak on the cut) or, with low coverage, as a warm edge-burn accent.",
 "duration": 0.8, "layer": "above_captions", "mutes_captions": false,
 "params": {
  "from": {"type": "enum", "values": ["right", "left", "bottom", "top"], "default": "right", "hint": "edge the burn grows from"},
  "tone": {"type": "enum", "values": ["fire", "gold", "crimson"], "default": "fire", "hint": "fire = red/orange/white, gold = amber/cream, crimson = deep red/pink"},
  "coverage": {"type": "float", "min": 0.35, "max": 1.0, "default": 0.85, "hint": "how much of the frame burns at the peak (1 = whole frame)"},
  "seed": {"type": "int", "min": 1, "max": 999, "default": 3, "hint": "shape variation"}
 },
 "example": {"from": "right"},
 "sfx": [{"at": 0.28, "kind": "impact_soft"}]} -->
<style>
  #fb{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
</style>
<div class="mg-root"><canvas id="fb"></canvas></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, D = MG.duration, fps = MG.fps;
  // The burn is a per-pixel noise field computed at quarter resolution and
  // smoothed up by the compositor (its edges are soft anyway).
  const Q = 2, cw = Math.ceil(W / Q), ch = Math.ceil(H / Q);
  const cv = MG.$('#fb');
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(cw, ch);
  const px = img.data;
  const seed = Math.max(1, Math.round(P.seed || 3));
  const cov = MG.clamp(P.coverage ?? 0.85, 0.35, 1);

  // ── value noise (deterministic) ─────────────────────────────────────────
  const N = 256, grid = new Float32Array(N * N);
  { const r = MG.rand(seed * 101 + 7); for (let i = 0; i < N * N; i++) grid[i] = r(); }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
    const a = grid[y0 * N + x0], b = grid[y0 * N + x1], c = grid[y1 * N + x0], d = grid[y1 * N + x1];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, y) => 0.55 * vnoise(x, y) + 0.3 * vnoise(x * 2.03 + 17.1, y * 2.03 + 3.7) + 0.15 * vnoise(x * 4.1 + 5.3, y * 4.1 + 11.9);

  // ── palette: char → deep → hot → bright → core ──────────────────────────
  const TONES = {
    fire: [[22, 7, 2], [170, 30, 8], [255, 104, 0], [255, 196, 64], [255, 247, 224]],
    gold: [[36, 18, 4], [200, 96, 12], [255, 170, 40], [255, 226, 150], [255, 251, 240]],
    crimson: [[20, 2, 8], [140, 10, 30], [232, 38, 58], [255, 138, 92], [255, 232, 222]],
  };
  const T = TONES[P.tone] || TONES.fire;
  // 256-entry colour/alpha LUT over burn intensity 0..1
  const LUT = new Uint8ClampedArray(256 * 4);
  const STOPS = [[0, 0, 0.0], [0.05, 0, 0.88], [0.13, 1, 0.92], [0.3, 2, 0.95], [0.55, 3, 0.97], [0.85, 4, 1.0], [1, 4, 1.0]];
  for (let i = 0; i < 256; i++) {
    const v = i / 255;
    let k = 0;
    while (k < STOPS.length - 2 && v > STOPS[k + 1][0]) k++;
    const [v0, c0, a0] = STOPS[k], [v1, c1, a1] = STOPS[k + 1];
    const p = MG.clamp((v - v0) / Math.max(1e-6, v1 - v0));
    const ca = T[c0], cb = T[c1];
    LUT[i * 4] = ca[0] + (cb[0] - ca[0]) * p;
    LUT[i * 4 + 1] = ca[1] + (cb[1] - ca[1]) * p;
    LUT[i * 4 + 2] = ca[2] + (cb[2] - ca[2]) * p;
    LUT[i * 4 + 3] = 255 * (a0 + (a1 - a0) * p);
  }

  // ── geometry: origin on the chosen edge, distances in frame-diag units ──
  const from = P.from || 'right';
  const rs = MG.rand(seed * 31 + 1);
  const along = 0.32 + 0.36 * rs();
  const O = from === 'right' ? [W * 1.04, H * along] : from === 'left' ? [-W * 0.04, H * along]
    : from === 'top' ? [W * along, -H * 0.03] : [W * along, H * 1.03];
  const diag = Math.hypot(W, H);
  const corners = [[0, 0], [W, 0], [0, H], [W, H]];
  const dMax = Math.max(...corners.map(c => Math.hypot(c[0] - O[0], c[1] - O[1]))) / diag;
  const TP = Math.min(0.35, D * 0.6);                    // flood peak
  const rPeak = cov * dMax * 1.02;
  const radius = t => t < TP
    ? rPeak * (0.06 + 0.94 * MG.ease.inOutCubic(MG.clamp(t / TP)))
    : rPeak * (1 + 0.22 * MG.range(t, TP, Math.max(0.05, D - TP)));
  // fade: holds through the flood, then dissolves (bright core lingers)
  const fade = t => 1 - MG.ease.inQuad(MG.range(t, TP + 0.08 * D, Math.max(0.05, D * 0.88 - TP)));

  const NS = 3.0 / (diag / Q);                           // shape noise: cells per diag
  const HS = 7.0 / (diag / Q);                           // heat/texture noise
  MG.box = [0, 0, W, H];
  MG.active([[0, D]]);
  MG.frame(t => {
    const r = radius(t), fd = fade(t);
    const fr = Math.floor(t * fps);
    const flick = 0.9 + 0.1 * MG.rand(seed * 13 + fr)();
    const drift = t * 1.8;
    const soft = 0.24;                                   // colour ramp width (diag units)
    const ox = O[0] / Q, oy = O[1] / Q, inv = Q / diag;
    const late = MG.range(t, TP, Math.max(0.05, D - TP));   // 0 → 1 after the peak
    const dissolve = late * 1.5;
    let i = 0;
    for (let y = 0; y < ch; y++) {
      const dy = y - oy;
      for (let x = 0; x < cw; x++, i += 4) {
        const dx = x - ox;
        const d = Math.sqrt(dx * dx + dy * dy) * inv;
        if (d > r + 0.3) { px[i + 3] = 0; continue; }
        // domain-warped shape noise gives ragged, fingery burn edges
        // noise domains are rotated so the value-noise lattice never reads as a grid
        const rx = 0.866 * x - 0.5 * y, ry = 0.5 * x + 0.866 * y;
        const wx = vnoise(rx * NS * 0.7 + 9.2, ry * NS * 0.7 + drift * 0.5) - 0.5;
        const n = fbm(rx * NS + wx * 2.2 + drift, ry * NS + wx * 1.6 - drift * 0.6);
        let v = (r - d + (n - 0.5) * 0.42) / soft;          // > 0: burning
        if (v <= 0) {
          // charred blotches race ahead of the front
          if (v > -0.7) {
            const bl = vnoise((0.7 * x + 0.71 * y) * NS * 3.4 + 40, (0.71 * x - 0.7 * y) * NS * 3.4 - drift * 1.3);
            const th = 0.6 - v * 0.35;
            if (bl > th) {
              px[i] = T[0][0]; px[i + 1] = T[0][1]; px[i + 2] = T[0][2];
              px[i + 3] = 235 * fd * MG.clamp((bl - th) * 8);
              continue;
            }
          }
          px[i + 3] = 0;
          continue;
        }
        // heat varies inside the burn: hot white pockets, orange patches
        const hx = 0.94 * x + 0.34 * y, hy = -0.34 * x + 0.94 * y;
        const heat = vnoise(hx * HS + drift * 2.2, hy * HS - drift * 1.4) * 0.65 + vnoise(hy * HS * 2.3 + 5, hx * HS * 2.3 + drift * 3) * 0.35;
        let k = Math.min(1, v) * (0.5 + 0.62 * heat) + Math.max(0, v - 1) * 0.08;
        k = Math.min(1, k * (1 - 0.2 * late));                // cools a little as it fades
        const ki = (k * 255) | 0;
        // dissolve: cooler patches fade first, the hottest pockets linger
        const keep = MG.clamp((heat + 0.75 - dissolve) * 2.6);
        px[i] = LUT[ki * 4]; px[i + 1] = LUT[ki * 4 + 1]; px[i + 2] = LUT[ki * 4 + 2];
        px[i + 3] = LUT[ki * 4 + 3] * fd * keep * flick;
      }
    }
    ctx.putImageData(img, 0, 0);
  });
})();
</script>
