<!--MG-SPEC {"title": "Word slam", "category": "type",
 "description": "One huge hero word or 2-3 word phrase (up to ~85% of the width) that lands ON the spoken word - the main 'wow' device. Use it on the single most important word of a beat, at most every 6-8 s; *star* a word for the accent colour and put the spoken connector words in the small kicker. The slam entrance lands 0.2 s after start, so start it 0.2 s before the word. Back-to-back slams of the same style form a series and share one size per line. tier='payoff' locks a figure and its noun up in the accent ('*140* / characters'); tier='hero' is the short's ONE giant word behind the speaker.",
 "duration": 1.5, "layer": "above_captions", "mutes_captions": true,
 "params": {
  "text": {"type": "str", "required": true, "max": 40, "hint": "1-3 words; ' / ' forces a line break; wrap a word in *stars* for the accent colour"},
  "entrance": {"type": "enum", "values": ["pop", "ghost", "strobe", "rise", "slam", "letters"], "default": "pop", "hint": "pop = hard cut on the word; ghost = 2 frames at 35% then snap; strobe = on/off flicker; rise = small rise + blur-to-sharp; slam = 1.5x to 1x impact with shake; letters = per-letter cascade"},
  "role": {"type": "enum", "values": ["grotesk", "condensed", "serif", "script"], "default": "grotesk", "hint": "grotesk = heavy tight sans; condensed = Anton caps; serif = italic serif; script = formal script"},
  "color": {"type": "color", "default": "#F8F6F2"},
  "accent": {"type": "color", "default": "#ED080D"},
  "kicker": {"type": "str", "default": "", "max": 60, "hint": "optional small connector line above the hero (e.g. 'out of the')"},
  "y": {"type": "float", "min": 0.12, "max": 0.8, "default": 0.56, "hint": "vertical centre as a frame fraction; keep off the face"},
  "uppercase": {"type": "bool", "default": true, "hint": "caps for grotesk/condensed; serif and script keep the typed case"},
  "exit": {"type": "enum", "values": ["cut", "fade", "blur", "strobe"], "default": "cut"},
  "fit": {"type": "enum", "values": ["shared", "justify"], "default": "shared", "hint": "justify = every ' / ' line scaled to the same width, so a short stat towers over its label ('*32%* / fewer errors'); shared = one type size"},
  "x": {"type": "float", "min": 0.3, "max": 0.7, "default": 0.5, "hint": "horizontal centre as a frame fraction; the face keep-out nudges it left of the platform's right button rail"},
  "width": {"type": "float", "min": 0.4, "max": 0.85, "default": 0.85, "hint": "widest line's width as a frame fraction"},
  "tier": {"type": "enum", "values": ["display", "payoff", "hero"], "default": "display", "hint": "display = the slam as fitted by fit/width; payoff = the short's closing lockup: a number and its noun locked up together ('*140* / characters'), every hero line in the accent, justified - make it the largest lockup of the short; hero = ONE giant word per short (line up to 30% of the frame height on a short word; a long word is width-bound) set behind the speaker: add_motion_graphic defaults its layer to behind_subject and, when no subject matte can be measured, draws it as a display slam above the picture, clear of the face. Both optional - only where the moment earns it"}
 },
 "example": {"text": "*Ordinary*", "kicker": "out of the", "entrance": "slam", "role": "condensed"},
 "sfx": [{"at": 0.0, "kind": "kick", "when": {"entrance": ["pop", "strobe"]}},
         {"at": 0.067, "kind": "kick", "when": {"entrance": ["ghost"]}},
         {"at": 0.2, "kind": "whoosh_hard", "when": {"entrance": ["slam"]}},
         {"at": 0.2, "kind": "kick", "when": {"entrance": ["slam"]}},
         {"at": 0.0, "kind": "pop_soft", "when": {"entrance": ["rise"]}},
         {"at": 0.0, "kind": "tick", "when": {"entrance": ["letters"]}}]} -->
<style>
  .blk{position:absolute;left:0;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
  .kick{white-space:nowrap;line-height:1.05;will-change:opacity,transform}
  .line{white-space:nowrap;display:block;will-change:transform,opacity,filter}
  .line .mg-w{margin-right:.2em}
  .line .mg-w:last-child{margin-right:0}
  .mg-c{will-change:transform,opacity,filter;transform-origin:50% 62%}
</style>
<div class="mg-root"><div class="blk" id="blk"></div></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, D = MG.duration, FPS = MG.fps || 30;
  const blk = MG.$('#blk');
  // ── font roles (first bundled family wins; graceful CSS fallbacks) ──
  const FAM = new Set(Array.from(document.fonts, f => f.family.replace(/["']/g, '')));
  const first = list => list.find(f => FAM.has(f));
  const SCRIPTS = ['Pinyon Script', 'Great Vibes', 'Yellowtail', 'Allura', 'Satisfy'];
  const role = (name) => {
    if (name === 'condensed') {
      const f = first(['Anton', 'Bebas Neue']) || 'Anton';
      return { css: `'${f}','Bebas Neue','Inter Display',sans-serif`, weight: 400, style: 'normal', track: f === 'Anton' ? '0em' : '0.01em', lh: 0.9, caps: true };
    }
    if (name === 'serif') {
      const f = first(['Instrument Serif', 'Playfair Display', 'DM Serif Display']) || 'Instrument Serif';
      return { css: `'${f}','Playfair Display',Georgia,serif`, weight: f === 'Playfair Display' ? 900 : 400, style: 'italic', track: '-0.02em', lh: 0.92, caps: false };
    }
    if (name === 'script') {
      const f = first(SCRIPTS);
      if (f) return { css: `'${f}','Instrument Serif',cursive`, weight: 400, style: 'normal', track: '0em', lh: 1.05, caps: false };
      return { css: `'Instrument Serif','Playfair Display',Georgia,serif`, weight: 400, style: 'italic', track: '-0.015em', lh: 0.95, caps: false };
    }
    return { css: `'Inter Display','Inter',sans-serif`, weight: 900, style: 'normal', track: '-0.04em', lh: 0.88, caps: true };
  };
  const R = role(P.role);
  const caps = P.uppercase && R.caps;
  // tiers: display (as fitted), payoff (number + noun in the accent,
  // justified), hero (the one giant word: wider column, taller budget)
  const TIER = P.tier || 'display', HERO = TIER === 'hero', PAYOFF = TIER === 'payoff';
  const sans = FAM.has('Inter') ? `'Inter','Inter Display',sans-serif` : `'Inter Display',sans-serif`;

  // ── build: kicker + hero lines (words -> chars for the letter cascade) ──
  const parse = s => MG.starWords(s).map(({ t, acc }) => ({ text: caps ? t.toUpperCase() : t, acc: acc || PAYOFF }));
  const raw = String(P.text || '').trim();
  let rows = raw.split(/\s*(?:\/|\n)\s*/).map(parse).filter(r => r.length);
  if (!rows.length) rows = [[{ text: ' ', acc: false }]];
  let kick = null;
  if (String(P.kicker || '').trim()) {
    kick = MG.el('div', 'kick', String(P.kicker).trim(), blk);
    kick.style.fontFamily = sans; kick.style.fontWeight = FAM.has('Inter') ? 600 : 700;
    kick.style.letterSpacing = '-0.02em'; kick.style.opacity = 0.94;
  }
  const hero = MG.el('div', 'hero', null, blk);
  let lines = [], chars = [];
  const buildLines = (groups) => {
    hero.textContent = ''; lines = []; chars = [];
    groups.forEach(g => {
      const el = MG.el('div', 'line', null, hero);
      Object.assign(el.style, { fontFamily: R.css, fontWeight: R.weight, fontStyle: R.style,
        letterSpacing: R.track, lineHeight: R.lh, color: P.color });
      g.forEach(w => {
        const we = MG.el('span', 'mg-w', null, el);
        if (w.acc) we.style.color = P.accent;
        Array.from(w.text).forEach(ch => chars.push(MG.el('span', 'mg-c', ch, we)));
      });
      lines.push(el);
    });
  };

  // ── layout: one shared size, fitted to ~85% width and a height budget ──
  // (x 0.5 / width 0.85 are the historical centred 85% layout)
  const maxW = W * (HERO ? Math.max(0.94, P.width || 0) : (P.width > 0 ? P.width : 0.85));
  if (P.x > 0) blk.style.left = (W * P.x - W / 2) + 'px';
  const measure = (el) => { const fs = el.style.fontSize; el.style.fontSize = '100px';
    const w = el.scrollWidth; el.style.fontSize = fs; return w / 100; };
  const heightOf = n => HERO ? (n === 1 ? 0.3 : 0.46) : (n === 1 ? 0.25 : 0.32);
  const fitSize = (groups) => {
    buildLines(groups);
    const wmax = Math.max(...lines.map(measure), 0.01);
    const budget = heightOf(groups.length) * H / (groups.length * R.lh);
    return Math.max(24, Math.min(maxW / wmax, budget));
  };
  // ── a series: a run of parallel slams shares one size per line ──
  // (motion_look.attach_series hands each member the run's texts) — the
  // smallest fit of each line across the members, so no label jumps in
  // size and the baseline and column hold between members
  const SER = (P._series && Array.isArray(P._series.texts) && P._series.texts.length > 1) ? P._series.texts : null;
  const seriesWidths = () => {
    // per member, per line: its width at 100px (a throwaway measuring line)
    const probe = MG.el('div', 'line', null, blk);
    Object.assign(probe.style, { fontFamily: R.css, fontWeight: R.weight, fontStyle: R.style,
      letterSpacing: R.track, lineHeight: R.lh, position: 'absolute', visibility: 'hidden', fontSize: '100px' });
    const out = SER.map(txt => String(txt || '').trim().split(/\s*(?:\/|\n)\s*/).map(parse).filter(r => r.length)
      .map(ws => {
        probe.textContent = '';
        ws.forEach(w => MG.el('span', 'mg-w', w.text, probe));
        return probe.scrollWidth / 100;
      }));
    probe.remove();
    return out;
  };
  let fs = 0, shadow = '';
  // Every contiguous split of the words into 1-3 lines (or the explicit ' / ' breaks).
  const splits = (ws) => {
    const out = [[ws]];
    for (let a = 1; a < ws.length; a++) {
      out.push([ws.slice(0, a), ws.slice(a)]);
      for (let b = a + 1; b < ws.length; b++) out.push([ws.slice(0, a), ws.slice(a, b), ws.slice(b)]);
    }
    return out;
  };
  const layout = () => {
    let groups = rows;
    if (rows.length === 1 && rows[0].length >= 2 && !SER) {
      // A long single line reads small: stack it when that makes the type clearly bigger.
      let best = null;
      splits(rows[0]).forEach(cand => {
        const score = fitSize(cand) / Math.pow(1.3, cand.length - 1);   // each extra line must earn 30%
        if (!best || score > best.score) best = { score, cand };
      });
      groups = best.cand;
    }
    fs = fitSize(groups);
    const justify = (P.fit === 'justify' || PAYOFF) && groups.length > 1;
    const sw = SER ? seriesWidths() : null;
    const lineCap = PAYOFF ? 0.26 : 0.24;
    if (justify) {
      // a justified stack: each line fills the same width, inside one height budget
      // (a series: each line at the smallest such size across the members)
      let sz = lines.map((el, i) => {
        const ws = sw ? sw.map(m => m[i] || 0.01) : [measure(el)];
        return Math.min(maxW / Math.max(...ws, 0.01), lineCap * H);
      });
      const tot = sz.reduce((a, b) => a + b, 0) * R.lh, budget = 0.42 * H;
      if (tot > budget) sz = sz.map(v => v * budget / tot);
      lines.forEach((el, i) => { el.style.fontSize = sz[i] + 'px'; });
      fs = Math.max(...sz);
    } else {
      if (sw) {
        // one shared size: the smallest any member fits at
        const budget = heightOf(groups.length) * H / (groups.length * R.lh);
        fs = Math.max(24, Math.min(budget, ...sw.map(m => maxW / Math.max(...m, 0.01))));
      }
      lines.forEach(el => { el.style.fontSize = fs + 'px'; });
    }
    // Soft two-stage shadow (no outlines): a tight contact shade + a wide falloff.
    // Thin roles (serif/script) get more, so they hold on bright plates.
    const thin = P.role === 'serif' || P.role === 'script', a1 = thin ? 0.42 : 0.28, a2 = thin ? 0.55 : 0.42;
    shadow = `0 ${(fs * 0.015).toFixed(1)}px ${(fs * 0.05).toFixed(1)}px rgba(0,0,0,${a1}), 0 ${(fs * 0.03).toFixed(1)}px ${(fs * 0.16).toFixed(1)}px rgba(0,0,0,${a2})`;
    lines.forEach(el => { el.style.textShadow = shadow; });
    if (kick) {
      kick.style.color = P.color; kick.style.textShadow = '0 2px 14px rgba(0,0,0,.45)';
      Object.assign(kick.style, { whiteSpace: 'nowrap', maxWidth: '', textWrap: '' });
      let ks = Math.max(26, Math.min(Math.max(0.3 * fs, 0.024 * H), 0.035 * H, 68));
      kick.style.fontSize = ks + 'px';
      ks = MG.floorType(kick);             // never below the phone-readable floor
      const kw = kick.scrollWidth;
      if (kw > maxW) {
        // shrink toward the floor, then wrap (balanced) rather than go smaller
        ks = Math.max(ks * maxW / kw, MG.minType(kick)); kick.style.fontSize = ks + 'px';
        if (kick.scrollWidth > maxW + 1) Object.assign(kick.style, { whiteSpace: 'normal', maxWidth: maxW + 'px', textWrap: 'balance' });
      }
      kick.style.marginBottom = (R.caps ? 0.06 : 0.0) * fs + 'px';
    }
    // glyph-aware leading: a stacked line's (or the kicker's) descenders never
    // touch the caps below; lines move apart only where their glyphs collide
    const px = el => parseFloat(el.style.fontSize) || fs;
    lines.forEach((el, i) => {
      if (!i) return;
      const m = Math.min(px(lines[i - 1]), px(el));
      const need = MG.stackGap(lines[i - 1], el, { clear: 0.07 * m, pad: 0.03 * m });
      if (need > 0.25) el.style.marginTop = need + 'px';
    });
    if (kick && lines.length) {
      const ks = px(kick);
      const need = MG.stackGap(kick, lines[0], { clear: 0.16 * ks, pad: 0.05 * ks });
      if (need > 0.25) kick.style.marginBottom = (parseFloat(kick.style.marginBottom) + need) + 'px';
    }
    const h = blk.getBoundingClientRect().height;
    const top = Math.min(Math.max(H * P.y - h / 2, H * 0.06), H * 0.86 - h);
    blk.style.top = top + 'px';
    const over = P.entrance === 'slam' ? 0.5 : P.entrance === 'letters' ? 0.5 : 0.08;
    const r = hero.getBoundingClientRect(), b = blk.getBoundingClientRect();
    const padY = r.height * over / 2 + fs * 0.25, padX = r.width * over / 2 + fs * 0.2;
    MG.box = [Math.max(0, r.left - padX), Math.max(0, b.top - padY), Math.min(W, r.right + padX), Math.min(H, b.bottom + padY)];
    legible();
  };
  // ── legibility over a measured bright plate ──
  // Light ink (the colour, never the accent) on a plate too bright for it:
  // where the plate is bright all the way across, the light words switch
  // to dark ink (a red or dark accent reads on it as print does); otherwise
  // a pocket darkens the plate under the light words only, so a saturated
  // accent is never sunk into grey. Hero lines are display type (3:1), the
  // kicker is body type (4.5:1). Unmeasured or dark plates change nothing.
  let BKS = [];
  const lightInk = MG.luminance(P.color) >= 0.3;
  // (MG.need answers 0 for a dark ink, so a red accent never asks for a pocket)
  function legible() {
    BKS.forEach(el => el.remove()); BKS = [];
    if (!MG.plate) return;
    const words = el => Array.from(el.querySelectorAll('.mg-w'));
    // the accent as it reads on this plate (MG.accentInk): a thin serif or
    // script accent needs APCA Lc 45, a heavy one 35; lifted toward white
    // only where the plate would sink it (round 4), unchanged where it reads
    let accInk = P.accent;
    const accWords = lines.flatMap(el => words(el).filter(w => w.style.color));
    const accRect = accWords.length ? MG.rectOf(accWords) : null;
    if (accRect) {
      const thin = P.role === 'serif' || P.role === 'script';
      accInk = MG.accentInk(accRect, P.accent, { lc: thin ? 45 : 35 }).color;
      accWords.forEach(w => { w.style.color = accInk; });
    }
    const darkAccent = MG.luminance(accInk) < 0.3;
    if (!lightInk) return;
    const parts = lines.map(el => {
      const pw = words(el).filter(w => !w.style.color), aw = words(el).filter(w => w.style.color);
      return { el, rect: MG.rectOf(words(el)), acc: aw.length > 0, ratio: 3,
        need: Math.max(pw.length ? MG.need(MG.rectOf(pw), { ink: P.color, ratio: 3 }) : 0,
                       aw.length ? MG.need(MG.rectOf(aw), { ink: accInk, ratio: 3 }) : 0) };
    }).concat(kick ? [{ el: kick, rect: MG.rectOf(kick), acc: false, ratio: 4.5,
                        need: MG.need(MG.rectOf(kick), { ink: P.color, ratio: 4.5 }) }] : [])
      .filter(q => q.rect);
    const weak = parts.filter(q => q.need > 0);
    if (!weak.length) return;
    const u = MG.rectOf(weak.map(q => q.el));
    if ((darkAccent || !weak.some(q => q.acc)) && MG.darkInkOK(u, { ratio: Math.max(...weak.map(q => q.ratio)) })) {
      weak.forEach(q => {
        q.el.style.color = MG.DARK_INK;
        q.el.style.textShadow = `0 0 ${(parseFloat(q.el.style.fontSize) * 0.12).toFixed(1)}px rgba(255,255,255,.22)`;
      });
      return;
    }
    // one pocket per run of adjacent weak parts (no overlapping double-dark bands)
    const runs = [];
    parts.slice().sort((a, b) => a.rect[1] - b.rect[1]).forEach(q => {
      if (q.need <= 0) { runs.push(null); return; }
      const last = runs[runs.length - 1];
      if (last) { last.push(q); } else runs.push([q]);
    });
    runs.filter(Boolean).forEach(run => {
      const rc = run.reduce((v, q) => [Math.min(v[0], q.rect[0]), Math.min(v[1], q.rect[1]), Math.max(v[2], q.rect[2]), Math.max(v[3], q.rect[3])], run[0].rect.slice());
      const em = Math.min(...run.map(q => parseFloat(q.el.style.fontSize)));
      const bk = MG.backing(MG.$('.mg-root'), rc, Math.max(...run.map(q => q.need)),
        { pad: [0.2 * em, 0.06 * em], feather: 0.3 * em, radius: 0.24 * em });
      BKS.push(bk); MG.growBox(bk.box);
    });
  }
  layout();
  MG.ready = Promise.all([`${R.weight} ${R.style} 100px ${R.css}`, `700 60px ${sans}`]
    .map(f => document.fonts.load(f).catch(() => 0))).then(() => document.fonts.ready).then(layout);

  // ── choreography ──
  const E = P.entrance, frameOf = t => Math.floor(t * FPS + 1e-4);
  const LAND = 0.2, EACH = 0.045, LETTER = 0.15;
  const enterEnd = E === 'slam' ? LAND + 0.12 : E === 'letters' ? EACH * chars.length + LETTER
    : E === 'strobe' ? 7 / FPS : E === 'rise' ? 0.16 : E === 'ghost' ? 0.12 : 0.02;
  const exitDur = P.exit === 'fade' ? 0.16 : P.exit === 'blur' ? 0.2 : P.exit === 'strobe' ? 6 / FPS : 0;
  MG.active([[0, Math.min(D, enterEnd + 0.02)], [Math.max(0, D - exitDur - 0.04), D]]);
  MG.frame(t => {
    const f = frameOf(t);
    let s = { opacity: 1 }, ko = 1;
    if (E === 'ghost') ko = s.opacity = t < 0.067 ? 0.35 : 1;
    else if (E === 'strobe') ko = s.opacity = (f <= 2 || f === 4 || f >= 6) ? 1 : 0;
    else if (E === 'rise') {
      const p = MG.ease.outCubic(MG.range(t, 0, 0.13));
      ko = MG.range(t, 0, 0.08);
      s = { opacity: ko, y: (1 - p) * Math.max(10, fs * 0.05), blur: (1 - p) * 9 };
    } else if (E === 'slam') {
      const k = MG.ease.inQuad(MG.range(t, 0, LAND));
      s = { opacity: 0.45 + 0.55 * MG.range(t, 0, 0.05), scale: 1.5 - 0.5 * k, blur: (1 - k) * Math.min(18, fs * 0.05) };
      if (t >= LAND - 1e-6) {
        const sh = [[0.012, -0.007], [-0.008, 0.005]][f - frameOf(LAND)];
        s = { opacity: 1, bright: 1 + 0.35 * (1 - MG.range(t, LAND, 0.12)) };
        if (sh) { s.x = sh[0] * fs * 1.2; s.y = sh[1] * fs * 1.2; }
      }
    } else if (E === 'letters') {
      chars.forEach((c, i) => {
        const k = MG.ease.outCubic(MG.range(t, i * EACH, LETTER));
        MG.set(c, { opacity: MG.range(t, i * EACH, 0.05), scale: 1.5 - 0.5 * k, blur: (1 - k) * Math.min(14, fs * 0.05) });
      });
    }
    MG.set(hero, s);
    if (kick) MG.set(kick, { opacity: 0.94 * ko });
    // exits act on the whole block (kicker included), faster than entrances
    let x = { opacity: 1 };
    if (exitDur > 0 && t > D - exitDur - 1e-6) {
      const q = MG.range(t, D - exitDur, exitDur);
      if (P.exit === 'fade') x.opacity = 1 - MG.ease.outQuad(q);
      else if (P.exit === 'blur') x = { opacity: 1 - MG.ease.inQuad(q), blur: q * 16, scale: 1 + 0.05 * q };
      else if (P.exit === 'strobe') x.opacity = Math.round((D - t) * FPS) - 1 >= 3 ? 0 : 1;
    }
    MG.set(blk, x);
    BKS.forEach(el => { el.style.opacity = (ko * (x.opacity ?? 1)).toFixed(4); });
  });
})();
</script>
