<!--MG-SPEC {"title": "Versus split", "category": "callout",
 "description": "'X vs Y' comparison: two labels (with optional values) slide in from each side, a slanted divider no taller than the text wipes through the middle and a VS badge springs in (or a typographic italic-serif 'vs' with no disc), over a soft two-colour split of the frame. Use when the speaker contrasts two people, companies, options or numbers.",
 "duration": 3.0, "layer": "above_captions", "mutes_captions": false,
 "params": {
  "left": {"type": "str", "required": true, "max": 22, "hint": "left side label, e.g. 'Tesla'"},
  "right": {"type": "str", "required": true, "max": 22, "hint": "right side label, e.g. 'Ford'"},
  "left_sub": {"type": "str", "default": "", "max": 28, "hint": "optional value or short note under the left label, e.g. '$800B'. Both values share one size and one line count: both on one line when they fit at a readable size, else both wrap into two balanced lines (best under ~14 characters each)"},
  "right_sub": {"type": "str", "default": "", "max": 28},
  "left_color": {"type": "color", "default": "#FF4B4B"},
  "right_color": {"type": "color", "default": "#4C7DFF"},
  "tint": {"type": "bool", "default": true, "hint": "soft colour wash from each side of the frame"},
  "vs": {"type": "enum", "values": ["badge", "serif"], "default": "badge", "hint": "badge = round VS disc on a slanted divider; serif = a typographic italic-serif 'vs' between the names, no disc and no divider - the editorial choice for a premium look"},
  "y": {"type": "float", "min": 0.15, "max": 0.78, "default": 0.56, "hint": "vertical centre of the lockup, frame fraction (default sits below the faces of a typical two-shot)"},
  "size": {"type": "float", "min": 0.7, "max": 1.4, "default": 1.0}
 },
 "example": {"left": "Tesla", "right": "Ford", "left_sub": "$800B", "right_sub": "$45B"},
 "sfx": [{"at": 0.1, "kind": "whoosh_hard"}, {"at": 0.4, "kind": "kick", "when": {"vs": ["badge"]}}]} -->
<style>
  .tint{position:absolute;top:0;width:50%;will-change:transform,opacity}
  .lab{position:absolute;top:0;display:flex;flex-direction:column;will-change:transform,opacity,filter}
  .lab .t{font-family:'Inter Display','Inter',sans-serif;font-weight:900;letter-spacing:-.035em;line-height:.94;color:#fff;white-space:normal;text-wrap:balance;
    text-shadow:0 3px 18px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.35)}
  .lab .s{font-family:'Inter Display','Inter',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap;margin-top:.32em;
    text-shadow:0 2px 10px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.4)}
  .div{position:absolute;width:4px;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 22%,#fff 78%,rgba(255,255,255,0));
    box-shadow:0 0 14px rgba(255,255,255,.55);will-change:transform}
  .badge{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;will-change:transform;
    box-shadow:0 16px 40px rgba(0,0,0,.42),0 4px 10px rgba(0,0,0,.25)}
  .badge .in{position:absolute;inset:var(--ring);border-radius:50%;background:radial-gradient(120% 120% at 30% 18%,#fff,#f1f1f3 55%,#d9d9de);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 8px rgba(0,0,0,.12)}
  .badge .vs{position:relative;font-family:'Inter Display','Inter',sans-serif;font-weight:900;letter-spacing:-.06em;color:#0d0d10;line-height:1;transform:translateX(-.03em)}
  .shock{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.9)}
  .vst{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;font-family:'Instrument Serif','Playfair Display',Georgia,serif;font-style:italic;font-weight:400;
    letter-spacing:-.01em;color:#F4F1EC;will-change:transform,opacity;text-shadow:0 2px 14px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.35)}
</style>
<div class="mg-root" id="root"></div>
<script>
(() => {
  const P = MG.params, W = MG.W, H = MG.H, D = MG.duration, S = P.size * (MG.H < MG.W ? 0.72 : 1);
  const root = MG.$('#root');
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  const cx = W / 2, safe = H / W > 1.5 ? [0.08 * H, 0.80 * H] : [0.06 * H, 0.94 * H];
  const serif = P.vs === 'serif';
  let tl = null, tr = null;
  tl = MG.el('div', 'tint', null, root); tr = MG.el('div', 'tint', null, root);
  tl.style.left = '0'; tr.style.right = '0';
  const mk = (txt, sub, col, side) => {
    const el = MG.el('div', 'lab', null, root);
    el.style.alignItems = side === 'L' ? 'flex-end' : 'flex-start';
    el.style.textAlign = side === 'L' ? 'right' : 'left';
    const t = MG.el('div', 't', String(txt || '').trim(), el);
    let s = null;
    if (String(sub || '').trim()) {
      s = MG.el('div', 's', String(sub).trim(), el);
      s.style.color = `color-mix(in srgb, ${col} 40%, #fff)`;
    }
    return { el, t, s };
  };
  const L = mk(P.left, P.left_sub, P.left_color, 'L'), R = mk(P.right, P.right_sub, P.right_color, 'R');
  // badge: a slanted divider + the VS disc; serif: an italic 'vs' set as type
  const dv = serif ? null : MG.el('div', 'div', null, root);
  const shock = serif ? null : MG.el('div', 'shock', null, root);
  const badge = serif ? null : MG.el('div', 'badge', null, root);
  let vs = null;
  if (serif) vs = MG.el('div', 'vst', 'vs', root);
  else {
    badge.style.background = `linear-gradient(90deg, ${P.left_color}, ${P.right_color})`;
    MG.el('div', 'in', null, badge);
    vs = MG.el('div', 'vs', 'VS', badge);
  }
  let G = null;

  function layout() {
    const bd = 158 * S, vsFs = 118 * S;
    // the gap the centre piece needs: the disc, or the italic 'vs' at its largest
    const gapC = serif ? vsFs * 0.42 + 26 * S : bd / 2 + 34 * S, maxW = cx - gapC - 56;
    if (badge) badge.style.setProperty('--ring', (6 * S) + 'px');
    // a side keeps its name on one line unless that would make the shared size much smaller
    // than wrapping would ('Big Tech' stays one line; 'Independent media' takes two balanced
    // lines); both sides then share one size
    const big = 124 * S;
    const fitAt = (o, wrap) => {
      o.t.style.maxWidth = maxW + 'px';
      o.t.style.whiteSpace = wrap ? 'normal' : 'nowrap';
      let v = big;
      const ok = () => {
        o.t.style.fontSize = v + 'px';
        const r = o.t.getBoundingClientRect();
        return r.height <= v * 0.94 * (wrap ? 2 : 1) + 2 && o.t.scrollWidth <= maxW + 1;
      };
      while (!ok() && v > 34) v *= 0.96;
      return v;
    };
    const sizes = [L, R].map(o => ({ one: fitAt(o, false), two: fitAt(o, true) }));
    const target = Math.min(...sizes.map(z => Math.max(z.one, z.two)));
    const fs = Math.min(...[L, R].map((o, i) => {
      const z = sizes[i], wrap = z.two > z.one && z.one < target * 0.8;
      o.t.style.whiteSpace = wrap ? 'normal' : 'nowrap';
      return wrap ? z.two : z.one;
    }));
    [L, R].forEach(o => {
      o.t.style.fontSize = fs + 'px';
      o.t.style.paddingTop = o.t.style.paddingBottom = '0px';
    });
    // the values share ONE size and ONE line count: both on one line at the
    // largest size where both fit, never below the phone-readable floor
    // (MG.minType); when one does not fit there, every multi-word value wraps
    // into two balanced lines at that shared size (only a single word too long
    // for the column may take both below the floor)
    const subs = [L, R].filter(o => o.s);
    if (subs.length) {
      subs.forEach(o => Object.assign(o.s.style, { fontSize: '40px', whiteSpace: 'nowrap', maxWidth: '', textWrap: '', lineHeight: '1' }));
      const floor = Math.max(34 * S, ...subs.map(o => MG.minType(o.s)));
      const top = Math.max(36 * S, fs * 0.46, floor);
      let v = top;
      subs.forEach(o => {
        o.s.style.fontSize = top + 'px';
        const w = o.s.getBoundingClientRect().width;
        if (w > maxW) v = Math.min(v, top * maxW / w);
      });
      v = Math.max(floor, v * 0.995);
      subs.forEach(o => { o.s.style.fontSize = v + 'px'; });
      if (subs.some(o => o.s.getBoundingClientRect().width > maxW + 0.5)) {
        subs.forEach(o => {
          if (o.s.textContent.trim().split(/\s+/).length < 2) return;
          const w1 = o.s.getBoundingClientRect().width;
          Object.assign(o.s.style, { whiteSpace: 'normal', maxWidth: Math.min(maxW, w1 - 1) + 'px', textWrap: 'balance', lineHeight: '1.08' });
        });
        while (subs.some(o => o.s.scrollWidth > maxW + 1) && v > 22) { v *= 0.95; subs.forEach(o => { o.s.style.fontSize = v + 'px'; }); }
      }
    }
    const cy = MG.clamp(P.y * H, safe[0] + bd, safe[1] - bd);
    // the names share one centre line with the centre piece (a one-line name is
    // centred against a two-line one); the values hang below on a common baseline
    const th = Math.max(L.t.getBoundingClientRect().height, R.t.getBoundingClientRect().height);
    [L, R].forEach(o => { const p = (th - o.t.getBoundingClientRect().height) / 2; o.t.style.paddingTop = o.t.style.paddingBottom = p + 'px'; });
    const lr = L.el.getBoundingClientRect(), rr = R.el.getBoundingClientRect();
    const lh = Math.max(lr.height, rr.height);
    L.el.style.left = (cx - gapC - lr.width) + 'px'; L.el.style.top = (cy - th / 2) + 'px';
    R.el.style.left = (cx + gapC) + 'px'; R.el.style.top = (cy - th / 2) + 'px';
    if (serif) {
      // the italic 'vs' sits optically centred on the names' cap band
      vs.style.fontSize = Math.min(vsFs, fs * 1.05) + 'px';
      vs.style.left = '0px'; vs.style.top = '0px';
      const g = MG.glyphBoxes(vs), ink = g.length ? [Math.min(...g.map(b => b[0])), Math.min(...g.map(b => b[1])),
        Math.max(...g.map(b => b[2])), Math.max(...g.map(b => b[3]))] : null;
      const vr = vs.getBoundingClientRect();
      const ox = ink ? (ink[0] + ink[2]) / 2 - vr.left : vr.width / 2, oy = ink ? (ink[1] + ink[3]) / 2 - vr.top : vr.height / 2;
      vs.style.left = (cx - ox) + 'px'; vs.style.top = (cy - oy) + 'px';
    } else {
      badge.style.width = badge.style.height = bd + 'px';
      badge.style.left = (cx - bd / 2) + 'px'; badge.style.top = (cy - bd / 2) + 'px';
      vs.style.fontSize = (bd * 0.36) + 'px';
      shock.style.width = shock.style.height = bd + 'px';
      shock.style.left = (cx - bd / 2) + 'px'; shock.style.top = (cy - bd / 2) + 'px';
      // the divider spans the lettering only (names to values, a little past
      // the disc), so it never slashes through the speaker below
      const y0 = Math.min(cy - th / 2, cy - bd / 2) - 0.1 * fs, y1 = Math.max(cy - th / 2 + lh, cy + bd / 2) + 0.1 * fs;
      dv.style.height = (y1 - y0) + 'px'; dv.style.left = (cx - 2) + 'px'; dv.style.top = y0 + 'px';
    }
    // colour wash (or a neutral legibility scrim) confined to a band around the lockup
    const band = Math.max(0.16 * H, lh * 1.3);
    const t0 = Math.max(0, cy - band), t1 = Math.min(H, cy + band), pct = ((cy - t0) / (t1 - t0) * 100).toFixed(1);
    [tl, tr].forEach(e => { e.style.top = t0 + 'px'; e.style.height = (t1 - t0) + 'px'; });
    const wash = (col, x) => P.tint
      ? `radial-gradient(105% 50% at ${x} ${pct}%, ${hexA(col, 0.42)}, ${hexA(col, 0.15)} 48%, ${hexA(col, 0)} 100%)`
      : `radial-gradient(110% 30% at ${x === '0%' ? '100%' : '0%'} ${pct}%, rgba(0,0,0,.34), rgba(0,0,0,.12) 55%, rgba(0,0,0,0) 100%)`;
    // darken under the colour so white type holds on bright footage
    const base = (x) => `radial-gradient(100% 34% at ${x} ${pct}%, rgba(0,0,0,.22), rgba(0,0,0,0) 100%)`;
    tl.style.background = P.tint ? `${wash(P.left_color, '0%')}, ${base('0%')}` : wash(null, '0%');
    tr.style.background = P.tint ? `${wash(P.right_color, '100%')}, ${base('100%')}` : wash(null, '100%');
    MG.box = [0, t0, W, t1];
    // a measured bright plate: a pocket under each side's name + value that
    // still lacks contrast (names are display type, 3:1; values body, 4.5:1)
    // beyond the wash's own darkening. Dark plates: unchanged.
    [L, R].forEach(o => {
      if (o.bk) { o.bk.remove(); o.bk = null; }
      const a = Math.max(MG.need(MG.rectOf(o.t), { ratio: 3, have: 0.15 }),
                         o.s ? MG.need(MG.rectOf(o.s), { ink: '#E6E6E6', ratio: 4.5, have: 0.15 }) : 0);
      if (a > 0) {
        o.bk = MG.backing(root, MG.rectOf([o.t, o.s]), a, { pad: [0.16 * fs, 0.1 * fs], feather: 0.28 * fs, radius: 0.2 * fs });
        MG.growBox(o.bk.box);
      }
    });
    return { lw: lr.width, rw: rr.width };
  }

  const fontsReady = Promise.all(["900 124px 'Inter Display'", "800 57px 'Inter Display'", "italic 400 118px 'Instrument Serif'"]
    .map(f => document.fonts.load(f).catch(() => null)));
  MG.ready = fontsReady.then(() => { G = layout(); });

  const exitDur = Math.min(0.3, D * 0.14), exitAt = D - exitDur - 1 / MG.fps;   // exits finish on the last frame
  MG.active([[0, Math.min(D, 0.86)], [Math.max(0, exitAt - 0.02), D]]);
  MG.frame(t => {
    if (!G) G = layout();
    const out = a => MG.ease.inExpo(MG.range(t, exitAt + a, exitDur - a));
    {
      const e = MG.ease.outCubic(MG.range(t, 0, 0.5)), q = MG.ease.inCubic(MG.range(t, exitAt, exitDur));
      const sh = P.tint ? W * 0.25 : 0;
      MG.set(tl, { x: -(1 - e) * sh, opacity: e * (1 - q) });
      MG.set(tr, { x: (1 - e) * sh, opacity: e * (1 - q) });
    }
    [[L, -1, 0.04], [R, 1, 0.09]].forEach(([o, sg, a]) => {
      const e = MG.ease.outExpo(MG.range(t, a, 0.5)), q = out(sg < 0 ? 0.04 : 0);
      if (o.bk) o.bk.style.opacity = (e * (1 - q)).toFixed(4);
      MG.set(o.t, { x: sg * ((1 - e) * 240 + q * 260) * S, opacity: MG.range(t, a, 0.08) * (1 - q), blur: (1 - e) * 14 + q * 12 });
      if (o.s) {
        const e2 = MG.ease.outExpo(MG.range(t, a + 0.09, 0.5));
        MG.set(o.s, { x: sg * ((1 - e2) * 160 + q * 200) * S, opacity: MG.range(t, a + 0.09, 0.1) * (1 - q), blur: (1 - e2) * 10 + q * 10 });
      }
    });
    if (serif) {
      // the 'vs' settles between the names as they arrive: a short rise and
      // blur-to-sharp, no spin; it leaves with the names
      const e = MG.ease.outCubic(MG.range(t, 0.22, 0.24)), q = out(0.02);
      MG.set(vs, { y: (1 - e) * 14 * S, opacity: MG.range(t, 0.22, 0.1) * (1 - q), blur: (1 - e) * 8 + q * 10 });
      return;
    }
    const dvp = MG.ease.outExpo(MG.range(t, 0.16, 0.45)) * (1 - MG.ease.inCubic(MG.range(t, exitAt + exitDur * 0.3, exitDur * 0.7)));
    MG.set(dv, { rotate: 13, sy: Math.max(0.0001, dvp), opacity: dvp > 0.001 ? 1 : 0 });
    const k = MG.spring(t, 0.3, { stiffness: 420, damping: 21 });
    const bq = MG.ease.inBack(MG.range(t, exitAt + exitDur * 0.25, exitDur * 0.75));
    MG.set(badge, { scale: Math.max(0, k * (1 - bq)), rotate: (1 - k) * -40 });
    const sp = MG.range(t, 0.4, 0.42);
    MG.set(shock, { scale: 1 + 0.95 * MG.ease.outCubic(sp), opacity: sp > 0 && sp < 1 ? 0.75 * (1 - sp) : 0 });
    shock.style.borderWidth = (3 * (1 - sp) + 0.5) + 'px';
  });
})();
</script>
