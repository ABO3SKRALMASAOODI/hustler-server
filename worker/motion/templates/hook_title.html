<!--MG-SPEC {"title": "Hook title", "category": "type",
 "description": "Big opening/thesis title (1-3 lines). Words spring in with blur-to-sharp and a stagger; *starred* words switch to an accent treatment (serif italic, color, marker, or glow). Use for the first 1-3 seconds or a key claim.",
 "duration": 2.6, "layer": "above_captions", "mutes_captions": false,
 "params": {
  "text": {"type": "text", "required": true, "max": 90, "hint": "1-3 short lines; separate lines with ' / ' or newline; wrap accent words in *stars*"},
  "accent": {"type": "color", "default": "#FFD84D"},
  "color": {"type": "color", "default": "#FFFFFF"},
  "treatment": {"type": "enum", "values": ["serif", "color", "marker", "glow", "outline"], "default": "serif"},
  "font": {"type": "enum", "values": ["Inter Display", "Anton", "Bebas Neue", "Archivo Black", "Poppins", "Syne", "Montserrat", "Plus Jakarta Sans"], "default": "Inter Display"},
  "uppercase": {"type": "bool", "default": false},
  "y": {"type": "float", "min": 0.08, "max": 0.92, "default": 0.42, "hint": "vertical centre as frame fraction"},
  "size": {"type": "float", "min": 0.5, "max": 2.0, "default": 1.0, "hint": "absolute; above 1.6 only grows a title that has a base_size"},
  "base_size": {"type": "float", "min": 0, "max": 2.0, "default": 0, "hint": "set by the editor when the size changes: the size the lines were laid out at; size / base_size scales the type, re-breaking into more lines when the width is full"},
  "band_top": {"type": "float", "min": 0, "max": 1, "default": 0, "hint": "set by the editor with base_size: the highest a grown title may reach (clear of the face)"},
  "band_bottom": {"type": "float", "min": 0, "max": 1, "default": 0, "hint": "set by the editor with base_size: the lowest a grown title may reach"},
  "align": {"type": "enum", "values": ["center", "left"], "default": "center"},
  "entrance": {"type": "enum", "values": ["spring", "slam", "rise", "blur", "mask", "pop", "cut"], "default": "spring", "hint": "pop = whole by 0.25 s (a fast fade-scale, tiny stagger); cut = whole on its first frame (a cover-style opening)"},
  "exit": {"type": "enum", "values": ["blur", "drop", "none", "cut"], "default": "blur"},
  "shadow": {"type": "float", "min": 0, "max": 1, "default": 0.55},
  "scrim": {"type": "float", "min": 0, "max": 1, "default": 0.5, "hint": "soft dark glow behind the block so it reads over bright footage; 0 = none"}
 },
 "example": {"text": "Computer fonts / have been *garbage*"},
 "sfx": [{"at": 0.18, "kind": "whoosh_soft"}, {"at": 0.18, "kind": "pop_soft"}]} -->
<style>
  .wrap{position:absolute;left:70px;right:70px;display:flex;flex-direction:column;gap:6px}
  .line{display:block;line-height:1.02;letter-spacing:-0.035em;font-weight:900;white-space:nowrap}
  .mg-w{margin-right:.22em;will-change:transform,filter,opacity;transform-origin:50% 80%}
  .mg-w:last-child{margin-right:0}
  .acc-serif{font-family:'Instrument Serif',serif!important;font-style:italic;font-weight:400!important;letter-spacing:-0.015em;font-size:1.2em;line-height:.85}
  .acc-serif.acc-heavy{font-family:'Playfair Display',serif!important;font-weight:800!important;font-size:1.08em;letter-spacing:-0.02em}
  .acc-marker{position:relative;color:#111!important;padding:0 .12em;z-index:0}
  .acc-marker::before{content:"";position:absolute;left:-.04em;right:-.04em;top:.12em;bottom:.04em;background:var(--accent);border-radius:.08em;z-index:-1;transform-origin:0 50%;transform:scaleX(var(--mk,1))}
  .acc-outline{color:transparent!important;-webkit-text-stroke:3px var(--accent)}
  .scrim{position:absolute;pointer-events:none;border-radius:50%;opacity:0;
    background:radial-gradient(closest-side,rgba(0,0,0,var(--sa)) 0%,rgba(0,0,0,calc(var(--sa) * .62)) 52%,rgba(0,0,0,0) 100%)}
</style>
<div class="mg-root"><div class="scrim" id="scrim"></div><div class="wrap" id="wrap"></div></div>
<script>
(() => {
  const P = MG.params, wrap = MG.$('#wrap'), scrim = MG.$('#scrim');
  scrim.style.setProperty('--sa', (0.78 * P.scrim).toFixed(3));
  const root = document.documentElement;
  root.style.setProperty('--accent', P.accent);
  wrap.style.alignItems = P.align === 'left' ? 'flex-start' : 'center';
  wrap.style.textAlign = P.align;
  const raw = String(P.text || '').replace(/\s*\/\s*/g, '\n');
  let lines = raw.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 3);
  // LS: the size the lines are fitted at (the old range, so a title without
  // a base_size renders exactly as it always has). WAVE_A (31 Oct): "make the
  // title bigger" rendered pixel-identical, because the widest line already
  // filled the column; a size change now records base_size, and size /
  // base_size scales the type, re-breaking into more lines when it must.
  const BASE_RAW = Number(P.base_size) > 0 ? Number(P.base_size) : 0;
  const LS = Math.min(BASE_RAW || P.size, 1.6);
  const GAIN = BASE_RAW ? P.size / BASE_RAW : 1;
  const maxW = MG.W - 140, base = 150 * LS;
  const capFor = n => (n === 1 ? 210 : n === 2 ? 170 : 140) * LS;
  const words = [];
  // the accent as it reads on the plate (MG.accentInk): unchanged on a dark
  // plate; lifted toward white, and a thin serif accent set heavier, where
  // the plate under it would sink it (round 4: 'better surgeons?')
  let ACC = { color: P.accent, short: false }, heavy = false;
  const build = (ls) => {
    wrap.textContent = ''; words.length = 0;
    ls.forEach(L => {
      const el = MG.el('div', 'line', null, wrap);
      el.style.fontFamily = `'${P.font}', 'Inter Display', sans-serif`;
      el.style.color = P.color;
      if (P.font === 'Anton' || P.font === 'Bebas Neue') el.style.letterSpacing = '0';
      MG.starWords(L).forEach(({ t: text, acc }) => {
        const w = MG.el('span', 'mg-w', P.uppercase ? text.toUpperCase() : text, el);
        if (acc) {
          if (P.treatment === 'serif') { w.classList.add('acc-serif'); if (heavy) w.classList.add('acc-heavy'); w.style.color = ACC.color; }
          else if (P.treatment === 'color') w.style.color = ACC.color;
          else if (P.treatment === 'marker') w.classList.add('acc-marker');
          else if (P.treatment === 'outline') w.classList.add('acc-outline');
          else if (P.treatment === 'glow') { w.style.color = '#fff'; w.style.textShadow = `0 0 18px ${P.accent}, 0 0 42px ${P.accent}`; }
        }
        words.push({ el: w, acc, line: el });
      });
    });
  };
  // Size: fit the widest line to the column, capped by line count; all lines share
  // the smallest fitted size (one type size reads premium). Returns that size.
  const fitAll = (ls) => {
    build(ls);
    const els = MG.$$('.line');
    const cap = Math.min(capFor(ls.length), base) * LS;
    // text width scales linearly with font size: measure once at 100px
    els.forEach(el => { el.style.fontSize = '100px'; });
    const wmax = Math.max(...els.map(el => el.scrollWidth), 1);
    const f = Math.max(40, Math.min(cap, maxW * 100 / wmax));
    els.forEach(el => { el.style.fontSize = f + 'px'; });
    return f;
  };
  // One unbroken sentence reads small: balance it into 2-3 lines when that is clearly bigger.
  const autoLines = () => {
    if (lines.length !== 1) return lines;
    const ws = lines[0].split(/\s+/);
    if (ws.length < 3) return lines;
    let best = { ls: lines, score: fitAll(lines) };
    for (let a = 1; a < ws.length; a++) {
      const two = [ws.slice(0, a).join(' '), ws.slice(a).join(' ')];
      const s2 = fitAll(two) / 1.25;
      if (s2 > best.score) best = { ls: two, score: s2 };
      for (let b = a + 1; b < ws.length && ws.length >= 5; b++) {
        const three = [ws.slice(0, a).join(' '), ws.slice(a, b).join(' '), ws.slice(b).join(' ')];
        const s3 = fitAll(three) / 1.5;
        if (s3 > best.score) best = { ls: three, score: s3 };
      }
    }
    return best.ls;
  };
  // The re-breaks a bigger size may take: every split of the words into up
  // to MAXL lines that keeps the text's own line breaks and never splits a
  // *starred* accent; widths measured once per phrase at 100px.
  const MAXL = 4;
  const tokens = () => {
    const out = [];
    lines.forEach((L, li) => {
      let inStar = false;
      L.split(/\s+/).filter(Boolean).forEach((w, k, arr) => {
        const stars = (w.match(/\*/g) || []).length;
        if (stars % 2) inStar = !inStar;
        // a break after this word: forced at the text's own line end,
        // never inside an accent span
        out.push({ w, forced: k === arr.length - 1 && li < lines.length - 1,
                   open: k < arr.length - 1 && !inStar });
      });
    });
    return out;
  };
  const splits = (toks, n) => {
    const forced = [], free = [];
    toks.forEach((t, i) => { if (i < toks.length - 1) (t.forced ? forced : t.open ? free : []).push(i); });
    const k = n - 1 - forced.length;
    if (k < 0 || k > free.length) return [];
    const res = [];
    const pick = (from, left, acc) => {
      if (res.length > 600) return;
      if (!left) { res.push([...forced, ...acc].sort((a, b) => a - b)); return; }
      for (let i = from; i <= free.length - left; i++) pick(i + 1, left - 1, [...acc, free[i]]);
    };
    pick(0, k, []);
    return res.map(cuts => {
      const ls = []; let a = 0;
      cuts.forEach(c => { ls.push(toks.slice(a, c + 1).map(t => t.w).join(' ')); a = c + 1; });
      ls.push(toks.slice(a).map(t => t.w).join(' '));
      return ls;
    });
  };
  // per layout pass: the fonts and the accent's weight change between passes
  const widthMeter = () => {
    const memo = new Map();
    return (phrase) => {
      if (!memo.has(phrase)) {
        build([phrase]);
        const el = MG.$('.line'); el.style.fontSize = '100px';
        memo.set(phrase, Math.max(el.scrollWidth, 1));
      }
      return memo.get(phrase);
    };
  };
  // What to draw: {ls, f, top} (top null = centred on y, as always).
  const choose = () => {
    const ls0 = autoLines();
    const f0 = fitAll(ls0);
    const h0 = wrap.getBoundingClientRect().height;
    const pick = { ls: ls0, f: f0, f0, n0: ls0.length, top: null };
    if (!BASE_RAW || Math.abs(GAIN - 1) < 0.005) return pick;
    const T = f0 * GAIN;
    // the block grows away from the picture's middle: a title under the
    // face keeps its top edge, one above it its bottom edge (the First cut
    // placed it clear of the face), within the frame's safe band
    const portrait = MG.H > MG.W;
    let lo = MG.H * (portrait ? 0.08 : 0.06), hi = MG.H * (portrait ? 0.86 : 0.92);
    const c0 = MG.H * P.y, t0 = c0 - h0 / 2, b0 = c0 + h0 / 2;
    // the band the editor measured clear of the face (band_top/bottom):
    // the block grows around its centre inside it
    const banded = Number(P.band_bottom) > Number(P.band_top) && Number(P.band_bottom) > 0;
    if (banded) {
      lo = Math.max(lo, Math.min(t0, MG.H * Number(P.band_top)));
      hi = Math.min(hi, Math.max(b0, MG.H * Number(P.band_bottom)));
    }
    const anchor = banded ? 'band' : P.y >= 0.55 ? 'top' : P.y <= 0.45 ? 'bottom' : 'centre';
    const room = Math.max(h0, anchor === 'band' ? hi - lo : anchor === 'top' ? hi - t0
      : anchor === 'bottom' ? b0 - lo : 2 * Math.min(c0 - lo, hi - c0));
    const gapPx = 6;
    // the block's height at font f, from its measured shape at f0
    const lineH = (h0 - gapPx * (ls0.length - 1)) / ls0.length / f0;
    const fitH = n => (room - gapPx * (n - 1)) / (n * lineH);
    const topFor = (n, f) => {
      const h = n * lineH * f + gapPx * (n - 1);
      if (anchor === 'band') return Math.min(Math.max(c0 - h / 2, lo), Math.max(lo, hi - h));
      return anchor === 'top' ? t0 : anchor === 'bottom' ? b0 - h : c0 - h / 2;
    };
    if (GAIN < 1) return { ls: ls0, f: T, f0, n0: ls0.length, top: topFor(ls0.length, T) };
    const toks = tokens(), widthAt100 = widthMeter();
    let best = { ls: ls0, f: Math.min(T, maxW * 100 / Math.max(...ls0.map(widthAt100)), fitH(ls0.length)) };
    if (best.f < T * 0.995) {
      for (let n = ls0.length + 1; n <= Math.min(MAXL, toks.length); n++) {
        let bn = null;
        splits(toks, n).forEach(ls => {
          const f = Math.min(T, maxW * 100 / Math.max(...ls.map(widthAt100)), fitH(n));
          if (!bn || f > bn.f) bn = { ls, f };
        });
        if (bn && bn.f > best.f * 1.02) best = bn;
        if (best.f >= T * 0.995) break;
      }
    }
    // a re-break that buys less than 4% is no visible change: keep the title
    if (best.f < f0 * 1.04) return pick;
    return { ls: best.ls, f: best.f, f0, n0: ls0.length, top: topFor(best.ls.length, best.f) };
  };
  let fs = 100;
  const place = (pk) => {
    build(pk.ls);
    MG.$$('.line').forEach(el => { el.style.fontSize = pk.f + 'px'; });
    fs = pk.f;
    const h = wrap.getBoundingClientRect().height;
    wrap.style.top = (pk.top == null ? MG.H * P.y - h / 2 : pk.top) + 'px';
    // what the editor reads back (motion_engine.probe -> info): the type's
    // size and lines, and those of the layout the base size gives
    MG.info = { type_px: Math.round(pk.f * 10) / 10, base_px: Math.round(pk.f0 * 10) / 10,
                lines: pk.ls.length, base_lines: pk.n0 };
  };
  const accentRect = () => MG.rectOf(words.filter(w => w.acc).map(w => w.el));
  const layout = () => {
    ACC = { color: P.accent, short: false }; heavy = false;
    let pk = choose();
    place(pk);
    const tinted = P.treatment === 'serif' || P.treatment === 'color';
    if (MG.plate && tinted && accentRect()) {
      const serif = P.treatment === 'serif';
      const res = MG.accentInk(accentRect(), P.accent, { lc: serif ? 45 : 35, have: 0.3 * 0.78 * P.scrim });
      if (res.color !== P.accent) {
        ACC = res; heavy = serif && res.short;
        pk = choose();
        place(pk);
      }
    }
    if (P.shadow > 0) wrap.style.filter = `drop-shadow(0 ${6 * P.shadow}px ${22 * P.shadow}px rgba(0,0,0,${0.55 * P.shadow}))`;
    const r = wrap.getBoundingClientRect();
    // the scrim hugs the inked words (not the full-width column) with a wide feather
    const ink = MG.$$('.mg-w').map(e => e.getBoundingClientRect());
    const x0 = Math.min(...ink.map(b => b.left)), x1 = Math.max(...ink.map(b => b.right));
    const padX = 0.55 * fs + 40, padY = 0.75 * fs + 40;
    Object.assign(scrim.style, { left: (x0 - padX) + 'px', top: (r.top - padY) + 'px',
      width: (x1 - x0 + 2 * padX) + 'px', height: (r.height + 2 * padY) + 'px' });
    MG.box = P.scrim > 0
      ? [Math.max(0, x0 - padX), Math.max(0, r.top - padY), Math.min(MG.W, x1 + padX), Math.min(MG.H, r.bottom + padY)]
      : [r.left - 60, r.top - 60, r.right + 60, r.bottom + 70];
    // a measured bright plate under the title (MG.legible, display 3:1 on
    // top of what the soft scrim already gives): dark ink where it is
    // bright under every word (the scrim and drop shadow then stand down,
    // a tinted accent deepened in its hue), else a glyph scrim; a box only
    // past what that carries
    BKS.forEach(b => b.remove()); BKS = []; DARK = false;
    if (MG.plate && MG.luminance(P.color) >= 0.3) {
      const accEls = tinted ? words.filter(w => w.acc).map(w => w.el) : [];
      const res = MG.legible(MG.$$('.line', wrap).map(el => ({ el, ratio: 3, ink: P.color, base: P.shadow > 0 ? 0.15 : 0,
          acc: accEls.filter(a => el.contains(a)), accent: ACC.color, accRatio: heavy ? 3 : 4.5 })),
        { have: P.scrim > 0 ? 0.3 * 0.78 * P.scrim : 0, dark: P.treatment === 'none' || tinted,
          root: MG.$('.mg-root'), box: { pad: [0.22 * fs, 0.08 * fs], feather: 0.32 * fs, radius: 0.3 * fs } });
      if (res.mode === 'dark') { DARK = true; wrap.style.filter = 'none'; }
      res.boxes.forEach(b => { BKS.push(b); MG.growBox(b.box); });
    }
  };
  let BKS = [], DARK = false;
  layout();
  // Fonts load after this script runs: lay out again with real metrics before capture.
  MG.ready = Promise.all([`900 100px '${P.font}'`, `italic 400 100px 'Instrument Serif'`, `italic 800 100px 'Playfair Display'`]
    .map(f => document.fonts.load(f).catch(() => 0))).then(() => document.fonts.ready).then(layout);

  const D = MG.duration, each = P.entrance === 'pop' ? Math.min(0.025, 0.12 / Math.max(words.length, 1))
    : Math.min(0.075, 0.55 / Math.max(words.length, 1));
  const exitDur = P.exit === 'none' || P.exit === 'cut' ? 0 : Math.min(0.32, D * 0.18);
  const enterEnd = each * words.length + 0.7;
  MG.active([[0, Math.min(D, enterEnd)], [Math.max(0, D - exitDur - 0.02), D]]);
  MG.frame(t => {
    if (P.scrim > 0 || BKS.length) {
      const inA = MG.ease.outCubic(MG.range(t, 0, 0.35));
      const outA = exitDur > 0 ? 1 - MG.ease.inCubic(MG.range(t, D - exitDur, exitDur)) : 1;
      // dark ink never sits in a dark scrim
      if (P.scrim > 0) scrim.style.opacity = DARK ? 0 : (inA * outA).toFixed(4);
      BKS.forEach(bk => { bk.style.opacity = (inA * outA).toFixed(4); });
    }
    words.forEach((w, i) => {
      const t0 = i * each;
      let s = {};
      if (P.entrance === 'spring') {
        // near-critical spring: lands with a whisper of overshoot, no bounce
        const k = MG.spring(t, t0, { stiffness: 230, damping: 21 });
        s = { y: (1 - k) * 56, scale: 0.8 + 0.2 * k, opacity: MG.range(t, t0, 0.1), blur: Math.max(0, 1 - MG.range(t, t0, 0.24)) * 14 };
      } else if (P.entrance === 'slam') {
        const k = MG.spring(t, t0, { stiffness: 420, damping: 22 });
        s = { scale: 1 + (1 - k) * 1.6, opacity: MG.range(t, t0, 0.05), blur: (1 - MG.range(t, t0, 0.12)) * 10 };
      } else if (P.entrance === 'rise') {
        const p = MG.ease.outExpo(MG.range(t, t0, 0.6));
        s = { y: (1 - p) * 90, opacity: MG.range(t, t0, 0.25) };
      } else if (P.entrance === 'cut') {
        // whole on the first frame: the title IS the opening frame
        s = { opacity: 1 };
      } else if (P.entrance === 'pop') {
        // whole by ~0.25 s: the references' title is read by 0.3 s
        const p = MG.ease.outCubic(MG.range(t, t0, 0.14));
        s = { opacity: p, scale: 1.06 - 0.06 * p };
      } else if (P.entrance === 'blur') {
        const p = MG.ease.outCubic(MG.range(t, t0, 0.5));
        s = { opacity: p, blur: (1 - p) * 26, scale: 1.08 - 0.08 * p };
      } else { // mask: words rise from behind their own baseline
        const p = MG.ease.outQuart(MG.range(t, t0, 0.55));
        s = { y: (1 - p) * 1.1 * fs, opacity: p > 0 ? 1 : 0 };
        w.line.style.clipPath = 'inset(-20% -5% 0 -5%)';
      }
      if (w.acc && P.treatment === 'marker') {
        w.el.style.setProperty('--mk', MG.ease.outExpo(MG.range(t, t0 + 0.12, 0.45)).toFixed(4));
      }
      if (exitDur > 0 && t > D - exitDur) {
        const q = MG.ease.inCubic(MG.range(t, D - exitDur, exitDur));
        if (P.exit === 'blur') { s.opacity = (s.opacity ?? 1) * (1 - q); s.blur = (s.blur || 0) + q * 18; s.y = (s.y || 0) - q * 30; }
        else if (P.exit === 'drop') { s.y = (s.y || 0) + q * 120; s.opacity = (s.opacity ?? 1) * (1 - q); }
      }
      MG.set(w.el, s);
    });
  });
})();
</script>
