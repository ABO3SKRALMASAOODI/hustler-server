# Executor auto-deploy (round 97, #4).
#
# The render executor on Cloud Run does NOT redeploy itself — the dispatcher
# on Render does, on every push, and the halves drift. That skew has now
# broken production FOUR separate times (rounds 53, 55, 96, 97: the last one
# put three red "render is the wrong length" errors in front of one user in
# two minutes). This workflow removes the whole failure class: any push to
# main that touches worker/ rebuilds the executor from the same commit, then
# REFUSES to call it done until /health reports the checked-out tree's own
# code fingerprint.
#
# Setup (once): a GCP service account with run.admin +
# cloudbuild.builds.editor + storage.admin project roles, serviceAccountUser
# ON the runtime service account, and its JSON key in the GCP_SA_KEY repo
# secret — the exact commands are in worker/DEPLOY_EXECUTOR.md. Until the
# secret exists the deploy job SKIPS (visibly, not red) so the pipeline can
# ship ahead of its credentials.

name: deploy-executor

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "!worker/tests/**"
      - "!worker/**/*.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-executor
  # Only the newest pushed source matters. Queuing every intermediate commit
  # created paid revisions and duplicate dispatcher shutdowns for code nobody
  # would ever run.
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      have_key: ${{ steps.probe.outputs.have_key }}
    steps:
      - id: probe
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP_SA_KEY is not configured — executor NOT deployed. See worker/DEPLOY_EXECUTOR.md (CI section)."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.have_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: valmera

      - name: build stable dependency base when needed
        run: |
          wait_for_build() {
            build_id="$1"
            while true; do
              build_state=$(gcloud builds describe "$build_id" \
                --project valmera --format='value(status)')
              case "$build_state" in
                SUCCESS) return 0 ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                  echo "::error::Cloud Build $build_id ended $build_state"
                  return 1
                  ;;
              esac
              echo "Cloud Build $build_id: $build_state"
              sleep 10
            done
          }
          dep_hash=$(sha256sum worker/Dockerfile worker/requirements.txt \
            | sha256sum | cut -c1-16)
          base_image="us-central1-docker.pkg.dev/valmera/cloud-run-source-deploy/valmera-executor-base:deps-${dep_hash}"
          app_image="us-central1-docker.pkg.dev/valmera/cloud-run-source-deploy/valmera-executor-app:${GITHUB_SHA}"
          if ! gcloud artifacts docker images describe "$base_image" \
              --project valmera >/dev/null 2>&1; then
            base_build=$(gcloud builds submit worker/ \
              --config worker/cloudbuild.executor-base.yaml \
              --substitutions "_IMAGE=${base_image}" \
              --project valmera --quiet --async --format='value(id)')
            wait_for_build "$base_build"
          fi
          app_build=$(gcloud builds submit worker/ \
            --config worker/cloudbuild.executor.yaml \
            --substitutions "_BASE_IMAGE=${base_image},_IMAGE=${app_image}" \
            --project valmera --quiet --async --format='value(id)')
          wait_for_build "$app_build"
          echo "APP_IMAGE=$app_image" >> "$GITHUB_ENV"
          agent_dep_hash=$(sha256sum worker/Dockerfile.agent-base \
            worker/requirements.txt | sha256sum | cut -c1-16)
          agent_base="us-central1-docker.pkg.dev/valmera/cloud-run-source-deploy/valmera-agent-base:deps-${agent_dep_hash}"
          agent_image="us-central1-docker.pkg.dev/valmera/cloud-run-source-deploy/valmera-agent-app:${GITHUB_SHA}"
          if ! gcloud artifacts docker images describe "$agent_base" \
              --project valmera >/dev/null 2>&1; then
            agent_base_build=$(gcloud builds submit worker/ \
              --config worker/cloudbuild.agent-base.yaml \
              --substitutions "_IMAGE=${agent_base}" \
              --project valmera --quiet --async --format='value(id)')
            wait_for_build "$agent_base_build"
          fi
          agent_build=$(gcloud builds submit worker/ \
            --config worker/cloudbuild.agent.yaml \
            --substitutions "_BASE_IMAGE=${agent_base},_IMAGE=${agent_image}" \
            --project valmera --quiet --async --format='value(id)')
          wait_for_build "$agent_build"
          echo "AGENT_IMAGE=$agent_image" >> "$GITHUB_ENV"
          launcher_image="us-central1-docker.pkg.dev/valmera/cloud-run-source-deploy/valmera-batch-launcher:${GITHUB_SHA}"
          launcher_build=$(gcloud builds submit worker/batch_launcher/ \
            --tag "$launcher_image" --project valmera --quiet --async \
            --format='value(id)')
          wait_for_build "$launcher_build"
          echo "LAUNCHER_IMAGE=$launcher_image" >> "$GITHUB_ENV"

      - name: deploy request, agent, launcher, and batch executors
        run: |
          gcloud run deploy valmera-executor \
            --image "$APP_IMAGE" \
            --region us-central1 \
            --project valmera \
            --cpu 8 --memory 32Gi --concurrency 1 \
            --min-instances 0 --max-instances 5 --timeout 3600 \
            --execution-environment gen2 --no-cpu-boost \
            --quiet
          if gcloud run services describe valmera-executor-preview \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            gcloud run deploy valmera-executor-preview \
              --image "$APP_IMAGE" \
              --region us-central1 \
              --project valmera \
              --cpu 8 --memory 8Gi --concurrency 1 \
              --min-instances 0 --max-instances 5 --timeout 1800 \
              --execution-environment gen2 --no-cpu-boost \
              --quiet
          else
            echo "::warning::valmera-executor-preview is not bootstrapped; heavy fallback remains active"
          fi
          if gcloud run services describe valmera-executor-batch \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            gcloud run deploy valmera-executor-batch \
              --image "$APP_IMAGE" \
              --region us-central1 \
              --project valmera \
              --cpu 8 --memory 16Gi --concurrency 1 \
              --min-instances 0 --max-instances 5 --timeout 3600 \
              --execution-environment gen2 --no-cpu-boost \
              --quiet
          else
            echo "::warning::valmera-executor-batch is not bootstrapped; 32-GiB request fallback remains active"
          fi
          if gcloud run services describe valmera-agent \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            gcloud run deploy valmera-agent \
              --image "$AGENT_IMAGE" \
              --region us-central1 \
              --project valmera \
              --cpu 1 --memory 2Gi --concurrency 2 \
              --min-instances 0 --max-instances 3 --timeout 3600 \
              --execution-environment gen2 --cpu-boost --cpu-throttling \
              --quiet
          else
            echo "::warning::valmera-agent is not bootstrapped; Render keeps running agent turns locally"
          fi
          if gcloud run services describe valmera-batch-launcher \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            gcloud run deploy valmera-batch-launcher \
              --image "$LAUNCHER_IMAGE" \
              --region us-central1 --project valmera \
              --cpu 1 --memory 512Mi --concurrency 20 \
              --min-instances 0 --max-instances 2 --timeout 30 \
              --execution-environment gen2 --cpu-throttling \
              --allow-unauthenticated --quiet
          else
            echo "::warning::valmera-batch-launcher is not bootstrapped; request-service fallback remains active"
          fi
          if gcloud run jobs describe valmera-batch \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            gcloud run jobs update valmera-batch \
              --image "$APP_IMAGE" \
              --region us-central1 --project valmera \
              --cpu 8 --memory 16Gi --tasks 1 --parallelism 1 \
              --max-retries 0 --task-timeout 3600 \
              --command python --args batch_runner.py --quiet
          else
            echo "::warning::valmera-batch is not bootstrapped; request-service fallback remains active"
          fi

      - name: enforce bounded artifact retention
        run: |
          if gcloud artifacts repositories describe cloud-run-source-deploy \
              --location us-central1 --project valmera \
              --format='json(cleanupPolicies)' \
              | grep -q 'delete-older-than-2d'; then
            echo "Artifact cleanup policy is already active"
          elif ! gcloud artifacts repositories set-cleanup-policies \
              cloud-run-source-deploy \
              --location us-central1 --project valmera \
              --policy worker/artifact-cleanup-policy.json --quiet; then
            echo "::warning::Cleanup policy needs one-time Artifact Registry admin setup; deployment remains healthy"
          fi

      - name: verify the skew is gone
        run: |
          want=$(cd worker && python3 -c "import version; print(version.code_version())")
          got=$(curl -fsS --max-time 30 \
            https://valmera-executor-950454325677.us-central1.run.app/health \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['code_version'])")
          echo "checkout=$want deployed=$got"
          if [ "$want" != "$got" ]; then
            echo "::error::executor still reports $got, this commit is $want — the deploy did not take"
            exit 1
          fi
          curl -fsS --max-time 30 \
            https://valmera-executor-950454325677.us-central1.run.app/health \
            | python3 -c "import json,sys; h=json.load(sys.stdin); print('features:', h.get('features'))"
          if gcloud run services describe valmera-executor-preview \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            preview_url=$(gcloud run services describe valmera-executor-preview \
              --region us-central1 --project valmera --format='value(status.url)')
            preview_got=$(curl -fsS --max-time 30 "$preview_url/health" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['code_version'])")
            test "$want" = "$preview_got" || {
              echo "::error::preview executor reports $preview_got, expected $want"
              exit 1
            }
          fi
          if gcloud run services describe valmera-executor-batch \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            batch_url=$(gcloud run services describe valmera-executor-batch \
              --region us-central1 --project valmera --format='value(status.url)')
            batch_got=$(curl -fsS --max-time 30 "$batch_url/health" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['code_version'])")
            test "$want" = "$batch_got" || {
              echo "::error::batch request executor reports $batch_got, expected $want"
              exit 1
            }
          fi
          if gcloud run services describe valmera-agent \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            agent_url=$(gcloud run services describe valmera-agent \
              --region us-central1 --project valmera --format='value(status.url)')
            agent_got=$(curl -fsS --max-time 60 "$agent_url/health" \
              | python3 -c "import json,sys; h=json.load(sys.stdin); assert h.get('role') == 'agent_executor', h; print(h['code_version'])")
            test "$want" = "$agent_got" || {
              echo "::error::agent executor reports $agent_got, expected $want"
              exit 1
            }
          fi
          if gcloud run services describe valmera-batch-launcher \
              --region us-central1 --project valmera >/dev/null 2>&1; then
            launcher_url=$(gcloud run services describe valmera-batch-launcher \
              --region us-central1 --project valmera --format='value(status.url)')
            curl -fsS --max-time 30 "$launcher_url/health" \
              | python3 -c "import json,sys; h=json.load(sys.stdin); assert h.get('status') == 'ok', h; print('batch launcher:', h.get('job'))"
          fi
