name: deploy-cloudflare-executor

# Manual by design. Publishing the image does not route production traffic;
# Render's CLOUDFLARE_EXECUTOR_PERCENT is the separate, reversible canary gate.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare-executor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/cloudflare/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: validate required deployment secrets
        env:
          EXECUTOR_SECRET: ${{ secrets.REMOTE_EXECUTOR_SECRET }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXECUTOR_URL: ${{ secrets.CLOUDFLARE_EXECUTOR_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EXECUTOR_SECRET DATABASE_URL S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET OPENAI_API_KEY IMAGE_API_KEY MODAL_TOKEN_ID MODAL_TOKEN_SECRET EXECUTOR_URL; do
            test -n "${!name}" || { echo "::error::missing GitHub secret $name"; exit 1; }
          done

      - name: validate Python capabilities
        run: python worker/skill_validator.py

      - name: require durable provider ownership schema
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python -m pip install --disable-pip-version-check psycopg2-binary==2.9.10
          python worker/remote_ledger_check.py

      - name: install and type-check Worker adapter
        working-directory: worker/cloudflare
        run: npm ci && npm run check

      - name: publish Worker and Container images
        working-directory: worker/cloudflare
        run: |
          source_version=$(cd .. && python -c "import version; print(version.code_version())")
          npx wrangler deploy \
            --var CODE_VERSION:"$GITHUB_SHA" \
            --var SOURCE_VERSION:"$source_version"

      - name: install runtime secrets
        working-directory: worker/cloudflare
        env:
          EXECUTOR_SECRET: ${{ secrets.REMOTE_EXECUTOR_SECRET }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_BASE_URL: ${{ secrets.VISION_BASE_URL }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          IMAGE_GEN_MODEL: ${{ secrets.IMAGE_GEN_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          secret_file=$(mktemp /tmp/valmera-cloudflare-secrets.XXXXXX.json)
          trap 'rm -f "$secret_file"' EXIT
          jq -n \
            --arg EXECUTOR_SECRET "$EXECUTOR_SECRET" \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg S3_ENDPOINT "$S3_ENDPOINT" \
            --arg S3_ACCESS_KEY_ID "$S3_ACCESS_KEY_ID" \
            --arg S3_SECRET_ACCESS_KEY "$S3_SECRET_ACCESS_KEY" \
            --arg S3_BUCKET "$S3_BUCKET" \
            --arg S3_REGION "${S3_REGION:-auto}" \
            --arg OPENAI_API_KEY "$OPENAI_API_KEY" \
            --arg OPENAI_BASE_URL "${OPENAI_BASE_URL:-https://api.openai.com/v1}" \
            --arg VISION_API_KEY "$VISION_API_KEY" \
            --arg VISION_BASE_URL "$VISION_BASE_URL" \
            --arg VISION_MODEL "$VISION_MODEL" \
            --arg IMAGE_API_KEY "$IMAGE_API_KEY" \
            --arg IMAGE_BASE_URL "${IMAGE_BASE_URL:-https://api.x.ai/v1}" \
            --arg IMAGE_GEN_MODEL "${IMAGE_GEN_MODEL:-grok-imagine-image-quality}" \
            --arg FAL_KEY "$FAL_KEY" \
            --arg DEEPGRAM_API_KEY "$DEEPGRAM_API_KEY" \
            --arg PEXELS_API_KEY "$PEXELS_API_KEY" \
            --arg PIXABAY_API_KEY "$PIXABAY_API_KEY" \
            --arg MODAL_TOKEN_ID "$MODAL_TOKEN_ID" \
            --arg MODAL_TOKEN_SECRET "$MODAL_TOKEN_SECRET" \
            '{EXECUTOR_SECRET:$EXECUTOR_SECRET,DATABASE_URL:$DATABASE_URL,S3_ENDPOINT:$S3_ENDPOINT,S3_ACCESS_KEY_ID:$S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY:$S3_SECRET_ACCESS_KEY,S3_BUCKET:$S3_BUCKET,S3_REGION:$S3_REGION,OPENAI_API_KEY:$OPENAI_API_KEY,OPENAI_BASE_URL:$OPENAI_BASE_URL,VISION_API_KEY:$VISION_API_KEY,VISION_BASE_URL:$VISION_BASE_URL,VISION_MODEL:$VISION_MODEL,IMAGE_API_KEY:$IMAGE_API_KEY,IMAGE_BASE_URL:$IMAGE_BASE_URL,IMAGE_GEN_MODEL:$IMAGE_GEN_MODEL,FAL_KEY:$FAL_KEY,DEEPGRAM_API_KEY:$DEEPGRAM_API_KEY,PEXELS_API_KEY:$PEXELS_API_KEY,PIXABAY_API_KEY:$PIXABAY_API_KEY,MODAL_TOKEN_ID:$MODAL_TOKEN_ID,MODAL_TOKEN_SECRET:$MODAL_TOKEN_SECRET,MODAL_EXECUTOR_APP:"valmera-executor",MODAL_EXECUTOR_ENVIRONMENT:"main"} | with_entries(select(.value != ""))' \
            > "$secret_file"
          npx wrangler secret bulk "$secret_file"

      - name: verify provider identity and code
        env:
          EXECUTOR_URL: ${{ secrets.CLOUDFLARE_EXECUTOR_URL }}
          EXECUTOR_SECRET: ${{ secrets.REMOTE_EXECUTOR_SECRET }}
        run: |
          want_source=$(cd worker && python -c "import version; print(version.code_version())")
          # A secret change publishes a second Worker version immediately
          # after the image upload. workers.dev can briefly serve 404 while
          # that version propagates, so verify the immutable identity with a
          # bounded poll instead of turning a healthy deploy red once.
          ready=0
          for attempt in $(seq 1 36); do
            report=$(curl --silent --show-error \
              -H "Authorization: Bearer $EXECUTOR_SECRET" \
              "$EXECUTOR_URL/health" || true)
            if test "$(jq -r .provider <<<"${report:-{}}")" = cloudflare \
                && test "$(jq -r .code_version <<<"${report:-{}}")" = "$GITHUB_SHA" \
                && test "$(jq -r .source_version <<<"${report:-{}}")" = "$want_source"; then
              echo "Cloudflare executor code=$GITHUB_SHA source=$want_source provider=cloudflare"
              ready=1
              break
            fi
            echo "Cloudflare health propagation attempt $attempt/36 pending"
            sleep 5
          done
          if test "$ready" != 1; then
            echo "::error::Cloudflare health did not converge to code=$GITHUB_SHA source=$want_source"
            exit 1
          fi

          # Starting each isolated lane proves that the image, secrets,
          # Python entry point, source fingerprint, and role-specific runner
          # all agree before Render is allowed to route customer work here.
          for spec in interactive:executor batch:executor agent:agent_executor mcp:mcp_executor shorts:shorts_executor; do
            lane=${spec%%:*}
            role=${spec#*:}
            probe=$(curl --silent --show-error --fail --max-time 300 \
              --retry 2 --retry-all-errors \
              -H "Authorization: Bearer $EXECUTOR_SECRET" \
              "$EXECUTOR_URL/probes/$lane")
            test "$(jq -r .status <<<"$probe")" = ok \
              && test "$(jq -r .role <<<"$probe")" = "$role" \
              && test "$(jq -r .code_version <<<"$probe")" = "$want_source" \
              || { echo "::error::Cloudflare $lane container probe failed"; exit 1; }
            echo "Cloudflare lane=$lane role=$role source=$want_source ready"
          done
