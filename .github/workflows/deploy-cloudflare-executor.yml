name: deploy-cloudflare-executor

# Keep the primary executor in lockstep with the dispatcher. Publishing does not
# interrupt in-flight work; provider ownership is fenced in PostgreSQL and the
# staged-rollout verifier waits for every Cloudflare lane to serve this source.
# A cancelled run leaves Cloudflare behind the dispatcher; touching this file
# re-runs the same pipeline without changing worker source.
on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "backend/migrations/025_remote_executions.sql"
      - ".github/workflows/deploy-cloudflare-executor.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare-executor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 23 Oct 2026: the runner's Ubuntu mirror served the apt step for ~50
    # minutes (normally ~2), and run #144 (50a57450) was cancelled at the
    # 90-minute ceiling with its tests at 78%. The suite alone is ~25 min and
    # publish + verify ~15, so a slow mirror must not cost the release.
    timeout-minutes: 150
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/cloudflare/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: validate required deployment secrets
        env:
          EXECUTOR_SECRET: ${{ secrets.REMOTE_EXECUTOR_SECRET }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          EXECUTOR_URL: ${{ secrets.CLOUDFLARE_EXECUTOR_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EXECUTOR_SECRET DATABASE_URL S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET OPENAI_API_KEY IMAGE_API_KEY EXECUTOR_URL; do
            test -n "${!name}" || { echo "::error::missing GitHub secret $name"; exit 1; }
          done

      - name: install and test Python capabilities
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-dejavu-core fonts-noto-core fonts-noto-cjk
          # Test against the ffmpeg the executor images ship
          # (worker/Dockerfile.cloudflare FFMPEG_STATIC), not Ubuntu's older
          # package: colour-matrix handling and filter options differ between
          # 6.x and 8.x, so a 6.x run tests a renderer production never runs.
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          sudo install -m755 /tmp/ffmpeg-*/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m755 /tmp/ffmpeg-*/bin/ffprobe /usr/local/bin/ffprobe
          rm -rf /tmp/ff.tar.xz /tmp/ffmpeg-*
          ffmpeg -version | head -1
          python backend/scripts/scan_tracked_secrets.py
          python backend/scripts/security_release_preflight.py --database-only
          python -m pip install --disable-pip-version-check \
            -r worker/requirements.txt pytest pip-audit==2.9.0
          # Motion-engine tests render real frames; without a browser they
          # skip, so a failed install degrades coverage instead of blocking.
          python -m playwright install --with-deps --only-shell chromium \
            || echo "::warning::Chromium unavailable; motion render tests will skip"
          python -m pip_audit -r worker/requirements.txt \
            --progress-spinner off
          python -m compileall -q worker
          python worker/skill_validator.py
          # Production credentials are needed by the schema preflight above,
          # never by unit/media tests or provider-health lookups inside them.
          SKIP_DB_INIT=1 DATABASE_URL=postgresql://stub/stub PYTHONPATH=worker \
            python -m pytest -q worker/tests

      - name: verify Advanced model tool calling and cache reuse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python backend/scripts/probe_advanced_model.py

      - name: require durable provider ownership schema
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python -m pip install --disable-pip-version-check psycopg2-binary==2.9.10
          python worker/remote_ledger_check.py

      - name: install and type-check Worker adapter
        working-directory: worker/cloudflare
        run: |
          python ../../backend/scripts/audit_npm_lock.py package-lock.json
          npm ci
          npm run check

      # R3 (25 Oct 2026): at most two executor releases a day. A run with a
      # newer main already waiting behind it skips its publish (the waiting
      # run releases both); a third release in 24 h is a loud warning; a
      # release waits up to 15 min for no customer job to be running.
      # worker/cloudflare/release_budget.py explains why it never blocks.
      - name: executor release budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          # read-only: waits for a moment with no customer job running
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python worker/cloudflare/release_budget.py

      - name: publish Worker and Container images
        if: steps.budget.outputs.release == 'true'
        working-directory: worker/cloudflare
        env:
          # The ValmeraVision lane is DARK (worker/devices/INTERFACES.md §2.6):
          # its overlay is merged only when the owner sets this repository
          # variable to '1'. Unset, the deployed config is wrangler.jsonc.
          VALMERA_VISION_LANE: ${{ vars.VALMERA_VISION_LANE }}
        run: |
          source_version=$(cd .. && python -c "import version; print(version.code_version())")
          export SOURCE_VERSION="$source_version"
          node <<'NODE'
          const fs = require("fs");
          const path = "wrangler.jsonc";
          let config = JSON.parse(fs.readFileSync(path, "utf8"));
          if (process.env.VALMERA_VISION_LANE === "1") {
            config = require("./vision-overlay.cjs").mergeVisionOverlay(config);
            console.log("VALMERA_VISION_LANE=1: deploying the ValmeraVision overlay");
          }
          for (const container of config.containers) {
            container.image_vars = {
              ...(container.image_vars || {}),
              SOURCE_VERSION: process.env.SOURCE_VERSION,
            };
          }
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          # Container updates can partially apply before Cloudflare returns
          # an internal error. Reapplying this same revision is idempotent.
          # Retry only that transient provider failure; keep all other errors loud.
          # GitHub's default run shell uses bash -e, without pipefail. Keep
          # Wrangler's exit status when tee successfully writes its log.
          set -o pipefail
          deploy_log=$(mktemp)
          trap 'rm -f "$deploy_log"' EXIT
          # A container application whose previous rollout is still replacing
          # active instances (rollout_active_grace_period) can refuse a new
          # rollout; the old release keeps serving safely meanwhile (skew
          # guard), so wait it out instead of failing the release.
          for attempt in 1 2 3 4 5 6 7 8; do
            if npx wrangler deploy \
                --var CODE_VERSION:"$GITHUB_SHA" \
                --var SOURCE_VERSION:"$source_version" 2>&1 | tee "$deploy_log"; then
              break
            fi
            if test "$attempt" = 8; then
              exit 1
            fi
            if grep -Fq "Internal Server Error" "$deploy_log"; then
              echo "Cloudflare returned an internal error; retrying this revision ($attempt/8)."
              sleep 30
            elif grep -Eiq "rolling out application|rollout" "$deploy_log"; then
              echo "A container rollout is still in progress; retrying this revision in 120 s ($attempt/8)."
              sleep 120
            elif grep -Eiq "429 Too Many Requests|toomanyrequests|rate limit" "$deploy_log"; then
              # The base-image registry throttles anonymous pulls (run 107:
              # public.ecr.aws "Data limit exceeded" 4 s into the build);
              # nothing was published, so the same revision is retried. The
              # throttle can outlast every retry on one registry (run 116,
              # twice: eight attempts over 11 min, all "Data limit
              # exceeded"), so each retry alternates the base image between
              # ECR Public and Google's Docker Hub mirror, which serve the
              # same official image (python:3.11-slim-bookworm resolves to
              # one digest on both). Only this checkout's Dockerfiles change.
              if grep -q "^FROM public.ecr.aws/docker/library/" ../Dockerfile.cloudflare; then
                from="public.ecr.aws/docker/library/"; to="mirror.gcr.io/library/"
              else
                from="mirror.gcr.io/library/"; to="public.ecr.aws/docker/library/"
              fi
              for dockerfile in ../Dockerfile.cloudflare ../Dockerfile.agent-base ../Dockerfile.vision; do
                sed -i "s#^FROM ${from}#FROM ${to}#" "$dockerfile"
              done
              echo "The image registry throttled a base-image pull; retrying this revision from ${to} in 30 s ($attempt/8)."
              sleep 30
            else
              exit 1
            fi
          done

      - name: install runtime secrets
        if: steps.budget.outputs.release == 'true'
        working-directory: worker/cloudflare
        env:
          EXECUTOR_SECRET: ${{ secrets.REMOTE_EXECUTOR_SECRET }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_NEXT_ENDPOINT: ${{ secrets.S3_NEXT_ENDPOINT }}
          S3_NEXT_ACCESS_KEY_ID: ${{ secrets.S3_NEXT_ACCESS_KEY_ID }}
          S3_NEXT_SECRET_ACCESS_KEY: ${{ secrets.S3_NEXT_SECRET_ACCESS_KEY }}
          S3_NEXT_BUCKET: ${{ secrets.S3_NEXT_BUCKET }}
          S3_NEXT_REGION: ${{ secrets.S3_NEXT_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_BASE_URL: ${{ secrets.VISION_BASE_URL }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          IMAGE_GEN_MODEL: ${{ secrets.IMAGE_GEN_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          EXECUTOR_URL: ${{ secrets.CLOUDFLARE_EXECUTOR_URL }}
        run: |
          secret_file=$(mktemp /tmp/valmera-cloudflare-secrets.XXXXXX.json)
          trap 'rm -f "$secret_file"' EXIT
          jq -n \
            --arg EXECUTOR_SECRET "$EXECUTOR_SECRET" \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg S3_ENDPOINT "$S3_ENDPOINT" \
            --arg S3_ACCESS_KEY_ID "$S3_ACCESS_KEY_ID" \
            --arg S3_SECRET_ACCESS_KEY "$S3_SECRET_ACCESS_KEY" \
            --arg S3_BUCKET "$S3_BUCKET" \
            --arg S3_REGION "${S3_REGION:-auto}" \
            --arg S3_NEXT_ENDPOINT "$S3_NEXT_ENDPOINT" \
            --arg S3_NEXT_ACCESS_KEY_ID "$S3_NEXT_ACCESS_KEY_ID" \
            --arg S3_NEXT_SECRET_ACCESS_KEY "$S3_NEXT_SECRET_ACCESS_KEY" \
            --arg S3_NEXT_BUCKET "$S3_NEXT_BUCKET" \
            --arg S3_NEXT_REGION "$S3_NEXT_REGION" \
            --arg OPENAI_API_KEY "$OPENAI_API_KEY" \
            --arg OPENAI_BASE_URL "${OPENAI_BASE_URL:-https://api.openai.com/v1}" \
            --arg VISION_API_KEY "$VISION_API_KEY" \
            --arg VISION_BASE_URL "$VISION_BASE_URL" \
            --arg VISION_MODEL "$VISION_MODEL" \
            --arg IMAGE_API_KEY "$IMAGE_API_KEY" \
            --arg IMAGE_BASE_URL "${IMAGE_BASE_URL:-https://api.x.ai/v1}" \
            --arg IMAGE_GEN_MODEL "${IMAGE_GEN_MODEL:-grok-imagine-image-quality}" \
            --arg FAL_KEY "$FAL_KEY" \
            --arg ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" \
            --arg DEEPGRAM_API_KEY "$DEEPGRAM_API_KEY" \
            --arg PEXELS_API_KEY "$PEXELS_API_KEY" \
            --arg PIXABAY_API_KEY "$PIXABAY_API_KEY" \
            --arg CLOUDFLARE_EXECUTOR_URL "$EXECUTOR_URL" \
            '{EXECUTOR_SECRET:$EXECUTOR_SECRET,DATABASE_URL:$DATABASE_URL,S3_ENDPOINT:$S3_ENDPOINT,S3_ACCESS_KEY_ID:$S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY:$S3_SECRET_ACCESS_KEY,S3_BUCKET:$S3_BUCKET,S3_REGION:$S3_REGION,S3_NEXT_ENDPOINT:$S3_NEXT_ENDPOINT,S3_NEXT_ACCESS_KEY_ID:$S3_NEXT_ACCESS_KEY_ID,S3_NEXT_SECRET_ACCESS_KEY:$S3_NEXT_SECRET_ACCESS_KEY,S3_NEXT_BUCKET:$S3_NEXT_BUCKET,S3_NEXT_REGION:$S3_NEXT_REGION,OPENAI_API_KEY:$OPENAI_API_KEY,OPENAI_BASE_URL:$OPENAI_BASE_URL,VISION_API_KEY:$VISION_API_KEY,VISION_BASE_URL:$VISION_BASE_URL,VISION_MODEL:$VISION_MODEL,IMAGE_API_KEY:$IMAGE_API_KEY,IMAGE_BASE_URL:$IMAGE_BASE_URL,IMAGE_GEN_MODEL:$IMAGE_GEN_MODEL,FAL_KEY:$FAL_KEY,ANTHROPIC_API_KEY:$ANTHROPIC_API_KEY,DEEPGRAM_API_KEY:$DEEPGRAM_API_KEY,PEXELS_API_KEY:$PEXELS_API_KEY,PIXABAY_API_KEY:$PIXABAY_API_KEY,CLOUDFLARE_EXECUTOR_URL:$CLOUDFLARE_EXECUTOR_URL,MODAL_TOKEN_ID:null,MODAL_TOKEN_SECRET:null,MODAL_EXECUTOR_APP:null,MODAL_EXECUTOR_ENVIRONMENT:null} | with_entries(select(.value == null or .value != ""))' \
            > "$secret_file"
          npx wrangler secret bulk "$secret_file"

      - name: verify provider identity and code
        if: steps.budget.outputs.release == 'true'
        env:
          EXECUTOR_URL: ${{ secrets.CLOUDFLARE_EXECUTOR_URL }}
          EXECUTOR_SECRET: ${{ secrets.REMOTE_EXECUTOR_SECRET }}
        run: |
          want_source=$(cd worker && python -c "import version; print(version.code_version())")
          # A secret change publishes a second Worker version immediately
          # after the image upload. workers.dev can briefly serve 404 while
          # that version propagates, so verify the immutable identity with a
          # bounded poll instead of turning a healthy deploy red once.
          ready=0
          for attempt in $(seq 1 36); do
            report=$(curl --silent --show-error \
              -H "Authorization: Bearer $EXECUTOR_SECRET" \
              "$EXECUTOR_URL/health" || true)
            provider=$(jq -r '.provider // empty' <<<"$report" 2>/dev/null || true)
            code_version=$(jq -r '.code_version // empty' <<<"$report" 2>/dev/null || true)
            source_version=$(jq -r '.source_version // empty' <<<"$report" 2>/dev/null || true)
            if test "$provider" = cloudflare \
                && test "$code_version" = "$GITHUB_SHA" \
                && test "$source_version" = "$want_source"; then
              echo "Cloudflare executor code=$GITHUB_SHA source=$want_source provider=cloudflare"
              ready=1
              break
            fi
            echo "Cloudflare health propagation attempt $attempt/36 pending"
            sleep 5
          done
          if test "$ready" != 1; then
            echo "::error::Cloudflare health did not converge to code=$GITHUB_SHA source=$want_source"
            exit 1
          fi

          # Container rollouts intentionally preserve active instances for a
          # five-minute grace period. Probe more slowly than sleepAfter so an
          # old deployment-probe container can stop and the rollout can reach
          # 100%; three immediate curl retries only proved the old image three
          # times and made healthy staged deploys fail red.
          probe_file=$(mktemp /tmp/valmera-cloudflare-probe.XXXXXX.json)
          trap 'rm -f "$probe_file"' EXIT
          for spec in interactive:executor batch:executor agent:agent_executor mcp:mcp_executor shorts:shorts_executor; do
            lane=${spec%%:*}
            role=${spec#*:}
            lane_ready=0
            for attempt in $(seq 1 8); do
              http_code=$(curl --silent --show-error --max-time 300 \
                --output "$probe_file" --write-out '%{http_code}' \
                -H "Authorization: Bearer $EXECUTOR_SECRET" \
                "$EXECUTOR_URL/probes/$lane" || true)
              probe=$(cat "$probe_file")
              probe_status=$(jq -r '.status // empty' <<<"$probe" 2>/dev/null || true)
              probe_role=$(jq -r '.role // empty' <<<"$probe" 2>/dev/null || true)
              probe_source=$(jq -r '.code_version // empty' <<<"$probe" 2>/dev/null || true)
              if test "$http_code" = 200 \
                  && test "$probe_status" = ok \
                  && test "$probe_role" = "$role" \
                  && test "$probe_source" = "$want_source"; then
                echo "Cloudflare lane=$lane role=$role source=$want_source ready"
                lane_ready=1
                break
              fi
              echo "Cloudflare lane=$lane rollout attempt $attempt/8 pending http=$http_code role=${probe_role:-unknown} source=${probe_source:-unknown}"
              test "$attempt" = 8 || sleep 75
            done
            test "$lane_ready" = 1 \
              || { echo "::error::Cloudflare $lane container probe did not converge"; exit 1; }
          done
