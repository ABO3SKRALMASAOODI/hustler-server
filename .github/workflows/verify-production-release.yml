name: verify-production-release

# Render deploys main asynchronously. A green push is not proof that production
# is serving it, so keep a commit status pending until /healthz reports the
# exact source revision. Cloudflare has its own stricter staged-rollout gate.
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "worker/**"
      - "start.sh"
      - "requirements.txt"
      - ".github/workflows/verify-production-release.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-production-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valmera
          POSTGRES_PASSWORD: valmera
          POSTGRES_DB: valmera_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valmera -d valmera_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Mark production verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=render-production \
            -f description='Waiting for this exact commit on Render'

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify backend behavior before certifying Render
        env:
          DATABASE_URL: postgresql://stub/stub
        run: |
          python backend/scripts/scan_tracked_secrets.py
          python -m pip install --disable-pip-version-check \
            -r backend/requirements.txt pytest pip-audit==2.9.0
          python -m pip_audit -r backend/requirements.txt -r requirements.txt \
            --progress-spinner off
          python -m compileall -q backend worker
          PYTHONPATH=backend python -m pytest -q backend/tests

      - name: Verify migrations from empty database and ledger replay
        env:
          DATABASE_URL: postgresql://valmera:valmera@localhost:5432/valmera_migration_test
        run: |
          python backend/apply_migrations.py
          python backend/apply_migrations.py
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg2

          expected = len(list(Path("backend/migrations").glob("*.sql")))
          required = (
              "users", "projects", "assets", "indexes", "edls",
              "video_jobs", "payments", "client_events",
              "remote_executions", "mcp_tokens", "mcp_oauth_clients",
              "mcp_oauth_tokens", "mcp_catalog",
          )
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(*) FROM schema_migrations")
                  applied = cur.fetchone()[0]
                  cur.execute(
                      "SELECT " + ", ".join(
                          "to_regclass(%s)" for _ in required),
                      tuple("public." + name for name in required),
                  )
                  relations = cur.fetchone()
          finally:
              conn.close()
          assert applied == expected, (applied, expected)
          assert all(relation is not None for relation in relations), relations
          print(f"verified {applied} migrations and {len(required)} relations")
          PY

      - name: Confirm this exact commit is healthy on Render
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:12}"
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$headers_file" "$body_file"' EXIT
          for attempt in $(seq 1 90); do
            # Keep a 503 JSON body: it names the missing non-secret health
            # check and is more actionable than treating it as no response.
            : > "$headers_file"
            : > "$body_file"
            curl --silent --show-error --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --dump-header "$headers_file" \
              --output "$body_file" \
              https://entrepreneur-bot-backend.onrender.com/healthz || true
            response="$(<"$body_file")"
            cache_control="$(awk 'BEGIN { IGNORECASE=1 } /^cache-control:/ { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$headers_file")"
            if RESPONSE="$response" EXPECTED="$expected" \
              CACHE_CONTROL="$cache_control" python - <<'PY'
          import json
          import os
          import sys

          try:
              payload = json.loads(os.environ.get("RESPONSE") or "{}")
          except Exception:
              sys.exit(1)
          expected = os.environ["EXPECTED"]
          healthy = (
              payload.get("status") == "ok"
              and payload.get("role") == "backend"
              and str(payload.get("commit") or "").startswith(expected)
              and "no-store" in os.environ.get("CACHE_CONTROL", "").lower()
          )
          print(json.dumps(payload, sort_keys=True))
          sys.exit(0 if healthy else 1)
          PY
            then
              exit 0
            fi
            echo "Render has not published ${expected} yet (${attempt}/90)"
            sleep 10
          done
          echo "::error::Render did not report healthy commit ${expected}" >&2
          exit 1

      - name: Certify public MCP discovery and authentication
        run: |
          python backend/scripts/verify_public_mcp.py \
            --base-url https://entrepreneur-bot-backend.onrender.com

      - name: Mark production verified
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=render-production \
            -f description='This exact commit is healthy on Render'

      - name: Mark production verification failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=render-production \
            -f description='Tests failed or Render did not publish this commit'
