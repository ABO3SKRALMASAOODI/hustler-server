name: refbench-nightly

# Wave 0 track 0D. The CI-safe slice of refbench, every night:
#   - qa_metrics on synthetic inputs (every pinned metric),
#   - refsig detectors on a synthetic reel with known events,
#   - refbench plumbing: every case spec validates, vfl.json is well formed,
#     judge prompts, verdict JSON, AT-0D-2 scoring, label store round trip,
#     the fixture clock, ink from clips, the fixture catalogue reader.
# It never deploys, publishes, uploads, or touches footage or references:
# those live on the owner's machine and the local-only tests skip here.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refbench-nightly
  cancel-in-progress: true

jobs:
  refbench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: install ffmpeg 8.1 (the executor pin) and Python deps
        run: |
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          sudo install -m755 /tmp/ffmpeg-*/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m755 /tmp/ffmpeg-*/bin/ffprobe /usr/local/bin/ffprobe
          rm -rf /tmp/ff.tar.xz /tmp/ffmpeg-*
          ffmpeg -version | head -1
          python -m pip install --disable-pip-version-check \
            -r worker/requirements.txt pytest PyYAML==6.0.3

      - name: refbench case specs validate
        working-directory: worker
        env:
          SKIP_DB_INIT: "1"
          DATABASE_URL: postgresql://stub/stub
        run: python -m benchmarks.refbench validate

      - name: refbench, metrics and detector tests (CI-safe slice)
        env:
          SKIP_DB_INIT: "1"
          DATABASE_URL: postgresql://stub/stub
          PYTHONPATH: worker
        run: |
          python -m pytest -q worker/tests/test_w0d_qa_metrics.py \
            worker/tests/test_w0d_refsig.py worker/tests/test_w0d_refbench.py \
            worker/tests/test_w0d_tools.py worker/tests/test_w0d_review.py \
            worker/tests/test_w0d_local.py
