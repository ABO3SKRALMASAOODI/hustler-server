name: Verify backend production hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-backend-production.yml

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=render-production \
            -f description='Testing the gate fix and checking the live Render commit'

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run focused backend regression tests
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest Flask
          PYTHONPATH=backend pytest -q backend/tests/test_subscription_gate_hotfix.py
          python -m compileall -q backend/app.py backend/routes/video.py backend/subscription_gate_hotfix.py

      - name: Confirm this exact commit is serving on Render
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:12}"
          for attempt in $(seq 1 90); do
            response="$(curl --fail --silent --show-error --max-time 30 \
              https://entrepreneur-bot-backend.onrender.com/healthz || true)"
            if RESPONSE="$response" EXPECTED="$expected" python - <<'PY'
          import json, os, sys
          try:
              payload = json.loads(os.environ.get('RESPONSE') or '{}')
          except Exception:
              sys.exit(1)
          expected = os.environ['EXPECTED']
          good = (
              payload.get('status') == 'ok'
              and payload.get('role') == 'backend'
              and str(payload.get('commit') or '').startswith(expected)
          )
          if good:
              print(json.dumps(payload, sort_keys=True))
              sys.exit(0)
          print(json.dumps(payload, sort_keys=True))
          sys.exit(1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "Render did not report commit $expected" >&2
          exit 1

      - name: Mark production verified
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=render-production \
            -f description='Regression tests passed and this commit is live on Render'

      - name: Mark production verification failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=render-production \
            -f description='Tests failed or Render is not serving this commit'
