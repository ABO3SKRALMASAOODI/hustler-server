name: Apply subscription gate hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hotfix-subscription-gate.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch backend and regression test
        shell: python
        run: |
          from pathlib import Path

          route_path = Path("backend/routes/video.py")
          route = route_path.read_text(encoding="utf-8")
          old_route = '''        # pass because they are subscribed.
          if _subscribe_gate_applies(cur, user_id):
              record_client_event'''
          new_route = '''        # pass because they are subscribed. Empty projects stay on the
          # pre-upload concierge path so a greeting can still answer with the
          # instruction to drop a video; the wall begins once media exists.
          if original and _subscribe_gate_applies(cur, user_id):
              record_client_event'''
          if route.count(old_route) != 1:
              raise SystemExit("subscription gate anchor changed; refusing an unsafe patch")
          route_path.write_text(route.replace(old_route, new_route, 1), encoding="utf-8")

          test_path = Path("backend/tests/test_subscribe_gate.py")
          tests = test_path.read_text(encoding="utf-8")
          old_doc = '''"""Unsubscribed accounts see subscription cards on the first send.

          There is no free first edit. Active trials pass because they are subscribed.
          """'''
          new_doc = '''"""Unsubscribed accounts see subscription cards once source media exists.

          Empty-project concierge chat remains available. There is no free edit after
          upload. Active trials pass because they are subscribed.
          """'''
          if old_doc not in tests:
              raise SystemExit("subscribe-gate test docstring anchor changed")
          tests = tests.replace(old_doc, new_doc, 1)
          anchor = "\ndef test_unsubscribed_user_is_gated_immediately():\n"
          regression = '''
          def test_preupload_concierge_is_not_subscription_gated():
              source = inspect.getsource(video.post_message)
              assert "if original and _subscribe_gate_applies(cur, user_id):" in source


          def test_unsubscribed_user_is_gated_immediately():
          '''
          if anchor not in tests:
              raise SystemExit("subscribe-gate test insertion anchor changed")
          tests = tests.replace(anchor, "\n" + regression, 1)
          test_path.write_text(tests, encoding="utf-8")

          compile(route_path.read_text(encoding="utf-8"), str(route_path), "exec")
          compile(test_path.read_text(encoding="utf-8"), str(test_path), "exec")

          workflow = Path(".github/workflows/hotfix-subscription-gate.yml")
          workflow.unlink()

      - name: Commit the verified hotfix
        run: |
          git config user.name "Valmera Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/routes/video.py backend/tests/test_subscribe_gate.py .github/workflows/hotfix-subscription-gate.yml
          git diff --cached --check
          git commit -m "Fix pre-upload concierge subscription gate"
          git pull --rebase origin main
          git push origin HEAD:main
