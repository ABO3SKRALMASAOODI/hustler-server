name: deploy-modal-executor

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "!worker/tests/**"
      - "!worker/MODAL_EXECUTOR.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-modal-executor
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.token.outputs.configured }}
    steps:
      - id: token
        env:
          ID: ${{ secrets.MODAL_TOKEN_ID }}
          SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -n "$ID" ] && [ -n "$SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Modal deploy token is not configured; executor was not deployed"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
    steps:
      - uses: actions/checkout@v4

      - name: coalesce rapid worker pushes
        if: github.event_name == 'push'
        run: |
          sleep 120
          git fetch origin main
          pushed_tree=$(git rev-parse "$GITHUB_SHA:worker")
          latest_tree=$(git rev-parse "origin/main:worker")
          if [ "$pushed_tree" != "$latest_tree" ]; then
            echo "A newer worker tree is already queued; skipping this intermediate deploy."
            echo "skip_deploy=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.skip_deploy != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: install Modal CLI
        if: env.skip_deploy != 'true'
        run: pip install "modal==1.5.4" "psycopg2-binary==2.9.10"

      - name: require durable provider ownership schema
        if: env.skip_deploy != 'true'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python worker/remote_ledger_check.py

      - name: validate model-visible skills and capabilities
        if: env.skip_deploy != 'true'
        run: python worker/skill_validator.py

      - name: deploy executor functions
        if: env.skip_deploy != 'true'
        run: modal deploy worker/modal_app.py --env main --tag "$GITHUB_SHA"

      - name: verify deployed code and provider
        if: env.skip_deploy != 'true'
        run: |
          want=$(cd worker && python -c "import version; print(version.code_version())")
          want_adapter=$(python - <<'PY'
          import hashlib
          print(hashlib.sha256(open("worker/modal_app.py", "rb").read()).hexdigest()[:12])
          PY
          )
          got=""
          got_adapter=""
          # A successful deploy can take a few seconds to replace the Function
          # handle returned by from_name(). Poll the reported fingerprint so a
          # healthy rollout is not marked failed merely because verification
          # raced Modal's control-plane propagation.
          for attempt in {1..12}; do
            read -r got got_adapter < <(python - <<'PY'
          import modal
          health = modal.Function.from_name(
              "valmera-executor", "health", environment_name="main").remote()
          assert health.get("provider") == "modal", health
          print(health["code_version"], health["adapter_version"])
          PY
            )
            if [ "$want" = "$got" ] && [ "$want_adapter" = "$got_adapter" ]; then
              break
            fi
            echo "Waiting for Modal deployment propagation ($attempt/12): code=$got adapter=$got_adapter"
            sleep 5
          done
          test "$want" = "$got" || {
            echo "::error::Modal executor reports $got, expected $want"
            exit 1
          }
          test "$want_adapter" = "$got_adapter" || {
            echo "::error::Modal adapter reports $got_adapter, expected $want_adapter"
            exit 1
          }
          echo "Modal executor code=$got adapter=$got_adapter provider=modal"

      - name: probe complete redesign fleet
        if: env.skip_deploy != 'true'
        run: |
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import modal
          import subprocess
          import time

          want_code = subprocess.check_output(
              ["python", "-c", "import sys; sys.path.insert(0, 'worker'); "
               "import version; print(version.code_version())"],
              text=True).strip()
          want_adapter = hashlib.sha256(
              open("worker/modal_app.py", "rb").read()).hexdigest()[:12]
          expected = {
              "preview": ("preview", {"preview", "preview_check"}),
              "batch": ("batch", {"index", "final"}),
              "final": ("final", {"final"}),
              "index": ("index", {"index"}),
              "light": ("light", {"frames"}),
              "heavy": ("heavy", {"capture", "track", "matte", "clean", "stems"}),
              "egress": ("egress", {"fetch", "search", "stock_acquire"}),
              "agent": ("agent", {"agent_turn"}),
              "mcp": ("mcp", {"mcp_tool"}),
              "shorts": ("shorts", {"shorts_plan"}),
          }

          def warm(name):
              # Modal updates function handles independently.  A newly
              # deployed health function can therefore be visible a few
              # seconds before a warm orchestration lane.  Require the exact
              # release everywhere, but poll that propagation instead of
              # failing a healthy rollout on one old container.
              report = {}
              for attempt in range(12):
                  result = modal.Function.from_name(
                      "valmera-executor", name,
                      environment_name="main").remote({"type": "__warm"})
                  report = (result or {}).get("result") or {}
                  if (report.get("warmed") is True
                          and report.get("code_version") == want_code
                          and report.get("adapter_version") == want_adapter):
                      return name, report
                  if attempt < 11:
                      time.sleep(5)
              return name, report

          reports = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              futures = [pool.submit(warm, name) for name in expected]
              for future in concurrent.futures.as_completed(futures):
                  name, report = future.result()
                  reports[name] = report

          for name, (profile, required_runners) in expected.items():
              report = reports[name]
              assert report.get("warmed") is True, (name, report)
              assert report.get("profile") == profile, (name, report)
              assert report.get("code_version") == want_code, (name, report)
              assert report.get("adapter_version") == want_adapter, (name, report)
              runners = set(report.get("runners") or [])
              assert required_runners <= runners, (name, required_runners, runners)
              if name in {"agent", "mcp", "shorts"}:
                  assert runners == required_runners, (name, runners)
          print(json.dumps({name: {
              "profile": reports[name].get("profile"),
              "role": reports[name].get("role"),
              "runners": reports[name].get("runners"),
          } for name in sorted(reports)}, sort_keys=True))
          PY

      - name: record Modal YouTube byte health
        if: env.skip_deploy != 'true'
        run: |
          python - <<'PY'
          import json
          import modal
          result = modal.Function.from_name(
              "valmera-executor", "probe", environment_name="main").remote({
                  "id": None,
                  "type": "ytprobe",
                  "project_id": "provider-health",
                  "user_id": None,
                  "attempts": 0,
                  "payload": {"timeout_s": 120},
              })
          verdict = (result or {}).get("result") or {}
          assert verdict.get("provider") == "modal", result
          print(json.dumps({
              "ok": verdict.get("ok"),
              "strategy": verdict.get("strategy"),
              "why": verdict.get("why"),
              "code": verdict.get("code"),
          }))
          PY
