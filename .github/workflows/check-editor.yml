name: check-editor
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'worker/**'
      - '.github/workflows/check-editor.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [backend, worker]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valmera_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: valmera_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U valmera_test -d valmera_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '${{ matrix.service }}/requirements.txt'
      - uses: actions/setup-node@v4
        if: matrix.service == 'worker'
        with:
          node-version: '24'
      - name: Verify Cloudflare reservation behavior
        if: matrix.service == 'worker'
        working-directory: worker/cloudflare
        run: npm ci && npm run check
      - name: Install media tools
        if: matrix.service == 'worker'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core fonts-noto-core fonts-noto-cjk
          # Test against the ffmpeg the executor images ship
          # (worker/Dockerfile.cloudflare FFMPEG_STATIC), not Ubuntu's older
          # package: colour-matrix handling and filter options differ between
          # 6.x and 8.x, so a 6.x run tests a renderer production never runs.
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          sudo install -m755 /tmp/ffmpeg-*/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m755 /tmp/ffmpeg-*/bin/ffprobe /usr/local/bin/ffprobe
          rm -rf /tmp/ff.tar.xz /tmp/ffmpeg-*
          ffmpeg -version | head -1
      - name: Install pinned dependencies
        run: python -m pip install -r '${{ matrix.service }}/requirements.txt' pytest
      - name: Install headless Chromium for motion-engine tests
        if: matrix.service == 'worker'
        run: python -m playwright install --with-deps --only-shell chromium || echo "::warning::Chromium unavailable; motion render tests will skip"
      - name: Verify editor behavior without production services
        env:
          DATABASE_URL: postgresql://stub/stub
          SKIP_DB_INIT: '1'
          PYTHONPATH: '${{ matrix.service }}'
          QUEUE_TEST_DATABASE_URL: postgresql://valmera_test:test@localhost:5432/valmera_test
        run: python -m pytest -q '${{ matrix.service }}/tests'
