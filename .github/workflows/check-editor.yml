name: check-editor
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'worker/**'
      - '.github/workflows/check-editor.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [backend, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '${{ matrix.service }}/requirements.txt'
      - name: Install media tools
        if: matrix.service == 'worker'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core fonts-noto-core fonts-noto-cjk
      - name: Install pinned dependencies
        run: python -m pip install -r '${{ matrix.service }}/requirements.txt' pytest
      - name: Verify editor behavior without production services
        env:
          DATABASE_URL: postgresql://stub/stub
          SKIP_DB_INIT: '1'
          PYTHONPATH: '${{ matrix.service }}'
        run: python -m pytest -q '${{ matrix.service }}/tests'
