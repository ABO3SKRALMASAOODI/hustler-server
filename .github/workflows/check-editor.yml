name: check-editor
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'worker/**'
      - '.github/workflows/check-editor.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [backend, worker]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valmera_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: valmera_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U valmera_test -d valmera_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '${{ matrix.service }}/requirements.txt'
      - uses: actions/setup-node@v4
        if: matrix.service == 'worker'
        with:
          node-version: '24'
      - name: Verify Cloudflare reservation behavior
        if: matrix.service == 'worker'
        working-directory: worker/cloudflare
        run: npm ci && npm run check
      - name: Install media tools
        if: matrix.service == 'worker'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core fonts-noto-core fonts-noto-cjk
      - name: Install pinned dependencies
        run: python -m pip install -r '${{ matrix.service }}/requirements.txt' pytest
      - name: Verify editor behavior without production services
        env:
          DATABASE_URL: postgresql://stub/stub
          SKIP_DB_INIT: '1'
          PYTHONPATH: '${{ matrix.service }}'
          QUEUE_TEST_DATABASE_URL: postgresql://valmera_test:test@localhost:5432/valmera_test
        run: python -m pytest -q '${{ matrix.service }}/tests'
