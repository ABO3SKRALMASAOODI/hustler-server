# Valmera render box (installed by boxctl to /etc/needrestart/conf.d/).
# Unattended security updates must never restart services by themselves:
# docker/containerd restarts would cut in-flight renders, and admission or
# Caddy restarts belong to a drained, planned window (box/host/maint.sh).
# List only; the box reports pending restarts and reboot-required in its
# health row (app_kv box_health.reboot_required).
$nrconf{restart} = 'l';
